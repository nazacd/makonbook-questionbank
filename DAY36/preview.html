rect measurements as evidence it represents biomechanics accurately.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The text describes the CNN model Melis et al. built and says its output matched prior studies that measured muscle activity directly.\n\nThat match is cited as one sign that the model is accurate, so the purpose is to present evidence for the model's efficacy.\n\n- A: The text does not explain why they used a model instead of direct measurement.\n- B: It does not describe how they improved the model's accuracy.\n- D: The prior results came from direct measurement, not other researchers' models.\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Text Structure and Purpose", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #6 (csv 3728)", "subject": "english", "originals": {}, "csv": {"passage": "In their study of the steering muscles regulating sclerites (minute hardened structures) in the Drosophila (fruit fly) wing hinge, Johan M. Melis et al. used machine learning to devise a convolutional neural network (CNN) model capable of predicting the pattern of wing motion produced by the maximum activity of the muscles. The CNN model’s output aligned with results of prior studies by other researchers measuring muscle activity patterns directly—one of several indications, said Melis et al., that the model accurately represents important biomechanical processes underlying wing motion.", "question": "Which choice best states the main purpose of the text?", "choices": {"A": "To account for Melis et al.’s reliance in their study on a CNN model in lieu of direct measurement", "B": "To provide an overview of how Melis et al. honed the accuracy of their CNN model", "C": "To present evidence from Melis et al.’s study in support of the efficacy of their CNN model", "D": "To compare results obtained by Melis et al. using their CNN model to prior results obtained from other researchers’ models"}}}, {"qid": "english-m2-07", "type": "mcq", "passage": "The following text is from Julia Alvarez’s 2000 novel *In the Name of Salomé*. The narrator and her sister, daughters of a famous poet, are being tutored by Alejandro Román.\n\nOur tutor, Alejandro Román, brought his younger brother, Miguel, to class one day. By now I was eighteen and had learned everything Alejandro had to teach me, so I was glad for a new face. Miguel was an aspiring poet, and he had heard from his brother that the Ureña girls were none other than the daughters of Nicolás Ureña, and they were smart as clockwork. Miguel was hoping not only to meet us but to make the acquaintance of the poet himself at Mamá’s house.\n\n©2000 by Julia Alvarez", "stem": "Based on the text, why does Miguel accompany his brother to the sisters’ house one day?", "choices": {"A": "Miguel has not received formal instruction in poetry and wants to ask the sisters’ famous father to be his mentor.", "B": "Miguel wants to recite his poems to the sisters and inquire about their perspectives on his work.", "C": "Miguel has learned all his brother can teach him and now desires to be taught by the sisters.", "D": "Miguel anticipates having the opportunity to be introduced to both the sisters and their father."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "The text says Miguel hoped 'not only to meet us but to make the acquaintance of the poet himself,' meaning both the sisters and their father.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "Miguel hoped to meet the sisters and also to meet the poet, their father.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The text says Miguel had heard the Ureña girls were daughters of the poet Nicolás Ureña.\n\nIt adds that Miguel hoped \"not only to meet us but to make the acquaintance of the poet himself.\" So he expects to meet both the sisters and their father.\n\n- A: Nothing says Miguel lacks training or wants a mentor.\n- B: Nothing says he plans to recite poems or ask for opinions.\n- C: It is the narrator, not Miguel, who had learned all Alejandro could teach.\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Central Ideas and Details", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #7 (csv 3729)", "subject": "english", "originals": {}, "csv": {"passage": "The following text is from Julia Alvarez’s 2000 novel In the Name of Salomé. The narrator and her sister, daughters of a famous poet, are being tutored by Alejandro Román. Our tutor, Alejandro Román, brought his younger brother, Miguel, to class one day. By now I was eighteen and had learned everything Alejandro had to teach me, so I was glad for a new face. Miguel was an aspiring poet, and he had heard from his brother that the Ureña girls were none other than the daughters of Nicolás Ureña, and they were smart as clockwork. Miguel was hoping not only to meet us but to make the acquaintance of the poet himself at Mamá’s house. ©2000 by Julia Alvarez", "question": "Based on the text, why does Miguel accompany his brother to the sisters’ house one day?", "choices": {"A": "Miguel has not received formal instruction in poetry and wants to ask the sisters’ famous father to be his mentor.", "B": "Miguel wants to recite his poems to the sisters and inquire about their perspectives on his work.", "C": "Miguel has learned all his brother can teach him and now desires to be taught by the sisters.", "D": "Miguel anticipates having the opportunity to be introduced to both the sisters and their father."}}}, {"qid": "english-m2-08", "type": "mcq", "passage": "Motivated to sell as many paintings as possible, Alfred Hair, an influential figure among the landscape artists known as the Florida Highwaymen, pioneered “fast painting,” which in part involved swift applications of paint. That many of Hair’s acolytes, including Livingston Roberts, imitated the technique accounts in part for the impressionistic qualities that are now synonymous with the group’s shared aesthetic. But not all Highwaymen fully embraced this approach; for instance, though Charles Walker was also prolific, his paintings were executed with greater attention to detail.", "stem": "What does the text most strongly suggest about paintings by Roberts?", "choices": {"A": "Roberts’s reliance on the technique of fast painting likely accounts for his works being more aesthetically interesting than works by Walker are.", "B": "The lack of precision with which they were executed suggests that they are inferior to works by either Hair or Walker.", "C": "Although it is evident that Roberts adopted some of Hair’s preferred techniques, Roberts’s works are less derivative of works by Hair than is typically acknowledged.", "D": "Because of the manner in which they were created, they likely have visual qualities that are regarded as more typical of Florida Highwaymen paintings than the qualities in works by Walker are."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "yellow", "risk_reasons": ["sonnet medium"], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "Roberts imitated fast painting, which accounts for the impressionistic qualities now synonymous with the group's aesthetic, while Walker painted with more detail; so Roberts's works likely look more typical of the group.", "matches_key": true, "matc ce, though Charles Walker was also prolific, his paintings were executed with greater attention to detail.", "question": "What does the text most strongly suggest about paintings by Roberts?", "choices": {"A": "Roberts’s reliance on the technique of fast painting likely accounts for his works being more aesthetically interesting than works by Walker are.", "B": "The lack of precision with which they were executed suggests that they are inferior to works by either Hair or Walker.", "C": "Although it is evident that Roberts adopted some of Hair’s preferred techniques, Roberts’s works are less derivative of works by Hair than is typically acknowledged.", "D": "Because of the manner in which they were created, they likely have visual qualities that are regarded as more typical of Florida Highwaymen paintings than the qualities in works by Walker are."}}}, {"qid": "english-m2-09", "type": "mcq", "passage": "While US public charities, like Commonfund, must file Form 990 yearly with the IRS, private foundations, such as Lilly Endowment Inc., must file a different form, 990-PF. In addition, foundations that engage in certain prohibited activities must also file Form 4720 and pay a penalty tax on the money involved. Private foundations are prohibited from holding excess interests in a business enterprise, “self-dealing” (conducting activities that benefit foundation insiders), making taxable expenditures such as outlays for lobbying, and failing to cross a required threshold in making charitable distributions from income. Out of the organizations that filed Form 990-PF in the years 2003–2005, ______", "stem": "Which choice most effectively uses data from the graph to complete the assertion?", "choices": {"A": "those that were also required to file Form 4720 because they had excess holdings in a business enterprise paid, on average, a larger penalty than those organizations that filed Form 4720 because they engaged in self-dealing.", "B": "those that also filed Form 4720 collectively paid larger penalties for failing to meet the minimum charitable distribution requirement than for other reasons.", "C": "a smaller percentage of those that also filed Form 4720 did so because they engaged in self-dealing than the percentage of those that filed Form 4720 because they did not meet the minimum charitable distribution requirement.", "D": "those that also filed Form 4720 paid a larger penalty for failing to meet a minimum charitable distribution requirement than those organizations that filed Form 990 but also filed Form 4720 for the same reason."}, "bank_key": "B", "key": "B", "verdict": "broken", "proposed_key": null, "issues": [{"kind": "missing_image", "severity": "blocking", "source": "figure", "detail": "The stem asks to use \"data from the graph\" but the graph image (import-14-english-module_2-q9-visual.svg) cannot be opened, so choices A, B and C cannot be checked.", "by": "opus"}, {"kind": "off_format", "severity": "cosmetic", "source": "question", "detail": "The bank passage ends with a stray word after the blank: \"[[BLANK]] blank\".", "by": "opus"}], "risk": "red", "risk_reasons": ["verdict broken", "transcription low", "blocking: missing_image"], "blind_solves": [{"solver": "opus", "answer": "none", "confidence": "low", "reasoning": "The question asks for data from a graph, but no graph or figure was provided, so the choices can't be checked against the data. Choice D can be ruled out because it compares with Form 990 filers, who are outside the 990-PF group the sentence is about, but A, B and C each depend on graph values that are missing.", "matches_key": false, "matches_bank_key": false}, {"solver": "sonnet", "answer": "none", "confidence": "low", "reasoning": "The question depends on a graph that is not provided (figures is empty), so the correct choice cannot be determined.", "matches_key": false, "matches_bank_key": false}], "explanation": {"text": "The question asks which claim matches the data in a graph about penalties an xplanation?", "choices": {"A": "There were many more bodies of water in a comparably sized area in the Don basin than in the Volga basin.", "B": "In both the Volga and Don basins, most of the sites from which pottery has been recovered appear to have been seasonal fishing and hunting encampments rather than year-round settlements.", "C": "The people of the Volga basin acquired the techniques used to create pottery for cooking and storing food from the people of the Don basin.", "D": "Across the Volga and Don basins, people had broadly similar access to the same terrestrial and aquatic animal resources."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "If both basins had similar access to the same terrestrial and aquatic resources, local food availability cannot explain the different pottery uses, leaving cultural factors as the explanation. Choice A would instead support a food-availability explanation.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "Similar access to resources rules out food availability, supporting a cultural explanation.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. Courel and colleagues claim that the different pottery uses (terrestrial protein at Volga sites, aquatic protein at Don sites) come from cultural differences, not local food availability.\n2. To support that claim, a finding must rule out food availability as the cause.\n3. If people in both basins had broadly similar access to the same terrestrial and aquatic animals, then food supply cannot explain why the two groups cooked and stored different foods. Culture is the likely reason.\n\n- A: Wrong. More water in the Don basin would suggest food availability explains the difference, which undermines the claim.\n- B: ss to the same terrestrial and aquatic animal resources."}}}, {"qid": "english-m2-11", "type": "mcq", "passage": "To boost the performance of oil-absorbing resins, which are used to remove oil and other organic compounds from wastewater, one team of materials researchers created a resin with a novel—albeit very expensive—monomer (a molecule that can chemically bond with analogous molecules to form polymers) synthesized from β-cyclodextrin. Other researchers have produced resins consisting of various much cheaper, commercially available methacrylate monomers, including one derived from benzyl methacrylate (BZMA). Testing all these resins’ capacity to absorb toluene and trichloromethane, two organic compounds, a scientist concluded that when practical considerations were taken into account, the BZMA-derived resin showed the greatest potential for use in wastewater cleanup.", "stem": "Which finding, if true, would most directly support the scientist’s conclusion?", "choices": {"A": "Whereas the resin synthesized from β-cyclodextrin exhibited the highest absorption capacity for toluene, the BZMA-derived resin and other resins consisting of commercially available methacrylate monomers exhibited the highest absorption capacity for trichloromethane.", "B": "For both toluene and trichloromethane, the BZMA-derived resin exhibited similar absorption capacity as other resins consisting of commercially available methacrylate monomers and a slightly higher absorption capacity than the resin synthesized from β-cyclodextrin.", "C": "For both toluene and trichloromethane, the BZMA-derived resin exhibited only modestly lower absorption capacity than the resin synthesized from β-cyclodextrin but higher absorption capacity than other resins consisting of commercially available methacrylate monomers.", "D": "Relative to the resin synthesized from β-cyclodextrin and to other resins consisting of commercially available methacrylate monomers, the BZMA-derived resin exhibited superior absorption capacity for toluene but not for trichloromethane."}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "Practical considerations means cost: the BZMA resin outperforming the other cheap methacrylate resins while being only modestly below the very expensive β-cyclodextrin resin makes it the best practical option. In B it only matches the other cheap resins, so it would not stand out.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "Nearly as absorbent as the costly resin and better than cheap ones makes BZMA best practically.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. The scientist concluded that, considering practical factors, the BZMA-derived resin has the greatest potential. The β-cyclodextrin resin is very expensive, and the other commercial resins are cheap.\n2. The best support is a finding that the BZMA resin is cheap and also performs nearly as well as the expensive resin while beating the other cheap resins.\n3. Choice C says exactly that: BZMA absorbs only modestly less than the expensive resin but more than the other commercial resins, for both compounds.\n\n- A: Wrong. It does not show BZMA performs best for either compound.\n- B: Wrong. BZMA is only similar to other cheap resins, so nothing sets it apart from them.\n- D: Wrong. BZMA is superior for toluene only, so the advantage is limited and not shown for both compounds.\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Inferences", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #11 (csv 3733)", "subject": "english", "originals": {}, "csv": {"passage": "To boost the performance of oil-absorbing resins, which are used to remove oil and other organic compounds from wastewater, one team of materials researchers created a resin with a novel—albeit very expensive—monomer (a molecule that can chemically bond with analogous molecules to form polymers) synthesized from β-cyclodextrin. Other researchers have produced resins consisting of various much cheaper, commercially available methacrylate monomers, including one derived from benzyl methacrylate (BZMA). Testing all these resins’ capacity to absorb toluene and trichloromethane, two organic compounds, a scientist concluded that when practical considerations were taken into account, the BZMA-derived resin showed the greatest potential for use in wastewater cleanup.", "question": "Which finding, if true, would most directly support the scientist’s conclusion?", "choices": {"A": "Whereas the resin synthesized from β-cyclodextrin exhibited the highest absorption capacity for toluene, the BZMA-derived resin and other resins consisting of commercially available methacrylate monomers exhibited the highest absorption capacity for trichloromethane.", "B": "For both toluene and trichloromethane, the BZMA-derived resin exhibited similar absorption capacity as other resins consisting of commercially available methacrylate monomers and a slightly higher absorption capacity than the resin synthesized from β-cyclodextrin.", "C": "For both toluene and trichloromethane, the BZMA-derived resin exhibited only modestly lower absorption capacity than the resin synthesized from β-cyclodextrin but higher absorption capacity than other resins consisting of commercially available methacrylate monomers.", "D": "Relative to the resin synthesized from β-cyclodextrin and to other resins consisting of commercially available methacrylate monomers, the BZMA-derived resin exhibited superior absorption capacity for toluene but not for trichloromethane."}}}, {"qid": "english-m2-12", "type": "mcq", "passage": "Southwestern Kentucky’s Livingston County is among the most rural counties in the United States: the US Census Bureau classified it as 95.4% rural in 2010. Researchers often struggle to recruit residents of counties like Livingston for inclusion in studies. Melissa Valerio and colleagues tested whether an approach called snowball sampling improves recruitment. Working in two rural counties, they recruited a few people (known as “seeds”) with the characteristics desired for a proposed study and asked them to recruit additional participants from their social networks. Though the seeds were given minimal guidance, many more people they recruited had the desired characteristics for the study than would be expected by chance alone, most likely because ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "most seeds’ social networks include some people who do not know one another and who share few characteristics.", "B": "the seeds’ social networks tend to be somewhat smaller than the networks of people who do not live in rural areas.", "C": "the seeds’ social networks include a high proportion of people who share characteristics with the seeds.", "D": "the characteristics that made the seeds desirable for inclusion in the proposed study may be unknown to some members of the seeds’ social networks."}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "Recruits with minimal guidance having the desired characteristics more often than chance is best explained by social networks being full of people similar to the seeds.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "Seeds whose contacts share their characteristics explain the high match rate.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. The seeds were given minimal guidance, yet the people they recruited often had the desired characteristics, more than chance would predict.\n2. The most logical reason is that the seeds know many people like themselves, since the seeds were chosen for having those characteristics.\n3. Choice C states that the seeds' networks include a high proportion of people who share characteristics with the seeds.\n\n- A: Wrong. Networks of unconnected people with few shared traits would make matching recruits less likely.\n- B: Wrong. Network size does not explain why recruits share the desired characteristics.\n- D: Wrong. If network members did not know the seeds' characteristics, recruits would match less often.\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Inferences", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #12 (csv 3734)", "subject": "english", "originals": {}, "csv": {"passage": "Southwestern Kentucky’s Livingston County is among the most rural counties in the United States: the US Census Bureau classified it as 95.4% rural in 2010. Researchers often struggle to recruit residents of counties like Livingston for inclusion in studies. Melissa Valerio and colleagues tested whether an approach called snowball sampling improves recruitment. Working in two rural counties, they recruited a few people (known as “seeds”) with the characteristics desired for a proposed study and asked them to recruit additional participants from their social networks. Though the seeds were given minimal guidance, many more people they recruited had the desired characteristics for the study than would be expected by chance alone, most likely because [[BLANK]]", "question": "Which choice most logically completes the text?", "choices": {"A": "most seeds’ social networks include some people who do not know one another and who share few characteristics.", "B": "the seeds’ social networks tend to be somewhat smaller than the networks of people who do not live in rural areas.", "C": "the seeds’ social networks include a high proportion of people who share characteristics with the seeds.", "D": "the characteristics that made the seeds desirable for inclusion in the proposed study may be unknown to some members of the seeds’ social networks."}}}, {"qid": "english-m2-13", "type": "mcq", "passage": "In classical Greek and Roman mythology, female characters are typically cast as either villains lacking in psychological depth or passive victims who are marginal to these stories, which usually focus on the exploits of male characters. Recently, a subgenre has emerged in which writers reimagine these stories from the perspectives of their female characters, giving them agency and complex motivations. Purists argue that such efforts represent a distinctively modern tendency to impose our own values on past civilizations, obscuring those civilizations’ beliefs. Defenders of the subgenre counter that reimaginings of the myths for new cultural contexts are almost as old as the myths themselves, suggesting that ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "purists are overlooking a long tradition of adapting Greek and Roman myths to focus on female characters.", "B": "the complex motivations given to female characters in modern retellings of Greek and Roman myths reflect a recent shift toward psychological depth in fictional representation.", "C": "bringing female perspectives to the forefront is not indicative of a novel attitude regarding fidelity to Greek and Roman myths’ ideologies.", "D": "modern writers’ foregrounding of female characters is chiefly motivated by a desire to counterbalance the primacy of male perspectives among earlier adaptations of Greek and Roman myths."}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "yellow", "risk_reasons": ["sonnet medium"], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "Defenders answer the purists' claim that this is a distinctively modern tendency by noting that reimagining is ancient, so foregrounding female perspectives does not show a new attitude toward fidelity. A wrongly claims the old tradition focused on female characters.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "medium", "reasoning": "Defenders say retellings are old, so the modern focus on female perspectives is not a novel attitude toward fidelity; A overreaches about female-focused adaptations.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. Purists say reimagining myths from women's perspectives is a distinctively modern tendency that imposes modern values.\n2. Defenders reply that reimagining myths for new cultural contexts is almost as old as the myths themselves. So the practice of adapting myths is not new, and it does not show a new attitude toward being faithful to the myths' original beliefs.\n3. Choice C says that bringing female perspectives forward does not indicate a novel attitude about fidelity to the myths' ideologies.\n\n- A: Wrong. The defenders' point is about adaptation in general, not a long tradition of focusing on female characters.\n- B: Wrong. It claims a recent shift in fiction, which contradicts the defenders' argument about old practice.\n- D: Wrong. The text says nothing about writers' motives or earlier adaptations' male focus.\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Inferences", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver no verage an array of ______the Nga Awa Purua plant uses a flash steam system that transforms high-temperature geothermal fluid into steam; in Mexico, the Cerro Prieto plant’s dry steam system pumps superheated steam from a reservoir; and in the US, the Mammoth plant’s binary cycle system uses lower-temperature geothermal fluid in conjunction with a secondary fluid.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "technologies, in New Zealand,", "B": "technologies in New Zealand:", "C": "technologies in New Zealand;", "D": "technologies: in New Zealand,"}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "A colon after the complete clause 'leverage an array of technologies' introduces the examples, and 'in New Zealand,' parallels 'in Mexico,' and 'in the US,' in the items that follow.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "Colon after technologies introduces examples; then the introductory phrase takes a comma.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. The text before the blank, \"The world's many geothermal power plants leverage an array of technologies\", is a complete sentence.\n2. What follows lists examples of those technologies, so a colon after \"technologies\" is the right way to introduce them.\n3. \"In New Zealand\" is an introductory phrase before the independent clause \"the Nga Awa Purua plant uses...\", so it needs a comma after it. This parallels \"in Mexico,\" and \"in the US,\".\n\n- A: Wrong. A comma after \"technologies\" would splice two independent clauses.\n- B: Wrong. It puts the colon after \"New Zealand,\" which splits the introductory phrase from its clause.\n- C: Wrong. A semicolon after \"New Zealand\" breaks the phrase from its clause, and the first clause is not joined to the examples.\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Standard English Conventions", "skill": "Boundaries", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #14 (csv 3736)", "subject": "english", "originals": {}, "csv": {"passage": "The world’s many geothermal power plants leverage an array of [[BLANK]]the Nga Awa Purua plant uses a flash steam system that transforms high-temperature geothermal fluid into steam; in Mexico, the Cerro Prieto plant’s dry steam system pumps superheated steam from a reservoir; and in the US, the Mammoth plant’s binary cycle system uses lower-temperature geothermal fluid in conjunction with a secondary fluid.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "technologies, in New Zealand,", "B": "technologies in New Zealand:", "C": "technologies in New Zealand;", "D": "technologies: in New Zealand,"}}}, {"qid": "english-m2-15", "type": "mcq", "passage": "When a given term—“self-fulfilling prophecies” and “role models” are two well-known examples—is generally accepted and frequently used, ______ susceptible to obliteration by incorporation (OBI). In cases of OBI, widely used terms are rarely, if at all, attributed to the individuals who coined them.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "this often becomes", "B": "it often becomes", "C": "they often become", "D": "these often become"}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "The pronoun refers to the singular noun 'a given term,' so 'it often becomes' is correct.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "Singular term needs singular pronoun it, with often becomes.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. The subject of the clause is \"a given term\", which is singular, so the pronoun must be singular.\n2. The pronoun must also refer to a thing, not a person, so \"it\" is correct. \"Often becomes\" agrees with \"it\".\n\n- A: Wrong. \"This\" would be an ambiguous demonstrative and would not clearly refer to the term.\n- C: Wrong. \"They\" is plural and does not agree with \"term\".\n- D: Wrong. \"These\" is plural and does not agree with \"term\".\n\n**Answer:** B", "source": "drafted", "answer_stated": "B", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Standard English Conventions", "skill": "Form, Structure, and Sense", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #15 (csv 3737)", "subject": "english", "originals": {}, "csv": {"passage": "When a given term—“self-fulfilling prophecies” and “role models” are two well-known examples—is generally accepted and frequently used, [[BLANK]] susceptible to obliteration by incorporation (OBI). In cases of OBI, widely used terms are rarely, if at all, attributed to the individuals who coined them.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "this often becomes", "B": "it often becomes", "C": "they often become", "D": "these often become"}}}, {"qid": "english-m2-16", "type": "mcq", "passage": "In medieval Russia, squirrel pelts were used as a commodity currency. By using specific goods like squirrel pelts as common units of exchange, commodity currency economies streamline trade, which is why they often replaced barter economies. Barter economies eschew ______ that requires what economist W.S. Jevons deems a “double coincidence of wants”—in other words, each trading party must want precisely what the other has.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "currency, in favor of a direct trade system", "B": "currency in favor of a direct trade system", "C": "currency, in favor of a direct trade system,", "D": "currency—in favor of a direct trade system"}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "No punctuation belongs between 'currency' and the essential phrase 'in favor of a direct trade system,' or between that phrase and the restrictive 'that' clause.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "Eschew X in favor of Y needs no commas; the clause that requires modifies the trade system.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. The sentence core is \"Barter economies eschew currency in favor of a direct trade system that requires...\". The verb \"eschew\" takes \"currency\" as its object, then \"in favor of...\" follows.\n2. \"That requires...\" modifies \"a direct trade system\". It is essential, so no comma should come before \"that\".\n3. No punctuation is needed between \"currency\" and \"in favor of\", or after \"system\".\n\n- A: Wrong. The comma after \"currency\" is unnecessary.\n- C: Wrong. The commas separate the essential \"that requires...\" clause from \"system\".\n- D: Wrong. The dash is unnecessary and interrupts the verb phrase.\n\n**Answer:** B", "source": "drafted", "answer_stated": "B", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Standard English Conventions", "skill": "Boundaries", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #16 (csv 3738)", "subject": "english", "originals": {}, "csv": {"passage": "In medieval Russia, squirrel pelts were used as a commodity currency. By using specific goods like squirrel pelts as common units of exchange, commodity currency economies streamline trade, which is why they often replaced barter economies. Barter economies eschew [[BLANK]] that requires what economist W.S. Jevons deems a “double coincidence of wants”—in other words, each trading party must want precisely what the other has.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "currency, in favor of a direct trade system", "B": "currency in favor of a direct trade system", "C": "currency, in favor of a direct trade system,", "D": "currency—in favor of a direct trade system"}}}, {"qid": "english-m2-17", "type": "mcq", "passage": "In their attempt to create a quantum random number generator, K. Muhammed Shafi et al. used a continuous-wave diode laser to fire photons at a periodically-poled potassium titanyl phosphate (PPKTP) nonlinear crystal. A plano-convex lens ______the laser on the center of the 10-millimeter-long crystal ensured a spot size (a measure of the beam’s diameter) of 85 micrometers.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "focusing", "B": "focus", "C": "focuses", "D": "focused"}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "The main verb is 'ensured', so the blank needs a nonfinite modifier: 'A lens focusing the laser.' Choice D, 'focused', would mean the lens itself was focused.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "Participle phrase modifying lens; main verb is ensured.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. The sentence already has a main verb, \"ensured\". The subject is \"A plano-convex lens\".\n2. The blank needs a modifier that describes the lens without adding another finite verb. The participle \"focusing\" does this.\n3. \"Focusing the laser on the center of the crystal\" describes what the lens does.\n\n- B: Wrong. \"Focus\" would be a second main verb with no conjunction.\n- C: Wrong. \"Focuses\" would also be a second main verb with no conjunction.\n- D: Wrong. \"Focused\" would be a second main verb in the past tense with no conjunction.\n\n**Answer:** A", "source": "drafted", "answer_stated": "A", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Standard English Conventions", "skill": "Form, Structure, and Sense", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #17 (csv 3739)", "subject": "english", "originals": {}, "csv": {"passage": "In their attempt to create a quantum random number generator, K. Muhammed Shafi et al. used a continuous-wave diode laser to fire photons at a periodically-poled potassium titanyl phosphate (PPKTP) nonlinear crystal. A plano-convex lens [[BLANK]]the laser on the center of the 10-millimeter-long crystal ensured a spot size (a measure of the beam’s diameter) of 85 micrometers.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "focusing", "B": "focus", "C": "focuses", "D": "focused"}}}, {"qid": "english-m2-18", "type": "mcq", "passage": "For her installation The Last Cruze, photographer LaToya Ruby Frazier traveled to Lordstown, Ohio, where she documented the lives of workers at the local automobile plant. In the installation, text culled from a series of in-depth interviews with employees and their families ______sixty-seven gelatin silver prints, highlighting the collaborative, documentary nature of Frazier’s work.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "punctuating", "B": "punctuates", "C": "punctuate", "D": "are punctuated by"}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "The sentence needs a main verb that agrees with the singular subject 'text', so 'punctuates' is correct. Choice D gets the meaning backward and does not agree with the subject.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "Singular subject text takes singular verb punctuates with object prints.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. The subject is \"text\", which is singular. The phrase \"culled from... families\" is a modifier.\n2. The sentence needs a single present-tense main verb that agrees with \"text\" and takes \"sixty-seven gelatin silver prints\" as its object. \"Punctuates\" fits.\n3. The participial phrase \"highlighting...\" then follows correctly.\n\n- A: Wrong. \"Punctuating\" is not a finite verb, so the sentence would have no main verb.\n- C: Wrong. \"Punctuate\" is plural and does not agree with \"text\".\n- D: Wrong. \"Are punctuated by\" is plural, and it reverses the roles of text and prints.\n\n**Answer:** B", "source": "drafted", "answer_stated": "B", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Standard English Conventions", "skill": "Form, Structure, and Sense", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #18 (csv 3740)", "subject": "english", "originals": {}, "csv": {"passage": "For her installation The Last Cruze, photographer LaToya Ruby Frazier traveled to Lordstown, Ohio, where she documented the lives of workers at the local automobile plant. In the installation, text culled from a series of in-depth interviews with employees and their families [[BLANK]]sixty-seven gelatin silver prints, highlighting the collaborative, documentary nature of Frazier’s work.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "punctuating", "B": "punctuates", "C": "punctuate", "D": "are punctuated by"}}}, {"qid": "english-m2-19", "type": "mcq", "passage": "A single specimen of T. parkerae, collected at a depth of 1,856 fathoms (3,394 meters) in the South Pacific, and a single specimen of G. hirsuta, collected at a depth of 620 fathoms (1,134 meters) in the North Atlantic, have been preserved as exemplars of their respective ______ former in a repository at Washington, DC’s Museum of Natural History and the latter in a repository at London’s Natural History Museum.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "species; the", "B": "species. The", "C": "species, the", "D": "species, and the"}, "bank_key": "A", "key": "C", "verdict": "key_wrong", "proposed_key": "C", "issues": [{"kind": "wrong_key", "severity": "content", "source": "question", "detail": "The key \"species; the\" puts a semicolon before the verbless absolute phrase \"the former in a repository ... and the latter in a repository ...\", which is not an independent clause; the correct answer is \"species, the\" (C).", "by": "opus"}], "risk": "red", "risk_reasons": ["verdict key_wrong"], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "\"The former in a repository...\" has no finite verb, so it is an absolute phrase that must attach to the main cla pective species,\" is a complete independent clause.\n2. The text after the blank, \"the former in a repository at Washington, DC's Museum of Natural History and the latter in a repository at London's Natural History Museum,\" has no finite verb: it is two noun phrases each followed by a prepositional phrase, i.e., an absolute phrase modifying the main clause.\n3. A semicolon (A) and a period (B) must be followed by an independent clause; here each leaves \"the former in a repository...\" as a fragment.\n4. \"and\" (D) is a coordinating conjunction that would join the verbless phrase to a full clause as if they were parallel, which they are not.\n5. An absolute phrase attaches to a main clause with a comma, so only \"species, the\" (C) is correct."}, "proposed_fix": {"key": "C"}, "label": "R&W M2 #19 (csv 3741)", "subject": "english", "originals": {}, "csv": {"passage": "A single specimen of T. parkerae, collected at a depth of 1,856 fathoms (3,394 meters) in the South Pacific, and a single specimen of G. hirsuta, collected at a depth of 620 fathoms (1,134 meters) in the North Atlantic, have been preserved as exemplars of their respective [[BLANK]]former in a repository at Washington, DC’s Museum of Natural History and the latter in a repository at London’s Natural History Museum.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "species; the", "B": "species. The", "C": "species, the", "D": "species, and the"}}}, {"qid": "english-m2-20", "type": "mcq", "passage": "In a given rock formation, Fortunian rock from 538 million years ago might directly abut Rhaetian rock from 208.5 million years ago, with millions of years of material missing in between. ______ time did not stand still during these intervening years; the unaccounted-for sedimentary material was likely removed from the stratigraphic record via erosion and weathering.", "stem": "Which choice completes the text with the most logical <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';
  return String(s).split(/\n\s*\n/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}
function card(q){
  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
