ounds within ten seconds after the attacks.\n\nThis answer choice directly supports the claim that the sounds recorded in the study are primarily a response to predators. If the caterpillars emit sounds only during and immediately after the simulated attacks, it strongly suggests that these sounds are a defense mechanism. The timing of the sounds—occurring only during the attacks and stopping shortly afterward—indicates a direct correlation between the sounds and the presence of predators.\n\nExplanation of Incorrect Answers:\n\nA. In most cases, the sound that a caterpillar species produced during simulated attacks was not produced by other caterpillar species during simulated attacks.\n\nThis choice discusses the uniqueness of the sounds produced by different species but does not establish the purpose of the sounds. It does not provide evidence that the sounds are specifically for defense against predators.\n\nB. Caterpillar clicks were emitted in a frequency detectable by birds that prey on caterpillars, but caterpillar whistles were not.\n\nThis choice focuses on the frequency of the sounds and their detectability by predators. While it suggests that some sounds might be detectable by predators, it does not directly support the idea that the sounds are a defensive response to predation.\n\nC. Each caterpillar species tended to produce one sound during simulated attacks, although individuals occasionally made a variety of other sounds during simulated attacks as well.\n\nThis choice mentions the variety of sounds produced by the caterpillars but does not address the timing or purpose of the sounds. It does not provide evidence that the sounds are a defense mechanism against predators.\n\nD. None of the species that emitted sounds did so before the simulated attacks, and nearly all stopped emitting sounds within ten seconds after the attacks.\n\nThis choice is correct because it directly addresses the timing of the sound production in relation to the attacks. The ": true}], "explanation": {"text": "Correct Answer: B) spanning\n\nExplanation:\n\nThe correct answer is \"spanning\" because it fits grammatically into the sentence as a participle modifying \"Virginia\". The phrase \"spanning 5,729 feet in elevation\" acts as an adjectival phrase providing more information about Virginia. Therefore, option B is correct as it uses the participle \"spanning\" appropriately.\n\n**Answer:** B", "source": "bank", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Standard English Conventions", "skill": "Form, Structure, and Sense", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #18 (csv 611)", "subject": "english", "originals": {}, "csv": {"passage": "Virginia, ____ 5,729 feet in elevation, reaches its highest point at Mount Rogers.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "spanned", "B": "spanning", "C": "spans", "D": "span"}}}, {"qid": "english-m1-19", "type": "mcq", "passage": "While the greater adjutant can be found in places like the Inner Gulf of Thailand and Manchar Lake in Pakistan, more than 80 percent of this endangered stork species is found in Assam, India. There, wildlife biologist Dr. Purnima Devi Barman is on the front lines of conservation efforts ______ through community involvement and scientific study, aim to bring adjutants back from near extinction.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "that:", "B": "that;", "C": "that,", "D": "that—"}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "\"that\" begins a restrictive relative clause whose verb is \"aim\"; the comm ealed a previously unrecognized issue that evolutionary biologists need to address"}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "The text describes earlier work on each type of convergence and the gap left in the field, then explains how that gap led to Green and Extavour's study. It places their study in context and does not criticize it.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "The text describes prior work by Chan and Wittkopp and the gap that motivated Green and Extavour's study, placing it in its field.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The answer is C. To situate Green and Extavour’s study in the context of their field because the passage describes previous research by Chan and Wittkopp on convergent evolution, then explains how Green and Extavour built on this work by investigating both types of convergence. The text provides background to place Green and Extavour’s study within the broader scientific discussion on convergence, making this option the most fitting.", "source": "bank", "answer_stated": "C", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Text Structure and Purpose", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #7 (csv 628)", "subject": "english", "originals": {}, "csv": {"passage": "Yingguang Frank Chan and colleagues have explored how convergent evolution—a phenomenon that occurs when the same trait evolves independently in two reproductively separate lineages—can result from a genetic mechanism shared by both lineages. Meanwhile, Patricia J. Wittkopp and colleagues have investigated how convergence occurs throug <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';
  return String(s).split(/\n\s*\n/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}
function card(q){
  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
