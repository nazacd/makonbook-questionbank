body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}

ent when the jobless rate was 3.9% than when it rose to 4.1%.)\n\nExplanation:\n\nThe passage discusses \"left-digit\" bias, where people focus on the first digit of a number and ignore the last, affecting how unemployment rates are reported by journalists. The researchers found that even small changes in unemployment rates that cross a round number (e.g., from 3.9% to 4.0%) influence how newsworthy reporters consider the story.\n\nA. The Bureau of Labor Statistics publishes a report of unemployment rates by state, rounding its statistics to the nearest decimal place: This option is incorrect because it does not directly address the impact of left-digit bias on journalists' coverage.\nB. The mention of high unemployment figures in a newspaper caused consumer spending to drop by almost 2.5% in one city: This option is incorrect because it focuses on the impact of unemployment figures on consumer behavior rather than on journalists' coverage.\nC. A city newspaper ran several stories about joblessness when the unemployment rate reached 5% but quickly stopped coverage once the rate dropped below that threshold: This option is incorrect because it does not specifically address the left-digit bias. It highlights a threshold effect but does not compare similar figures like 3.9% and 4.1%.\nD. A newspaper published significantly fewer stories about local unemployment when the jobless rate was 3.9% than when it rose to 4.1%: This is the correct answer because it directly supports the researchers' finding that journalists' coverage is influenced by the left-digit bias, emphasizing round numbers as more newsworthy.", "source": "bank", "answer_stated": "D", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["content issue: grammar"], "reason": "Key D is correct (a small 3.9% to 4.1% change crossing a round number changed coverage); the missing-article flag is kept as cosmetic typos for C and D, and the duplicate grammar/typo entries were merged.", "proof": null}, "proposed_fix": {"passage": "\"Left-digit\" bias, in which people focus on the first digit of a number and ignore the last, is a well-documented phenomenon that explains why prices tend to end in \"9\". According to a recent study by researchers in California and Sweden, it also influences journalists' coverage of unemployment rates. Even when jobless levels and the amount of change in unemployment rates are similar in two regions, crossing a round number informs reporters' assessment of the story's newsworthiness even when both figures fall within the same margin of error.", "choices.A": "The Bureau of Labor Statistics publishes a report of unemployment rates by state, rounding its statistics to the nearest decimal place.", "choices.C": "A city newspaper ran several stories about joblessness when the unemployment rate reached 5% but quickly stopped coverage of the issue.", "choices.D": "A newspaper published significantly fewer stories about local unemployment when the jobless rate was 3.9% than when it rose to 4.1%."}, "label": "R&W M1 #9 (csv 115)", "subject": "english", "originals": {}, "csv": {"passage": "\"Left-digit\" bias, in which people focus on the first digit of a number and ignore the last, is a welldocumented phenomenon that explains why prices tend to end in \"9\". According to a recent study by researchers in California and Sweden, it also influences journalists' coverage of unemployment rates. Even when jobless levels and the amount of change in unemployment rates are similar in two regions, crossing a round number informs reporters' assessment of the story's news worthiness even when both figures fall within the same margin of error.", "question": "Which finding, if true, would most directly support the researchers' finding?", "choices": {"A": "The Bureau of Labor Statistics publishes a report of unemployment rates by state, rounding its statistics to the nearest decimal place", "B": "The mention of high unemployment figures in a newspaper caused consumer spending to drop by almost 2.5% in one city.", "C": "city newspaper ran several stories about joblessness when the unemployment rate reached 5% but quickly stopped coverage of the issue.", "D": "newspaper published significantly fewer stories about local unemployment when the jobless rate was 3.9% than when it rose to 4.1%."}}}, {"qid": "english-m1-10", "type": "mcq", "passage": "New research suggests that coffee could have a positive effect on cardiovascular health. Although caffeine is coffee's most well-known constituent, the beverage contains more than 100 biologically active components. In a study led by Jiyoung Kim, researchers at Seoul National University concluded that non-caffeinated compounds likely play a role in the positive relationship between coffee consumption and health.", "stem": "Which finding, if true, would most directly support the researchers' conclusion?", "choices": {"A": "Whereas regular coffee contains from 70-140 mg of caffeine per cup, decaf contains approximately 0-7mg", "B": "Decaffeinated coffee causes cells to produce NQO1, an enzyme that has neuroprotective benefits.", "C": "Extracts from caffeinated coffee have been shown to aid weight loss more than a placebo.", "D": "People who drink several cups of coffee every day are less vulnerable to certain diseases."}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "typo", "severity": "cosmetic", "source": "question", "detail": "Choice A reads \"70-140 mg of caffeine per cup, decaf contains approximately 0-7mg\" with inconsistent spacing before the unit.", "by": "sonnet"}, {"kind": "choice_formatting", "severity": "cosmetic", "source": "question", "detail": "Choice A ends without a period: \"approximately 0-7mg\".", "by": "sonnet"}, {"kind": "typo", "severity": "cosmetic", "source": "question", "detail": "Choice A reads \"0-7mg\" with no space before the unit and ends without a period.", "by": "sonnet"}], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "The conclusion is that non-caffeinated compounds contribute to coffee's health benefits; a benefit produced by decaffeinated coffee isolates those compounds directly.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "Decaf coffee producing a beneficial enzyme shows non-caffeine compounds have a positive effect, directly supporting the conclusion.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Correct Answer: B (Decaffeinated coffee causes cells to produce NQO1, an enzyme that has neuroprotective benefits.)\n\nExplanation:\n\nThe passage discusses the potential positive effects of coffee on cardiovascular health and suggests that non-caffeinated compounds in coffee play a role in these benefits. Therefore, evidence that highlights the benefits of non-caffeinated compounds would directly support the researchers' conclusion.\n\nA. Whereas regular coffee contains from 70-140 mg of caffeine per cup, decaf contains approximately 0-7mg: This option is incorrect because it only compares the caffeine content in regular and decaf coffee without discussing the health benefits of non-caffeinated compounds.\nB. Decaffeinated coffee causes cells to produce NQO1, an enzyme that has neuroprotective benefits: This is the correct answer because it provides evidence that non-caffeinated compounds in coffee (decaf) have specific health benefits, supporting the researchers' conclusion.\nC. Extracts from caffeinated coffee have been shown to aid weight loss more than a placebo: This option is incorrect because it discusses caffeinated coffee and weight loss, which is not directly related to the cardiovascular benefits mentioned in the passage.\nD. People who drink several cups of coffee every day are less vulnerable to certain diseases: This option is too general and does not specifically address the role of non-caffeinated compounds in coffee.", "source": "bank", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #10 (csv 116)", "subject": "english", "originals": {}, "csv": {"passage": "New research suggests that coffee could have a positive effect on cardiovascular health. Although caffeine is coffee's most well-known constituent, the beverage contains more than 100 biologically active components. In a study led by Jiyoung Kim, researchers at Seoul National University concluded that non-caffeinated compounds likely play a role in the positive relationship between coffee consumption and health.", "question": "Which finding, if true, would most directly support the researchers' conclusion?", "choices": {"A": "Whereas regular coffee contains from 70-140 mg of caffeine per cup, decaf contains approximately 0-7mg", "B": "Decaffeinated coffee causes cells to produce NQO1, an enzyme that has neuroprotective benefits.", "C": "Extracts from caffeinated coffee have been shown to aid weight loss more than a placebo.", "D": "People who drink several cups of coffee every day are less vulnerable to certain diseases."}}}, {"qid": "english-m1-11", "type": "mcq", "passage": "It was only when Alma Thomas turned away from figurative art and toward abstraction that she rose to acclaim as an artist. When the solidity of her line gave way to broken, vibrant colors, the beauty she had long seen emerged.", "stem": "Which choice, if true, would most effectively support the writer's claim?", "choices": {"A": "Her painting Starry Night and the Astronauts (1972) includes a small kaleido scope of red, orange, and yellow that suggests the spaceship Apollo 10.", "B": "Thomas was fascinated by the natural world, incorporating everything from the flowers in her garden to the stars in the night sky into her paintings.", "C": "Her Still Life with Vases and Flowers (1964), which contains realistic images, feels labored, whereas Lunar Surface (1970) glows with rich splashes of purple and blue.", "D": "Although Thomas's own works focused on nature, she believed that art could also evoke the energy of airplanes, cars, skyscrapers, and electric signals."}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "typo", "severity": "cosmetic", "source": "question", "detail": "Choice A contains \"kaleido scope\" instead of \"kaleidoscope\".", "by": "opus"}], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "The claim contrasts her weaker figurative work with her acclaimed abstract color work; only C contrasts a labored realistic piece with a glowing color-based abstract one.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "It contrasts a realistic, labored painting with a glowing abstract one, supporting the claim that abstraction brought out her beauty.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. The writer claims Alma Thomas rose to acclaim only after she moved from figurative art to abstraction, when solid lines gave way to broken, vibrant color.\n2. Evidence that supports this must contrast her figurative work with her abstract work and show the abstract work succeeding.\n3. Choice C does this: the realistic *Still Life with Vases and Flowers* \"feels labored,\" while the abstract *Lunar Surface* \"glows with rich splashes of purple and blue.\"\n\nA: describes colors in one abstract painting but gives no comparison with her figurative work.\nB: describes what inspired her but says nothing about the shift to abstraction or acclaim.\nD: describes her beliefs about art, not the effect of the shift.\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "mismatch", "disputed_quote": "Lunar Surface (1971)", "by": "opus"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["bank explanation mismatch"], "reason": "Key C is correct (only choice contrasting a labored realistic work with a glowing abstract one); the bank explanation misquotes the choice (Lunar Surface \"1971\" vs \"1970\"), so a replacement is supplied, and the duplicate kaleidoscope typo was merged.", "proof": null}, "proposed_fix": {"choices.A": "Her painting Starry Night and the Astronauts (1972) includes a small kaleidoscope of red, orange, and yellow that suggests the spaceship Apollo 10."}, "label": "R&W M1 #11 (csv 117)", "subject": "english", "originals": {}, "csv": {"passage": "It was only when Alma Thomas turned away from figurative art and toward abstraction that she rose to acclaim as an artist. When the solidity of her line gave way to broken, vibrant colors, the beauty she had long seen emerged.", "question": "Which choice, if true, would most effectively support the writer's claim?", "choices": {"A": "Her painting Starry Night and the Astronauts (1972) includes a small kaleido scope of red, orange, and yellow that suggests the spaceship Apollo 10.", "B": "Thomas was fascinated by the natural world, incorporating everything from the flowers in her garden to the stars in the night sky into her paintings.", "C": "Her Still Life with Vases and Flowers (1964), which contains realistic images, feels labored, whereas Lunar Surface (1970) glows with rich splashes of purple and blue.", "D": "Although Thomas's own works focused on nature, she believed that art could also evoke the energy of airplanes, cars, skyscrapers, and electric signals."}}}, {"qid": "english-m1-12", "type": "mcq", "passage": "The following text is from Sandra Cisnero's 1983 novel entitled, The House on Mango Street. In the novel, the narrator is a young girl who lives in a house with her family on Mango Street.\n\n\"One day, I will pack my bags of books and paper. One day, I will say goodbye to Mango. I am too strong for her to keep me here forever. One day, I will go away. Friends and neighbors will say, 'What happened to that Esperanza? Where did she go with all those books and paper? Why did she march so far away?' They will not know I have gone away to come back. For the ones I left behind. For the ones who cannot out.\"", "stem": "What is the main idea of the text?", "choices": {"A": "The narrator is planning on leaving her neighborhood to never return.", "B": "The narrator hopes to one day become a writer.", "C": "The narrator will be missed by her neighbors and friends.", "D": "The narrator explains the reason she will leave her neighborhood."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "typo", "severity": "cosmetic", "source": "question", "detail": "The passage intro reads \"Sandra Cisnero's\" but the author is Sandra Cisneros (\"Cisneros's\").", "by": "opus"}], "risk": "yellow", "risk_reasons": ["sonnet medium"], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "The narrator says she will leave Mango Street but will 'come back' for those left behind, explaining her reason for leaving; A contradicts this.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "medium", "reasoning": "The text states she will leave but come back for those left behind, so A is wrong; D captures that the passage explains her reason for leaving.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Correct Answer: D (The narrator explains the reason she will leave her neighborhood.)\n\nExplanation:\n\nThe passage describes the narrator's future plans to leave her neighborhood and the reasons behind it. The narrator mentions being \"too strong for her to keep me here forever\" and implies a sense of duty to return for those left behind.\n\nA. The narrator is planning on leaving her neighborhood to never return: This option is incorrect because the narrator mentions leaving but also indicates she may return for those left behind.\nB. The narrator hopes to one day become a writer: This option is incorrect because there is no mention of the narrator's aspiration to become a writer in the passage.\nC. The narrator will be missed by her neighbors and friends: This option is incorrect because while the narrator mentions that friends and neighbors will wonder where she went, the focus is on her reasons for leaving.\nD. The narrator explains the reason she will leave her neighborhood: This is the correct answer because the passage primarily discusses the narrator's determination to leave and the underlying reasons for it.", "source": "bank", "answer_stated": "D", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Central Ideas and Details", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver not sure: solver 2 medium", "content issue: typo"], "reason": "Key D is correct (she leaves because she is too strong to stay and will come back for those left behind; A is contradicted); the \"cannot out\" flag was dropped because that is Cisneros's actual wording, and the Cisnero's typo entries were merged.", "proof": null}, "proposed_fix": {"passage": "The following text is from Sandra Cisneros's 1983 novel entitled, The House on Mango Street. In the novel, the narrator is a young girl who lives in a house with her family on Mango Street.\n\n\"One day, I will pack my bags of books and paper. One day, I will say goodbye to Mango. I am too strong for her to keep me here forever. One day, I will go away. Friends and neighbors will say, 'What happened to that Esperanza? Where did she go with all those books and paper? Why did she march so far away?' They will not know I have gone away to come back. For the ones I left behind. For the ones who cannot out.\""}, "label": "R&W M1 #12 (csv 118)", "subject": "english", "originals": {}, "csv": {"passage": "The following text is from Sandra Cisnero's 1983 novel entitled, The House on Mango Street. In the novel, the narrator is a young girl who lives in a house with her family on Mango Street.\n\n\"One day, I will pack my bags of books and paper. One day, I will say goodbye to Mango. I am too strong for her to keep me here forever. One day, I will go away. Friends and neighbors will say, 'What happened to that Esperanza? Where did she go with all those books and paper? Why did she march so far away?' They will not know I have gone away to come back. For the ones I left behind. For the ones who cannot out.\"", "question": "What is the main idea of the text?", "choices": {"A": "The narrator is planning on leaving her neighborhood to never return.", "B": "The narrator hopes to one day become a writer.", "C": "The narrator will be missed by her neighbors and friends.", "D": "The narrator explains the reason she will leave her neighborhood."}}}, {"qid": "english-m1-13", "type": "mcq", "passage": "I Know Why the Caged Bird Sings is a 1969 novel written by Maya Angelou. In the novel, the main character struggles to accept her African American race while growing up in the Southern United States.", "stem": "Which quotation from I Know Why the Caged Bird Sings most effectively supports this claim?", "choices": {"A": "“The dress I wore was light purple. As I’d watched Momma make it, putting fancy stitching on the waist, I knew that when I put it on, I’d look like one of the sweet little white girls who were everyone’s dream of what was right with the world.”", "B": "“When people saw me wearing it, they were going to run up to me and say, ‘Marguerite [sometimes it was ‘dear Marguerite’], forgive us, please, we didn’t know who you were,’ and I would answer generously, ‘No, you couldn’t have known. Of course I forgive you.”", "C": "“Wouldn’t they be surprised when one day I woke out of my black ugly dream, and my real hair, which was long and blonde, would take the place of the kinky mass that Momma wouldn’t let me straighten?”", "D": "“If growing up is painful for the Southern Black girl, being aware of her difference is worse. It is an unnecessary insult.”"}, "bank_key": "D", "key": "C", "verdict": "key_wrong", "proposed_key": "C", "issues": [{"kind": "wrong_key", "severity": "content", "source": "question", "detail": "The key D (\"being aware of her difference is worse. It is an unnecessary insult\") is a general comment, while C (\"woke out of my black ugly dream\") directly shows the character struggling to accept her race.", "by": "opus"}], "risk": "red", "risk_reasons": ["verdict key_wrong"], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "medium", "reasoning": "C shows the narrator wishing to wake from her 'black ugly dream' with blonde hair, directly showing her struggle to accept her race; D is a general statement about Black girls rather than her own struggle.", "matches_key": true, "matches_bank_key": false}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "The narrator imagines waking from her 'black ugly dream' with blonde hair, showing she struggles to accept her race; A and B are weaker, D is a commentary not the character's struggle.", "matches_key": true, "matches_bank_key": false}], "explanation": {"text": "1. The claim is that the main character struggles to accept her African American race. The best quotation must show her own discomfort with being Black.\n2. Choice C does: she calls her Black identity a \"black ugly dream\" and imagines waking up with \"long and blonde\" hair instead of her \"kinky mass.\" That is a direct rejection of her own appearance and race.\n\nA: shows her wanting to look like the \"sweet little white girls,\" which hints at the struggle, but it is about a dress and is less direct than C.\nB: an imagined scene of people apologizing to her; it is about being recognized, not about accepting her race.\nD: a general comment about Southern Black girls and their awareness of difference; it does not show this character's own struggle to accept her race.\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "wrong", "disputed_quote": "it describes a fantasy of having different hair, but it doesn't directly address the broader struggle of accepting her race", "by": "opus"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver disagrees with key: solver 1 says C, key D", "solver not sure: solver 1 medium", "solver disagrees with key: solver 2 says C, key D", "content issue: ambiguous", "explanation checker doubts the key", "explanation reaches another answer: C", "bank explanation wrong"], "reason": "Key D fails because it is a general statement about Southern Black girls that shows no rejection of her own race, while C (\"black ugly dream,\" wishing for blonde hair) directly shows the struggle, so the key should be C; the issue claiming A is equally defensible was dropped because A is clearly weaker.", "proof": "1. The claim to support is specific: the main character struggles to accept her own African American race.\n2. Choice D (\"If growing up is painful for the Southern Black girl, being aware of her difference is worse. It is an unnecessary insult.\") is a generalization about Southern Black girls and the pain of being made aware of difference by others; it says nothing about the main character's own attitude toward her race, and calling the awareness an \"unnecessary insult\" places the fault on society, not on any reluctance by her to accept her race. So D does not show the claimed struggle.\n3. Choice C shows exactly that struggle in the character's own voice: she calls her Black identity a \"black ugly dream\" and imagines her \"real hair\" being \"long and blonde\" in place of her \"kinky mass,\" i.e., she rejects her own racial features.\n4. A (wanting to look like \"the sweet little white girls\") only hints at this through a dress, and B is about imagined recognition and forgiveness, so C is the single choice that directly supports the claim. Both blind solvers independently chose C."}, "proposed_fix": {"key": "C"}, "label": "R&W M1 #13 (csv 119)", "subject": "english", "originals": {}, "csv": {"passage": "I Know Why the Caged Bird Sings is a 1969 novel written by Maya Angelou. In the novel, the main character struggles to accept her African American race while growing up in the Southern United States.", "question": "Which quotation from I Know Why the Caged Bird Sings most effectively supports this claim?", "choices": {"A": "“The dress I wore was light purple. As I’d watched Momma make it, putting fancy stitching on the waist, I knew that when I put it on, I’d look like one of the sweet little white girls who were everyone’s dream of what was right with the world.”", "B": "“When people saw me wearing it, they were going to run up to me and say, ‘Marguerite [sometimes it was ‘dear Marguerite’], forgive us, please, we didn’t know who you were,’ and I would answer generously, ‘No, you couldn’t have known. Of course I forgive you.”", "C": "“Wouldn’t they be surprised when one day I woke out of my black ugly dream, and my real hair, which was long and blonde, would take the place of the kinky mass that Momma wouldn’t let me straighten?”", "D": "“If growing up is painful for the Southern Black girl, being aware of her difference is worse. It is an unnecessary insult.”"}}}, {"qid": "english-m1-14", "type": "mcq", "passage": "In her essay entitled, “Slouching Towards Bethlehem,” Joan Didion describes her experiences in California during the 1960s and 1970s while proving a darker side of this period existed even though it is often admired for its claimed pursuit of peace and love.", "stem": "Which quotation from “Slouching Towards Bethlehem” most effectively supports the claim?", "choices": {"A": "“It was a country of bankruptcy notices and public–auction announcements and commonplace reports of casual killings and misplaced children and abandoned homes and vandals who misplaced even the four– letter words they scrawled.”", "B": "“It was the United States of America in the cold late spring of 1967, and the market was steady and the G.N.P. high and a great many articulate people seemed to have a sense of high social purpose and it might have been a spring of brave hopes and national promise, but it was not, and more and more people had the uneasy apprehension that it was not.”", "C": "“San Francisco was where the missing children were gathering and calling themselves ‘hippies.’ When I first went to San Francisco in that cold late spring of 1967, I did not even know what I wanted to find out, and so I just stayed around awhile, and made a few friends.”", "D": "Adolescents drifted from city to torn city, sloughing off both the past and the future as snakes shed their skins, children who were never taught and would never now learn the games that had held the society together.”"}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "choice_formatting", "severity": "cosmetic", "source": "question", "detail": "Choice D begins \"Adolescents drifted...\" with no opening quotation mark but ends with a closing one.", "by": "opus"}, {"kind": "typo", "severity": "cosmetic", "source": "question", "detail": "Choice A has a stray space in \"four– letter\".", "by": "opus"}] on.\nEvaluation: This choice is incorrect because the seismic activity was not consistently high throughout the period.\n\nCorrect Answer:\nChoice C is the best choice because it highlights a sudden increase in seismic activity just before the eruption, suggesting that such changes can be unpredictable and thus support the difficulty in accurate forecasting.", "source": "bank", "answer_stated": "C", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver disagrees with key: solver 1 says A, key C", "solver not sure: solver 1 medium", "solver not sure: solver 2 medium", "solvers disagree", "content issue: missing_info", "content issue: ambiguous"], "reason": "Ambiguous: the graph confirms C (about 17 on 11/26, about 38 on 11/27) and also A (peaks of 50 to 67 early versus about 15 to 20 just before the eruption), and because the stem's \"geologists' conclusion\" is never stated, which choice supports it cannot be settled.", "proof": null}, "proposed_fix": null, "label": "R&W M1 #15 (csv 121)", "subject": "english", "originals": {"question": "sat/question_images/Screenshot_2024-07-04_175657.png"}, "csv": {"passage": "After 38 years without incident, on November 27, 2022, the Hawaiian volcano Mauna Loa erupted. Mauna Loa and its neighboring volcano, Kilauea, are monitored for seismic activity and elevation changes to provide warnings for potential eruptions. Despite these observations that are conducted over both the short-term and the long-term, accurate forecasting is still difficult.", "question": "Which choice best describes data from the graph that supports the geologists' conclusion?", "choices": {"A": "Seismic activity was higher overall at the beginning of the month than it was later in the month right before the eruption.", "B": "Seismic activity from 11/0 usion explains their source: the social standards of the Elizabethan era; D overclaims Shakespeare's beliefs and C is an off-topic evaluation.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "medium", "reasoning": "The examples show stereotypes; the logical conclusion is that the plays reflected the era's social standards, not claims about Shakespeare's beliefs or speculation.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Correct Answer: A\nExplanation:\nThe passage describes the stereotypical female characters in Shakespeare's plays and their unflattering portrayal. The most logical completion will connect these portrayals to the broader social context of the time.\n\nA. Much of Shakespeare’s writing and the writing of his contemporaries were influenced by the social standards of the Elizabethan Era in which he lived.: This is the correct answer because it logically connects the portrayal of female characters in Shakespeare's plays to the social standards of his time.\nB. Although Queen Elizabeth was on the throne while Shakespeare was writing these plays, literature during this time did not reflect the changing female roles.: This option is incorrect because it contradicts the idea that Shakespeare's writing was influenced by the social standards of his time.\nC. Though Shakespeare was an excellent writer appreciated in both his time and the present, female characters that acted in manners outside of these cliches could have made for even more interesting writing.: This option is incorrect because it does not logically complete the text by explaining the portrayal of female characters in the context of social standards.\nD. William Shakespeare believed that most women in the Elizabethan era fit into these female stereotypes.: This option is incorrect because it is speculative and does not logically complete the text by addressing the influence of social standards.", "source": "bank", r lab animals to gain further insights."}}}, {"qid": "english-m1-18", "type": "mcq", "passage": "The following text is from the short story Marigolds written by Eugenia Collier in 1969.\n\n“Miss Lottie’s marigolds were perhaps the strangest part of the picture. Certainly, they did not fit in with the crumbling decay of the rest of her yard. Beyond the dusty brown yard, in front of the sorry gray house, rose suddenly and shockingly a dazzling strip of bright blossoms, clumped together in enormous mounds, warm and passionate and sun—golden. The old black witch—woman worked on them all summer, every summer, down on her creaky knees, weeding and cultivating and arranging, while the house crumbled and John Burke rocked. For some perverse reason, we children hated those marigolds. They interfered with the perfect ugliness of the place; they were too beautiful; they said too much that we could not understand; they did not make sense.”", "stem": "According to the text, what is true about Miss Lottie’s marigolds?", "choices": {"A": "They are the only beautiful part of the neighborhood.", "B": "The children despise them because they did not understand them.", "C": "The children are intimidated by them because of their beauty.", "D": "Miss Lottie cares more about them than the rest of her house."}, "bank_key": "A", "key": "A", "verdict": "ambiguous", "proposed_key": null, "issues": [{"kind": "ambiguous", "severity": "content", "source": "question", "detail": "Choice B (\"The children despise them because they did not understand them\") echoes \"they said too much that we could not understand\", and choice D is supported by her working on them \"while the house crumbled\", while key A (\"the only beautiful part of the neighborhood\") stretches a text that describes only her yard.", "by": "opus"}], "risk": "red", "risk_reasons": ["verdict ambiguous"], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "The text says the children hated the marigolds because 'they said too much that we could not understand; they did not make sense.'", "matches_key": false, "matches_bank_key": false}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "The text says the children hated the marigolds because they said too much that they could not understand.", "matches_key": false, "matches_bank_key": false}], "explanation": {"text": "Correct Answer: A (They are the only beautiful part of the neighborhood.)\n\nExplanation:\n\nThe passage describes Miss Lottie's marigolds as standing out against the decay and crumbling surroundings. They are depicted as bright, warm, and golden, contrasting sharply with the dreariness of the rest of the yard and neighborhood.\n\nA. They are the only beautiful part of the neighborhood.: This is the correct answer because the text emphasizes that the marigolds do not fit with the \"crumbling decay\" of the rest of the yard, suggesting they are the only beautiful element in the scene.\nB. The children despise them because they did not understand them.: This option is incorrect because, while the children did not understand the marigolds, the primary reason given for their feelings is that the marigolds' beauty interfered with the ugliness of the place.\nC. The children are intimidated by them because of their beauty.: This option is incorrect because the text describes the children's hatred of the marigolds due to their interference with the \"perfect ugliness\" rather than intimidation by their beauty.\nD. Miss Lottie cares more about them than the rest of her house.: This option is incorrect because the passage does not compare Miss Lottie's care for the marigolds to her care for the house. It only describes her diligent work on the marigolds.", "source": "bank", "answer_stated": "A", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Central Ideas and Details", "difficulty": "medium", "difficulty_sourc ically modify \"emulsifiers.\"\n- C (\"They are used\") makes the phrase an independent clause, which is then joined to \"emulsifiers are compounds...\" with only a comma: a comma splice.\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "wrong", "disputed_quote": "This phrase is more verbose and less direct than simply using \"Used.\"", "by": "opus"}, "tags": {"domain": "Standard English Conventions", "skill": "Form, Structure, and Sense", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["bank explanation wrong"], "reason": "Key D is correct (the past participle \"Used\" modifies \"emulsifiers\"); the explanation is replaced because the bank's rejects C as \"verbose\" when C is in fact a comma splice.", "proof": null}, "proposed_fix": null, "label": "R&W M2 #17 (csv 150)", "subject": "english", "originals": {}, "csv": {"passage": "In the cosmetic industry, emulsifiers like polysorbate 80 allow chemicals to blend water and oil into homogenous formulations, like lotions and perfumes. ________ in everything from food to cleaning products, emulsifiers are compounds that serve to stabilize an emulsion- a mixture of two or more liquids that otherwise would not easily blend together.", "question": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "Using", "B": "To use", "C": "They are used", "D": "Used"}}}, {"qid": "english-m2-18", "type": "mcq", "passage": "In Tallinn, Estonia, the average temperature is 57.4 degrees in June, ______ to 63 degrees in July, and then dips slightly to 60 degrees in August.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "rising", "B": "rises", "C": "has risen", "D": "rose"}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "yellow", "risk_reasons": ["sonnet disagrees with the key"], "b <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';
  return String(s).split(/\n\s*\n/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}
function card(q){
  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
