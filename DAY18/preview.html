:root{--bg:#f6f6f8;--card:#fff;--ink:#16141d;--muted:#666;--line:#e3e3e8;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--accent:#6d4ad6}

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}

pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:var(--bg);padding:8px;border-radius:6px}

e’s layout. The researchers explain that trying to find items in new locations causes shoppers to move through more of the store, exposing them to more products and increasing the likelihood that they’ll buy an item they hadn’t planned on purchasing.", "stem": "Which response from a survey given to shoppers who made a purchase at a retail store best supports the researchers’ explanation?", "choices": {"A": "“I needed to buy some cleaning supplies, but they weren’t in their regular place. While I was looking for them, I saw this interesting notebook and decided to buy it, too.”", "B": "“I didn’t buy everything on my shopping list today. I couldn’t find a couple of the items in the store, even though I looked all over for them.”", "C": "“The store sent me a coupon for a new brand of soup, so I came here to find out what kinds of soup that brand offers. I decided to buy a few cans because I had the coupon.”", "D": "“This store is larger than one that’s closer to where I live, and it carries more products. I came here to buy some things that the other store doesn’t always have.”"}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "The researchers say items in new places make shoppers walk through more of the store and buy things they hadn't planned to. In A, the shopper looks for supplies that were moved and buys a notebook on the way, which is exactly that mechanism.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "Only A shows a shopper searching for an item in a changed location and, in the process, noticing and buying an unplanned product.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The response in option A best supports the researchers’ explanation because it describes a shopper who was looking for i I came here to buy some things that the other store doesn’t always have.”"}}}, {"qid": "english-m1-11", "type": "mcq", "passage": "The Cherokee Nation, the Quapaw Tribe, and the more than thirty other tribes in Oklahoma operate numerous businesses and generate billions of dollars in revenue. An economics student is researching the tribes' collective activity as a single industry. The student wants to compare the average amount that industry contributed per employee to Oklahoma's economy with the average amount contributed per employee by three other industries. Looking at the table, the student finds that tribal economic activity contributed over $141,000 per employee, on average, ranking it _____.\n\n**Impact of Four Key Industries on Oklahoma Economy in 2017**\n\n| Industry | Approximate total contribution by industry | Number of people employed by industry | Average contribution per employee by industry |\n|---|---|---|---|\n| Administration/waste | $5,830,600,000 | 96,964 | $60,132 |\n| Construction | $6,797,300,000 | 77,247 | $87,994 |\n| Transportation/warehousing | $12,414,600,000 | 52,891 | $234,720 |\n| Tribal economic activity | $7,312,400,000 | 51,674 | $141,510 |", "stem": "Which choice most effectively uses data from the table to complete the comparison?", "choices": {"A": "above all three of the other industries listed in the table.", "B": "above either administration/waste or construction and nearly equal to transportation/warehousing.", "C": "below all three of the other industries listed in the table.", "D": "below transportation/warehousing but above both construction and administration/waste."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "Tribal activity contributed $141,510 per employee. That is below transportation/warehousing ($234,720) but above construction ($87,994) and administration/waste ($60,132).", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "$141,510 is below transportation/warehousing ($234,720) but above construction ($87,994) and administration/waste ($60,132).", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Looking at the table, the average contribution per employee by industry is:\n\nAdministration/waste: $60,132\nConstruction: $87,994\nTransportation/warehousing: $234,720\nTribal economic activity: $141,510\nFrom this data, we see that tribal economic activity ranks below transportation/warehousing ($234,720) but above both construction ($87,994) and administration/waste ($60,132).\n\n**Answer:** D", "source": "bank", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #11 (csv 862)", "subject": "english", "originals": {"question": "sat/question_images/862.PNG"}, "csv": {"passage": "The Cherokee Nation, the Quapaw Tribe, and the more than thirty other tribes in Oklahoma operate numerous businesses and generate billions of dollars in revenue. An economics student is researching the tribes' collective activity as a single industry. The student wants to compare the average amount that industry contributed per employee to Oklahoma's economy with the average amount contributed per employee by three other industries. Looking at the table, the student finds that tribal economic activity contributed over \\$141,000 per employee, on average, ranking it _____.", "question": "Which choice most effectively uses data from the table to complete the comparison?", "choices": {"A": "above all three of the other industries listed in the table.", "B": "above either administration/waste or construction and nearly equal to transportation/warehousing.", "C": "below all three of the other industries listed in the table.", "D": "below transportation/warehousing but above both construction and administration/waste."}}}, {"qid": "english-m1-12", "type": "mcq", "passage": "Biologist Rosanna Alegado believes that we might learn how multicellular organisms developed from single-celled ones if we understand why the single-celled organism Salpingoeca rosetta, the oldest living relative of animals, sometimes forms colonies of cells. Alegado and colleagues reviewed data from many studies about how S. rosetta responds when exposed to another type of single-celled organism, bacteria, including David C. Edman’s work with Listeria monocytogenes bacteria and Jang Cheon Cho’s work with Crocebacter atlanticus bacteria. Alegado and colleagues concluded that neither L. monocytogenes nor C. atlanticus are likely to have played a significant role in the development of multicellular organisms.", "stem": "Which finding, if true, would most directly support Alegado and colleagues’ conclusion?", "choices": {"A": "S. rosetta did not tend to form colonies when exposed to either L. monocytogenes or C. atlanticus.", "B": "S. rosetta tended to form colonies when exposed to L. monocytogenes and when exposed to C. atlanticus.", "C": "S. rosetta tended to form colonies when exposed to L. monocytogenes, but not when exposed to C. atlanticus.", "D": "S. rosetta tended to form colonies when exposed to C. atlanticus, but not when exposed to L. monocytogenes."}, "bank_key": "B", "key": "A", "verdict": "key_wrong", "proposed_key": "A", "issues": [{"kind": "wrong_key", "severity": "content", "source": "question", "detail": "The bank key is B (\"S. rosetta tended to form colonies when exposed to L. monocytogenes and when exposed to C. atlanticus\"), which contradicts the conclusion that neither bacterium played a role; the correct answer is A.", "by": "opus"}], "risk": "red", "risk_reasons": ["verdict key_wrong"], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "Colony formation is how a bacterium could relate to the rise of multicellularity. If S. rosetta did not form colonies with either bacterium, that supports the conclusion that neither one played a significant role.", "matches_key": true, "matches_bank_key": false}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "If S. rosetta did not form colonies with either bacterium, neither likely played a role in the development of multicellularity.", "matches_key": true, "matches_bank_key": false}], "explanation": {"text": "1. The researchers conclude that neither *L. monocytogenes* nor *C. atlanticus* likely played a significant role in the development of multicellular organisms.\n\n2. The link they study is that bacteria might trigger *S. rosetta* to form colonies, a step toward multicellularity.\n\n3. So the finding that most directly supports the conclusion is that neither bacterium triggered colony formation.\n\n4. Choice A says exactly this: *S. rosetta* did not tend to form colonies when exposed to either bacterium.\n\nWhy the others are wrong:\n- B: colony formation with both bacteria would suggest both might have played a role, which undercuts the conclusion.\n- C: colony formation with *L. monocytogenes* suggests that bacterium may have mattered, which contradicts \"neither.\"\n- D: colony formation with *C. atlanticus* suggests that bacterium may have mattered, which contradicts \"neither.\"\n\n**Answer:** A", "source": "drafted", "answer_stated": "A", "bank_status": "wrong", "disputed_quote": "The most direct support for this conclusion would come from evidence showing that S. rosetta tended to form colonies when exposed to both types of bacteria", "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver disagrees with key: solver 1 says A, key B", "solver disagrees with key: solver 2 says A, key B", "explanation checker doubts the key", "explanation reaches another answer: A", "bank explanation wrong"], "reason": "Key B (colonies with both bacteria) would undercut the conclusion that neither bacterium mattered, so the key is wrong and A is the only choice that supports it; the drafted explanation already explains A.", "proof": "1. The passage ties the bacteria to multicellularity only through whether they make S. rosetta form colonies of cells. 2. The conclusion is that neither L. monocytogenes nor C. atlanticus likely played a significant role. 3. Key B says S. rosetta formed colonies with both bacteria, which would suggest both could have played a role, so it contradicts the conclusion rather than supporting it. 4. C and D each have one bacterium inducing colonies, which contradicts \"neither.\" 5. Only A, no colonies with either bacterium, supports the claim that neither played a role."}, "proposed_fix": {"key": "A"}, "label": "R&W M1 #12 (csv 863)", "subject": "english", "originals": {}, "csv": {"passage": "Biologist Rosanna Alegado believes that we might learn how multicellular organisms developed from single-celled ones if we understand why the single-celled organism Salpingoeca rosetta, the oldest living relative of animals, sometimes forms colonies of cells. Alegado and colleagues reviewed data from many studies about how S. rosetta responds when exposed to another type of single-celled organism, bacteria, including David C. Edman’s work with Listeria monocytogenes bacteria and Jang Cheon Cho’s work with Crocebacter atlanticus bacteria. Alegado and colleagues concluded that neither L. monocytogenes nor C. atlanticus are likely to have played a significant role in the development of multicellular organisms.", "question": "Which finding, if true, would most directly support Alegado and colleagues’ conclusion?", "choices": {"A": "S. rosetta did not tend to form colonies when exposed to either L. monocytogenes or C. atlanticus.", "B": "S. rosetta tended to form colonies when exposed to L. monocytogenes and when exposed to C. atlanticus.", "C": "S. rosetta tended to form colonies when exposed to L. monocytogenes, but not when exposed to C. atlanticus.", "D": "S. rosetta tended to form colonies when exposed to C. atlanticus, but not when exposed to L. monocytogenes."}}}, {"qid": "english-m1-13", "type": "mcq", "passage": "It is common for freshwater lakes near or above a latitude of 45° north of the equator, like Lake Mjøsa in Norway, to accumulate surface ice in winter. The amount and duration of ice depends on many factors, including local weather conditions as well as the lake's depth, volume, and surface area, but a climate researcher claims that some lakes in these latitudes have seen a decline in the duration of ice between the early 1980s and the mid-2000s.\n\n**Days per Winter That Lakes Have Surface Ice**\n\n| Lake | Latitude (degrees) | 1980–81 | 1985–86 | 1990–91 | 1995–96 | 2000–01 | 2005–06 |\n|---|---|---|---|---|---|---|---|\n| Kalmarinjärvi | 62.79 | 198 | 172 | 175 | 184 | 131 | 152 |\n| Lake Neusiedl | 47.82 | 77 | 86 | 87 | 128 | 50 | 104 |\n| Mirror Lake | 43.94 | 122 | 129 | 125 | 136 | 141 | 119 |", "stem": "Which choice best describes data in the table that support the researcher’s claim?", "choices": {"A": "Kalmarinjarvi is at a higher latitude than Mirror Lake and typically had more days of ice per winter than Mirror Lake did.", "B": "Kalmarinjarvi had fewer days of ice in the winter of 2005-06 than it did in the winter of 1980-81.", "C": "Kalmarinjarvi is at a higher latitude than Mirror Lake and typically had fewer days of ice per winter than Mirror Lake did.", "D": "Lake Neusiedl had more days of ice in the winter of 2005-06 than it did in the winter of 1980-81."}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "typo", "severity": "cosmetic", "source": "question", "detail": "The choices spell the lake \"Kalmarinjarvi\" while the table gives \"Kalmarinjärvi\".", "by": "sonnet"}], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "The claim is that ice duration declined from the early 1980s to the mid-2000s. Kalmarinjärvi dropped from 198 days in 1980-81 to 152 in 2005-06, which shows that decline. D describes an increase, and A and C compare latitudes rather than change over time.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "Kalmarinjärvi dropped from 198 ice days in 1980-81 to 152 in 2005-06, a decline; D shows an increase and A and C do not address change over time.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The table shows the number of days per winter that each lake had surface ice. For Kalmarinjarvi, the number of days with surface ice decreased from 1980-81 (198 days) to 2005-06 (152 days). This data supports the researcher’s claim that there has been a decline in the duration of ice between the early 1980s and the mid-2000s.\n\n**Answer:** B", "source": "bank", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #13 (csv 864)", "subject": "english", "originals": {"question": "sat/question_images/864.PNG"}, "csv": {"passage": "It is common for freshwater lakes near or above a latitude of 45° north of the equator, like Lake Mjøsa in Norway, to accumulate surface ice in winter. The amount and duration of ice depends on many factors, including local weather conditions as well as the lake's depth, volume, and surface area, but a climate researcher claims that some lakes in these latitudes have seen a decline in the duration of ice between the early 1980s and the mid-2000s.", "question": "Which choice best describes data in the table that support the researcher’s claim?", "choices": {"A": "Kalmarinjarvi is at a higher latitude than Mirror Lake and typically had more days of ice per winter than Mirror Lake did.", "B": "Kalmarinjarvi had fewer days of ice in the winter of 2005-06 than it did in the winter of 1980-81.", "C": "Kalmarinjarvi is at a higher latitude than Mirror Lake and typically had fewer days of ice per winter than Mirror Lake did.", "D": "Lake Neusiedl had more days of ice in the winter of 2005-06 than it did in the winter of 1980-81."}}}, {"qid": "english-m1-14", "type": "mcq", "passage": "Architects looking for inspiration may examine photographs of iconic buildings such as the Leaning Tower in Pisa. A two-dimensional photograph, however, cannot capture how a building interacts with its surroundings, whether by complementing, blending in with, or perhaps even clashing with sights and activities nearby. An image of the Leaning Tower thus ____.", "stem": "Which choice most logically completes the text?", "choices": {"A": "conceals the subtle deterioration of the building’s materials.", "B": "serves to exaggerate the building’s historical importance.", "C": "misrepresents how the building is perceived by people who have never visited Pisa.", "D": "fails to convey the full impact of the building’s design and structure."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "off_format", "severity": "cosmetic", "source": "question", "detail": "The blank is written as \"____\" (four underscores) in the passage.", "by": "sonnet"}], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "The text says a photograph cannot capture how a building interacts with its surroundings. So an image fails to convey the building's full impact.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "The passage says a photo cannot capture the building's interaction with its surroundings, so it fails to convey the full impact of the design.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The sentence discusses the limitations of a two-dimensional photograph in capturing the full essence of the building’s interaction with its surroundings. The most logical completion is that the image “fails to convey the full impact of the building’s design and structure,” as this aligns with the idea that a photograph cannot capture the three-dimensional and contextual experience of the building.\n\n**Answer:** D", "source": "bank", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Inferences", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #14 (csv 865)", "subject": "english", "originals": {}, "csv": {"passage": "Architects looking for inspiration may examine photographs of iconic buildings such as the Leaning Tower in Pisa. A two-dimensional photograph, however, cannot capture how a building interacts with its surroundings, whether by complementing, blending in with, or perhaps even clashing with sights and activities nearby. An image of the Leaning Tower thus ____.", "question": "Which choice most logically completes the text?", "choices": {"A": "conceals the subtle deterioration of the building’s materials.", "B": "serves to exaggerate the building’s historical importance.", "C": "misrepresents how the building is perceived by people who have never visited Pisa.", "D": "fails to convey the full impact of the building’s design and structure."}}}, {"qid": "english-m1-15", "type": "mcq", "passage": "The Socio-Economic Panel (SOEP) seeks to discover long-term trends  pocket mouse (Perognathus amplus), a result explicable in terms of benefits and costs: greater lunar intensity may not enable the mice to increase foraging success enough to offset the higher chance of detection by predatory owls or hawks. Most other nocturnal mammals respond to lunar intensity variations similarly to Arizona pocket mice, but Azara’s night monkeys (Aotus azarae) display the opposite pattern, as their heavy reliance on visual foraging results in a different balance of reward and risk.", "question": "Which choice best describes the overall structure of the text?", "choices": {"A": "It introduces an observation of a behavioral pattern, presents an explanation for the pattern, and then describes an exception to the pattern that casts doubt on that explanation.", "B": "It describes and accounts for a finding, characterizes the finding as representative of a general pattern, and then describes and accounts for an exception to that pattern.", "C": "It discusses two different responses to the same natural phenomenon, explains why one of those responses occurs, and then suggests that the other response still needs to be explained.", "D": "It presents and explains a study result, indicates that the result is similar to the results of many other studies, and then attributes a conflicting study result to a difference in that study’s methods."}}}, {"qid": "english-m2-06", "type": "mcq", "passage": "**Text 1**\n\nIn 2019 Arequipa, Peru, was named a City of Gastronomy by UNESCO in recognition of the city’s unique food culture. The honor is well known among both residents of the city and tourists who visit. Simply by selecting Arequipa, UNESCO has helped bring awareness to local recipes, cooking practices, and chefs and has provided a significant boost to the city’s tourism industry.\n\n**Text 2**\n\nMany people in Arequipa’s restaurant industry hoped that food tourism would increase after the city was chosen as a City of Gastronomy in 2019. However, as researcher ly brings benefits, such as increased awareness and a boost to the city's tourism industry. In contrast, Text 2 argues that while there may be an expectation of increased food tourism due to the designation, actual benefits require additional efforts, like effective marketing strategies.\n\nSo, Option B accurately describes the difference in how the authors view the benefits of being named a City of Gastronomy.\n\n**Answer:** B", "source": "bank", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Cross-Text Connections", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #6 (csv 887)", "subject": "english", "originals": {"question": "sat/question_images/Screenshot_2024-08-10_at_16.59.56.png"}, "csv": {"passage": null, "question": "Which choice best describes a difference in how the authors of the texts view the benefits of being named a City of Gastronomy?", "choices": {"A": "The author of Text 1 considers the effects of Arequipa’s City of Gastronomy status to be less permanent than the author of Text 2 considers them to be.", "B": "The author of Text 1 states that the benefits are automatic, while the author of Text 2 states that effort is required to fully achieve the benefits.", "C": "The author of Text 1 views Arequipa’s status as a City of Gastronomy as having been beneficial for the city, but the author of Text 2 questions whether there’s been a benefit.", "D": "The author of Text 1 assumes that a city’s restaurant owners and chefs are most likely to benefit from a city being named a City of Gastronomy, but the author of Text 2 states that the honor most affects tour guides and tour operators."}}}, {"qid": "english-m2-07", "type": "mcq", "passage": "Like all species of baleen whales, the sei whale feeds on tiny creatures known as krill by filtering water through bristlelike keratin structures called baleen plates. In this way, baleen whales can eat up to 30 percent of their total mass per day. And while no one would call the sei whale small—it can have a mass as high as 25,000 kg—it is one of the smaller baleen whales and is much smaller than the bowhead whale, which can weigh a whopping 66,000 kg and consume as much as 19,800 kg of krill per day.", "stem": "Based on the text, what can most reasonably be concluded about krill consumption among sei and bowhead whales?", "choices": {"A": "The quantities of krill consumed by bowhead whales has made it difficult for sei whales to find sufficient food.", "B": "Both the sei whale and the bowhead whale can eat as much as 19,800 kg of krill per day.", "C": "Most baleen whales include krill in their diets, but the sei whale is less likely than the bowhead whale to do so.", "D": "The bowhead whale is able to eat more krill per day than the sei whale is."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "A sei whale of at most 25,000 kg eating up to 30 percent of its mass eats at most about 7,500 kg per day, well below the bowhead's 19,800 kg.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "The bowhead is much larger and can eat 19,800 kg per day, while sei whales eat up to 30 percent of a smaller mass, so bowheads eat more.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "\\( 19800 > 0.3 \\cdot 25000 \\)\n\n**Answer:** D", "source": "bank", "answer_stated": "D", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Central Ideas and Details", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #7 (csv 890)", "subject": "english", ainting as a dividing line between an earlier style and later work that never went back, which supports a significant change in her development.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "Saying earlier works belong to a style she never returned to after Harbor Number 1 directly supports a significant change in development.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "C is the correct answer.\n\nThe quotation in answer choice C states, \"The paintings that Martin produced before Harbor Number 1 can be thought of as belonging to her earlier style, to which she never returned.\" This directly supports the claim that Harbor Number 1 marks a significant change in Martin's artistic development by suggesting that her style shifted after this painting and that she did not return to her previous style.\n\n**Answer:** C", "source": "bank", "answer_stated": "C", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #9 (csv 893)", "subject": "english", "originals": {}, "csv": {"passage": "In a paper for an art history class, a student claims that Agnes Martin’s 1957 painting Harbor Number 1 marks a significant change in Martin’s artistic development.", "question": "Which quotation from an art history textbook would most effectively support the student’s claim?", "choices": {"A": "\"Harbor Number 1 has been analyzed extensively since it was first exhibited, as no two viewers seem to agree about exactly what the painting means.\"", "B": "\"Although Martin was clearly influenced by other artists of her time, she was also an artist ahead of her time, as Harbor Number 1 demonstrates.\"", "C": "\"The paintings that Martin produced before Harbor Number 1 can be thought of as belonging to her earlier style, to which she never returned.\"", "D": "\"Of all Martin’s paintings, none so clearly represents her abilities and ideas as Harbor Number 1.\""}}}, {"qid": "english-m2-10", "type": "mcq", "passage": "**Pyramids in Egypt and the Americas**\n\n| Pyramid | Country | Height (meters) | Age (years before present) |\n|---|---|---|---|\n| The Pyramid of the Sun | Mexico | 71.2 | 2,100 |\n| The Pyramid of Djedefre | Egypt | 67 | 4,500 to 4,600 |\n| The Pyramid of Userkaf | Egypt | 49 | 4,400 to 4,500 |\n| El Castillo | Belize | 40 | 1,100 to 1,400 |\n\nA student is writing an essay about four pyramids for a history class and wants to note how long ago each pyramid was built and how tall each pyramid is. Consulting the table, the student finds that El Castillo was built 1,100 to 1,400 years ago and is ______.", "stem": "Which choice most effectively uses data from the table to complete the text?", "choices": {"A": "67 meters tall.", "B": "40 meters tall.", "C": "49 meters tall.", "D": "71.2 meters tall."}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "The table lists El Castillo's height as 40 meters.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "The table lists El Castillo at 40 meters.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "According to the table, El Castillo in Belize is 40 meters tall. Therefore, the correct answer is B.\n\n**Answer:** B", "source": "bank", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #10 (csv 895)", "subject": "english", "originals": {"question": "sat/question_images/Screenshot_2024-08-10_at_17.01.46.png"}, "csv": {"passage": null, "question": "Which choice most effectively uses data from the table to complete the text?", "choices": {"A": "67 meters tall.", "B": "40 meters tall.", "C": "49 meters tall.", "D": "71.2 meters tall."}}}, {"qid": "english-m2-11", "type": "mcq", "passage": "**Studies of the Effects of Tilling vs. No Tilling on Crop Yields**\n\n| Authors | Crop | Crop yield with tilling (kilograms per hectare) | Crop yield with no tilling (kilograms per hectare) |\n|---|---|---|---|\n| Salem Alhajj Ali and colleagues | winter wheat | 3,700 | 5,300 |\n| Nayasha Kafesu and colleagues | maize | 3,078 | 3,574 |\n| G.F. Botta and colleagues | soybeans | 3,300 | 2,700 |\n| Laila Nazirah and colleagues | rice | 4,370 | 2,450 |\n\nLaila Nazirah and colleagues found that tilling—the practice of turning soil with hoes, plows, or other machines before planting crops—was associated with an increased yield of rice. But some studies of other crops have found the opposite effect, raising the question of whether the increase in yield found by Nazirah and colleagues is specific to their study crop. However, this doesn't seem to be the case: ______", "stem": "Which choice most effectively uses data from the table to complete the assertion?", "choices": {"A": "Salem Alhajj Ali and colleagues reported an even larger positive effect of tilling on the yield of winter wheat.", "B": "study using rice yielded 4,370 kilograms per hectare with tilling and only 2,450 kilograms per hectare without tilling.", "C": "crop yields with tilling have ranged from 3,078 kilograms per hectare for maize to 4,370 kilograms per hectare for rice.", "D": "G.F. Botta and colleagues found a similar association in a study using soybeans."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "grammar", "severity": "cosmetic", "source": "question", "detail": "Choice B begins \"study using rice yielded...\" and is missing the leading article \"the\".", "by": "opus"}], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "To show the tilling benefit is not specific to rice, another crop must show higher yield with tilling; soybeans (3,300 vs. 2,700) do, while wheat and maize show the opposite.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "To show the tilling benefit is not specific to rice, another crop must also have higher yield with tilling; soybeans (3,300 vs 2,700) fit.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The table shows that G.F. Botta and colleagues found that soybeans had a higher yield with tilling (3,300 kg/ha) compared to no tilling (2,700 kg/ha). This aligns with the assertion that the increased yield with tilling is not specific to rice but also applies to other crops. Therefore, the correct answer is D.\n\n**Answer:** D", "source": "bank", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["content issue: grammar"], "reason": "Key D stands because only the soybean study (3,300 vs. 2,700) shows a tilling benefit for another crop; the missing article in B is real but cosmetic, the B 'typo' duplicate was merged, and the C lowercase flag was dropped because the choices continue the sentence after the colon.", "proof": null}, "proposed_fix": {"choices.B": "the study using rice yielded 4,370 kilograms per hectare with tilling and only 2,450 kilograms per hectare without tilling."}, "label": "R&W M2 #11 (csv 897)", "subject": "english", "originals": {"question": "sat/question_images/Screenshot_2024-  "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "yellow", "risk_reasons": ["sonnet disagrees with the key", "sonnet medium"], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "If Yupno gestures for the future depend on terrain (uphill vs. downhill) rather than a fixed imagined linear axis, that directly undercuts the claimed universality of linear temporal axes.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "medium", "reasoning": "Using the same hand regardless of past or future shows no left/right temporal axis, supporting the claim that such axes are not universal. B shows a different (uphill/downhill) axis, which is less direct.", "matches_key": false, "matches_bank_key": false}], "explanation": {"text": "Núñez and colleagues claim that the tendency to make temporal distinctions along imagined linear axes is not ubiquitous. The information that Yupno speakers gesture differently depending on their physical orientation (uphill or downhill) rather than along a universal left/right axis supports this claim by showing that Yupno temporal gestures are context-dependent and not aligned with a universal linear axis. Therefore, the correct answer is B.\n\n**Answer:** B", "source": "bank", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver disagrees with key: solver 2 says C, key B", "solver not sure: solver 2 medium", "solvers disagree"], "reason": "Key B stands: future gestures that flip with uphill/downhill terrain show time mapped to the landscape rather than to a fixed imagined linear axis; solver 2's C (same hand for past and future) does not rule out a front/back linear axis, so it does not directly support the claim.", "pro <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';
  return String(s).split(/\n\s*\n/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}
function card(q){
  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
