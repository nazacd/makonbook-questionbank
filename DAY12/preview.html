<script id="data" type="application/json">{"q": [{"qid": "math-m1-01", "type": "mcq", "passage": null, "stem": "The management of a hospital started recording the total time spent by all its doctors to treat patients of an infectious disease at the end of each week as shown.\n\n| Week | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |\n|---|---|---|---|---|---|---|---|---|\n| Total number of hours spent | 80 | 100 | 125 | 156 | 195 | 244 | 305 | 381 |\n\nBased on the data, which of the following is the best estimate of the total number of hours the doctors at the hospital are likely to spend treating patients of the same disease in week 10?", "choices": {"A": "476", "B": "533", "C": "595", "D": "705"}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "Each week's total is about 1.25 times the previous week's (exponential growth). Week 9 is about 381 x 1.25 = 476, so week 10 is about 476 x 1.25 = 595.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "Each week's total is about 1.25 times the previous one (381 in week 8), so week 9 is about 476 and week 10 is about 595.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Look at how each week compares with the one before it. \\( 100/80 = 1.25 \\), \\( 125/100 = 1.25 \\), \\( 156/125 \\approx 1.25 \\), \\( 195/156 \\approx 1.25 \\), and so on. The total grows by about 25% each week, so the data is exponential, with a growth factor of about 1.25.\n\nWeek 8 is 381, so week 9 is about \\( 381 \\times 1.25 \\approx 476 \\).\n\nWeek 10 is about \\( 476 \\times 1.25 \\approx 595 \\). Equivalently, \\( 381 \\times 1.25^2 \\approx 595 \\).\n\nChoice A (476) is the estimate for week 9, not week 10.\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "wrong", "disputed_quote": "Week 8 to Week 9: 76 + 17 (approximated from the pattern) = 93.", "by": "sonnet"}, "tags": {"domain": "Problem-Solving and Data Analysis", "skill": "Two-variable data: models and scatterplots", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #1 (csv 374)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-11_210515.png"}, "csv": {"passage": "The management of a hospital started recording the total time spent by all its doctors to treat patients of an infectious disease at the end of each week as shown. Based on the data, which of the following is the best estimate of the total number of hours the doctors at the hospital are likely to spend treating patients of the same disease in week 10?", "question": "", "choices": {"A": "476", "B": "533", "C": "595", "D": "705"}}}, {"qid": "math-m1-02", "type": "grid_in", "passage": null, "stem": "The parabolas whose equations are shown share the same x-coordinate of their vertices. What is the value of the constant m?\n\n\\[ y = 2(x + 1)^2 - 1 \\]\n\\[ y = -(x + m)^2 + 4 \\]", "choices": null, "bank_key": "1", "key": "1", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "1", "confidence": "high", "reasoning": "The first vertex has x = -1. The second parabola's vertex has x = -m, so -m = -1 and m = 1.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "1", "confidence": "high", "reasoning": "The first vertex has x = -1. The second vertex has x = -m, so -m = -1 and m = 1.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "A parabola written as \\( y = a(x - h)^2 + k \\) has its vertex at \\( (h, k) \\), so its vertex has x-coordinate \\( h \\).\n\nFor \\( y = 2(x + 1)^2 - 1 = 2(x - (-1))^2 - 1 \\), the vertex x-coordinate is \\( -1 \\).\n\nFor \\( y = -(x + m)^2 + 4 = -(x - (-m))^2 + 4 \\), the vertex x-coordinate is \\( -m \\).\n\nSet them equal: \\( -m = -1 \\), so \\( m = 1 \\).\n\n**Answer:** 1", "source": "drafted", "answer_stated": "1", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Advanced Math", "skill": "Nonlinear functions", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #2 (csv 375)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-11_210715.png"}, "csv": {"passage": "The parabolas whose equations are shown share the same x-coordinate of their vertices. What is the value of the constant m?", "question": "", "choices": null}}, {"qid": "math-m1-03", "type": "grid_in", "passage": null, "stem": "In the figure shown, what is the value of x?\n\n![Three intersecting lines forming a triangle, with angle labels x°, 105° and 135° at the three vertices](r2:sat/question_images/Screenshot_2024-07-11_210919.png)", "choices": null, "bank_key": "120", "key": "120", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "120", "confidence": "high", "reasoning": "The marked angles are the triangle's exterior angles, which sum to 360. So x = 360 - 135 - 105 = 120. Check: the interior angles are 45, 75 and 60, which sum to 180.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "120", "confidence": "high", "reasoning": "The triangle's interior angles are 180-135 = 45 and 180-105 = 75, so the third is 60. The angle x is supplementary to it, so x = 120.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Each labeled angle is supplementary to the interior angle of the triangle at that vertex, because it lies on a straight line with it.\n\nAt the right vertex, the interior angle is \\( 180 - 105 = 75 \\). At the bottom-left vertex, the interior angle is \\( 180 - 135 = 45 \\).\n\nThe interior angles of a triangle add to \\( 180 \\), so the top interior angle is \\( 180 - 75 - 45 = 60 \\).\n\nAngle \\( x \\) is supplementary to the top interior angle, so \\( x = 180 - 60 = 120 \\).\n\n(Shortcut: an exterior angle equals the sum of the two remote interior angles, so \\( x = 75 + 45 = 120 \\).)\n\n**Answer:** 120", "source": "drafted", "answer_stated": "120", "bank_status": "wrong", "disputed_quote": "Therefore, x = 120 or 60 or more specific closer angle is 130.", "by": "sonnet"}, "tags": {"domain": "Geometry and Trigonometry", "skill": "Lines, angles, and triangles", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #3 (csv 376)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-11_210919.png"}, "csv": {"passage": "In the figure shown, what is the value of x?", "question": "", "choices": null}}, {"qid": "math-m1-04", "type": "mcq", "passage": null, "stem": "The graph of \\( f(x) = (1/2)^x \\) is shown. Which of the following could be the graph of \\( y = f(x+1) \\)?\n\n![Graph of f(x), a decreasing exponential curve passing through (0, 1) and approaching the x-axis](r2:sat/question_images/Screenshot_2024-07-11_211152.png)", "choices": {"A": "![Graph of f(x) through (0, 1) and f(x+1) through (0, 2), both decreasing toward the x-axis](r2:sat/choice_images/Screenshot_2024-07-11_211209.png)", "B": "![Graph of f(x) through (0, 1) and f(x+1) through (0, 2), f(x+1) levelling off near y = 1](r2:sat/choice_images/Screenshot_2024-07-11_211227.png)", "C": "![Graph of f(x+1) to the left of f(x); f(x) through (0, 1) and f(x+1) through about (0, 0.5)](r2:sat/choice_images/Screenshot_2024-07-11_211242.png)", "D": "![Graph of f(x+1) through (0, 0) and levelling off below the x-axis, f(x) through (0, 1)](r2:sat/choice_images/Screenshot_2024-07-11_211259.png)"}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "f(x+1) is f shifted 1 unit left, and f(0+1) = (1/2)^1 = 0.5. Only graph C has f(x+1) to the left of f(x), passing through (0, 0.5).", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "f(x+1) shifts the graph left 1 unit, so at x = 0 it equals f(1) = 0.5, with the same asymptote y = 0. Only C shows that.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The graph of \\( y = f(x + 1) \\) is the graph of \\( f(x) \\) shifted 1 unit to the left (adding inside the function moves the graph left).\n\nCheck with values: \\( f(0) = (1/2)^0 = 1 \\), but \\( f(0 + 1) = f(1) = 1/2 \\). So the new graph passes through \\( (0, 0.5) \\).\n\nThe horizontal asymptote stays at \\( y = 0 \\), because the shift is only horizontal.\n\nChoices A and B shift the graph up or to the right (they pass through \\( (0, 2) \\)). Choice D shifts the graph down (through \\( (0, 0) \\)). Only choice C shows \\( f(x+1) \\) to the left of \\( f(x) \\) through about \\( (0, 0.5) \\).\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "mismatch", "disputed_quote": "The transformation y = f(x - 1) is a horizontal shift to the right by 1 unit.", "by": "sonnet"}, "tags": {"domain": "Advanced Math", "skill": "Nonlinear functions", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #4 (csv 377)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-11_211152.png", "A": "sat/choice_images/Screenshot_2024-07-11_211209.png", "B": "sat/choice_images/Screenshot_2024-07-11_211227.png", "C": "sat/choice_images/Screenshot_2024-07-11_211242.png", "D": "sat/choice_images/Screenshot_2024-07-11_211259.png"}, "csv": {"passage": "The graph of f(x) = (1/2)ˣ is shown. Which of the following could be the graph of y = f(x+1)?", "question": "", "choices": {"A": "", "B": "", "C": "", "D": ""}}}, {"qid": "math-m1-05", "type": "mcq", "passage": null, "stem": "\\[ px + 3 = -4 + 3(x + 5) \\]\n\nIn the equation shown, p is a constant. For what value of p does the equation have no solutions?", "choices": {"A": "0", "B": "1", "C": "2", "D": "3"}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "The right side simplifies to 3x + 11, giving px + 3 = 3x + 11. With p = 3 the x terms cancel and 3 = 11 is false, so there is no solution.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "The right side simplifies to 3x + 11. With p = 3 the equation becomes 3 = 11, which has no solution.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Simplify the right side: \\( -4 + 3(x + 5) = -4 + 3x + 15 = 3x + 11 \\).\n\nThe equation is \\( px + 3 = 3x + 11 \\). Move the x-terms to one side: \\( (p - 3)x = 8 \\).\n\nAn equation of the form \\( ax = 8 \\) has no solution only when \\( a = 0 \\), because then it says \\( 0 = 8 \\).\n\nSet \\( p - 3 = 0 \\), so \\( p = 3 \\).\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Algebra", "skill": "Linear equations in one variable", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #5 (csv 378)", "subject": "math", "originals": {}, "csv": {"passage": "px+3=-4+3(x+5)\nIn the equation shown, p is a constant. For what value of p does the equation have no solutions?", "question": "", "choices": {"A": "0", "B": "1", "C": "2", "D": "3"}}}, {"qid": "math-m1-06", "type": "mcq", "passage": null, "stem": "Which of the following is an equation for the graph of the circle?\n\n![Circle in the xy-plane with center O (1, 1) and point P (4, 5) on the circle, crossing the axes near x = -4, x = 6, y = 6 and y = -4](r2:sat/question_images/Screenshot_2024-07-11_211635.png)", "choices": {"A": "\\( (x-1)^2 + (y-1)^2 = 5 \\)", "B": "\\( (x-1)^2 + (y-1)^2 = 25 \\)", "C": "\\( (x+1)^2 + (y+1)^2 = 5 \\)", "D": "\\( (x+1)^2 + (y+1)^2 = 25 \\)"}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "The center is (1, 1), and r^2 = (4-1)^2 + (5-1)^2 = 9 + 16 = 25.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "The center is (1,1) and the radius is the distance to (4,5), which is 5, so r^2 = 25.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "A circle with center \\( (h, k) \\) and radius \\( r \\) has equation \\( (x - h)^2 + (y - k)^2 = r^2 \\).\n\nThe center is \\( O(1, 1) \\), so \\( h = 1 \\) and \\( k = 1 \\).\n\nThe radius is the distance from \\( O \\) to \\( P(4, 5) \\): \\( r = \\sqrt{(4-1)^2 + (5-1)^2} = \\sqrt{9 + 16} = 5 \\), so \\( r^2 = 25 \\).\n\nThe equation is \\( (x - 1)^2 + (y - 1)^2 = 25 \\). Choices C and D use the wrong signs for the center, and choice A uses \\( r^2 = 5 \\) instead of 25.\n\n**Answer:** B", "source": "drafted", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Geometry and Trigonometry", "skill": "Circles", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #6 (csv 379)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-11_211635.png"}, "csv": {"passage": "Which of the following is an equation for the graph of the circle?", "question": "", "choices": {"A": "(x-1)²+(y-1)²=5", "B": "(x-1)²+(y-1)²=25", "C": "(x+1)²+(y+1)²=5", "D": "(x+1)²+(y+1)²=25"}}}, {"qid": "math-m1-07", "type": "mcq", "passage": null, "stem": "A swimming pool has a water slide. When a person slides down the slide, they start with an initial speed u, and for every second they slide, their speed increases by approximately 1.5 meters per second. To ensure safety, the person's speed should not exceed 10 meters per second. Additionally, they can slide for no more than 12 seconds. Which of the following systems of inequalities best models this situation, where t is the time, in seconds, after they start sliding?", "choices": {"A": "\\( u + 10 \\le 1.5t \\), \\( t \\ge 12 \\)", "B": "\\( u + 1.5t \\le 10 \\), \\( t \\le 12 \\)", "C": "\\( u + 10 < 1.5t \\), \\( t \\ge 12 \\)", "D": "\\( u + 1.5t < 10 \\), \\( t \\le 12 \\)"}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "The speed is u + 1.5t, and 'should not exceed 10' means u + 1.5t <= 10. 'No more than 12 seconds' means t <= 12.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "Speed after t seconds is u + 1.5t, which must not exceed 10 (so it is at most 10), and t is at most 12.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The speed starts at \\( u \\) and rises 1.5 meters per second each second, so after \\( t \\) seconds the speed is \\( u + 1.5t \\).\n\nThe speed should not exceed 10 meters per second, so \\( u + 1.5t \\le 10 \\).\n\nThe slide lasts no more than 12 seconds, so \\( t \\le 12 \\).\n\n\"Not exceed\" and \"no more than\" allow equality, so use \\( \\le \\), not \\( < \\). Choices A and C reverse the speed condition and use \\( t \\ge 12 \\).\n\n**Answer:** B", "source": "drafted", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Algebra", "skill": "Linear inequalities in one or two variables", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #7 (csv 380)", "subject": "math", "originals": {}, "csv": {"passage": "A swimming pool has a water slide. When a person slides down the slide, they start with an initial speed u, and for every second they slide, their speed increases by approximately 1.5 meters per second. To ensure safety, the person's speed should not exceed 10 meters per second. Additionally, they can slide for no more than 12 seconds. Which of the following systems of inequalities best models this situation, where t is the time, in seconds, after they start sliding?", "question": "", "choices": {"A": "u + 10 ≤ 1.5t, t ≥12", "B": "u + 1.5t ≤ 10, t ≤12", "C": "u + 10 < 1.5t, t ≥ 12", "D": "u + 1.5t < 10, t ≤12"}}}, {"qid": "math-m1-08", "type": "grid_in", "passage": null, "stem": "\\[ 2(z - 5)^2 - 288 = 0 \\]\n\nIn the equation, if \\( z > 0 \\), then what is the value of \\( z \\)?", "choices": null, "bank_key": "17", "key": "17", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "17", "confidence": "high", "reasoning": "(z-5)^2 = 144, so z - 5 = 12 or -12, giving z = 17 or -7. Since z > 0, z = 17.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "17", "confidence": "high", "reasoning": "(z-5)^2 = 144, so z-5 = ±12. With z > 0, z = 17.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Isolate the squared term: \\( 2(z - 5)^2 = 288 \\), so \\( (z - 5)^2 = 144 \\).\n\nTake the square root of both sides: \\( z - 5 = 12 \\) or \\( z - 5 = -12 \\).\n\nSo \\( z = 17 \\) or \\( z = -7 \\).\n\nThe question says \\( z > 0 \\), so \\( z = 17 \\).\n\n**Answer:** 17", "source": "drafted", "answer_stated": "17", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Advanced Math", "skill": "Nonlinear equations in one variable and systems of equations in two variables", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #8 (csv 381)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-10-14_075223.png"}, "csv": {"passage": null, "question": "", "choices": null}}, {"qid": "math-m1-09", "type": "mcq", "passage": null, "stem": "\\[ (2x^2 + 3x - 5) - (x^2 - px + 5) = x^2 + 5x - 10 \\]\n\nIf the given equation is true for all values of x, where p is a constant, then which of the following is the value of p?", "choices": {"A": "-2", "B": "0", "C": "\\( 5/3 \\)", "D": "2"}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "The left side simplifies to x^2 + (3+p)x - 10. Matching the x coefficient gives 3 + p = 5, so p = 2.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "The left side simplifies to x^2 + (3+p)x - 10. Matching the x coefficient gives 3 + p = 5, so p = 2.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Distribute the minus sign on the left side: \\( 2x^2 + 3x - 5 - x^2 + px - 5 \\).\n\nCombine like terms: \\( x^2 + (3 + p)x - 10 \\).\n\nThe equation is \\( x^2 + (3 + p)x - 10 = x^2 + 5x - 10 \\). For it to be true for all x, the coefficients of x must match: \\( 3 + p = 5 \\).\n\nSo \\( p = 2 \\). The \\( x^2 \\) terms and constants already match.\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Advanced Math", "skill": "Equivalent {3}\\)", "B": "\\(1\\)", "C": "\\(\\frac{4}{3}\\)", "D": "\\(3\\)"}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "grammar", "severity": "cosmetic", "source": "question", "detail": "The stem says \"does the equation have only one solution\" although it refers to the system of equations.", "by": "opus"}], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "With x = 1/2, x - y = 1 gives y = -1/2; then 5(1/2) + 3(-1/2) = 1 = 3a, so a = 1/3.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "x=1/2 and x-y=1 give y=-1/2; then 5(1/2)+3(-1/2)=1=3a, so a=1/3.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The solution has \\(x = \\frac{1}{2}\\), so use \\(x - y = 1\\) to find \\(y\\).\n\n\\(\\frac{1}{2} - y = 1\\), so \\(y = -\\frac{1}{2}\\).\n\nSubstitute \\(x = \\frac{1}{2}\\) and \\(y = -\\frac{1}{2}\\) into \\(5x + 3y = 3a\\).\n\n\\(\\frac{5}{2} - \\frac{3}{2} = 3a\\), so \\(1 = 3a\\) and \\(a = \\frac{1}{3}\\).\n\n**Answer:** A", "source": "drafted", "answer_stated": "A", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Algebra", "skill": "Systems of two linear equations in two variables", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["content issue: ambiguous"], "reason": "Key A is correct (x = 1/2 gives y = -1/2, so 3a = 1 and a = 1/3); the \"equation\" for \"system\" wording is only cosmetic, so the ambiguous issue was downgraded to a cosmetic grammar issue.", "proof": null}, "proposed_fix": {"stem": "\\[5x + 3y = 3a\\]\n\n\\[x - y = 1\\]\n\nIn the system of equations shown above, \\(a\\) is a constant. For which value of \\(a\\) does the system have only one solution \\((x, y)\\) such that \\(x = \\frac{1}{2}\\) ?"}, "label": "Math M1 #14 (csv 387)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-11_212943.png"}, "csv": {"passage": "In the system of equations shown above, a is a constant. For which value of a does the equation have only one solution (x, y) such that x = 1/2 ?", "question": "", "choices": {"A": "1/3", "B": "1", "C": "4/3", "D": "3"}}}, {"qid": "math-m1-15", "type": "mcq", "passage": null, "stem": "\\[PV = nRT\\]\n\nThe Ideal Gas Law relates the pressure \\(P\\), volume \\(V\\), and temperature \\(T\\) of \\(n\\) moles of an ideal gas.\n\nIn the equation, \\(R\\) is a constant. Which of the following gives \\(T\\) in terms of \\(P\\), \\(V\\), \\(n\\), and \\(R\\)?", "choices": {"A": "\\(T = \\frac{nR}{PV}\\)", "B": "\\(T = \\frac{nPV}{R}\\)", "C": "\\(T = \\frac{PV}{nR}\\)", "D": "\\(T = \\frac{nV}{PR}\\)"}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "Divide both sides of PV = nRT by nR to get T = PV/(nR).", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "Divide both sides of PV=nRT by nR to get T=PV/(nR).", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Start with \\(PV = nRT\\). The goal is to get \\(T\\) alone.\n\n\\(T\\) is multiplied by \\(nR\\), so divide both sides by \\(nR\\).\n\n\\(T = \\frac{PV}{nR}\\)\n\nThis matches choice C.\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Algebra", "skill": "Linear equations in one variable", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #15 (csv 388)", "subject": "math", "originals": {}, "csv": {"passage": "PV=nRT\nThe Ideal Gas Law relates the pressure P, volume V, and temperature T ^2=10, area=3s^2=30.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. Every angle of a rectangle is a right angle, so the rectangle's diagonal is a diameter of the circle. The diameter is \\(2 \\times 5 = 10\\) cm.\n\n2. Let the shorter side be \\(x\\). The longer side is \\(3x\\).\n\n3. By the Pythagorean theorem, \\(x^2 + (3x)^2 = 10^2\\), so \\(10x^2 = 100\\) and \\(x^2 = 10\\).\n\n4. The area is \\(x \\cdot 3x = 3x^2 = 3(10) = 30\\) square cm.\n\n**Answer:** 30", "source": "drafted", "answer_stated": "30", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Geometry and Trigonometry", "skill": "Circles", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #1 (csv 396)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-11_224712.png"}, "csv": {"passage": "A rectangle is inscribed in a circle, as shown. If the radius of the circle is 5 cm and if the longer side of the rectangle is three times the shorter side, what is the area of the rectangle in square cm?", "question": "", "choices": null}}, {"qid": "math-m2-02", "type": "mcq", "passage": null, "stem": "In the circle with center O, the length of the minor arc AB is \\(3\\pi\\) cm. If the central angle measures \\(30^\\circ\\), what is the diameter of the circle?\n\n![Circle with center O, points A and B on the circle, central angle AOB of 30 degrees](r2:sat/question_images/Screenshot_2024-07-11_224746.png)", "choices": {"A": "6 cm", "B": "12 cm", "C": "18 cm", "D": "36 cm"}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "Arc = (30/360)(circumference), so circumference = 12 * 3pi = 36pi = pi*d, giving d = 36 cm.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "  is 3+1/p, which must equal 10/3, so 1/p=1/3 and p=3.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. Distribute the negative sign: \\((2x^2 + 3x + 1) - (x^2 - \\frac{1}{p}x - 1) = x^2 + \\left(3 + \\frac{1}{p}\\right)x + 2\\).\n\n2. The equation holds for all \\(x\\), so the coefficients of \\(x\\) must match: \\(3 + \\frac{1}{p} = \\frac{10}{3}\\).\n\n3. Subtract 3: \\(\\frac{1}{p} = \\frac{10}{3} - 3 = \\frac{1}{3}\\).\n\n4. Therefore \\(p = 3\\).\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Advanced Math", "skill": "Equivalent expressions", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #3 (csv 398)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-10-14_082654.png"}, "csv": {"passage": null, "question": "", "choices": {"A": "-3", "B": "-1/3", "C": "1/3", "D": "3"}}}, {"qid": "math-m2-04", "type": "mcq", "passage": null, "stem": "Which of the following statements is true about the graph of the function \\(y = \\left(\\frac{2}{3}\\right)^x\\)?", "choices": {"A": "The x-intercept of the graph is at \\((\\frac{2}{3}, 0)\\)", "B": "The y-intercept of the graph is at \\((0, 1)\\)", "C": "As x increases, y increases", "D": "The graph contains the origin \\((0, 0)\\)"}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "At x = 0, y = (2/3)^0 = 1, so the y-intercept is (0, 1); the function is decreasing and never zero.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "At x=0, y=(2/3)^0=1; the function is decreasing, never zero.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": ne regulating the production of IGF-1 (insulin-like growth factor 1) in dogs and found that dogs of the same breed consistently share the same version of the gene. In a discussion of the study, a student hypothesizes that small breeds of dogs (for example, toy poodles) must share a version that represses IGF-1 production that would otherwise confer larger body size.", "question": "Which finding, if true, would most directly weaken the student’s claim?", "choices": {"A": "The majority of the most prevalent dog breeds have limited activity in the gene that regulates IGF-1 production.", "B": "The gene that regulates IGF-1 production is not the only gene that influences body size in dogs but is the only such gene that shows within-breed version consistency.", "C": "The degree of size variation among dogs is greater than that of any other land-based mammal.", "D": "Some breeds with small body sizes and low IGF-1 concentrations have a different version of the gene regulating IGF-1 production than do toy poodles."}}}, {"qid": "english-m2-11", "type": "mcq", "passage": "Scholars cite *Pedro Páramo*, the 1955 novel by Mexican author Juan Rulfo, as a foundational text of magical realism, the Latin American style of fiction in which antirealistic plot devices—often borrowed from the folkloric traditions of Indigenous and colonial societies in the Americas—are deployed in an otherwise realistic mode of representation typical of the modern novel. This style has exerted a decisive influence on authors around the world, including José Saramago, <u>whose 1982 novel *Baltasar and Blimunda* resembles classic magical realist novels in its juxtaposition of literary realism with folklore—namely, that of Portugal.<\/u>", "stem": "Which quotation from a literary scholar would most directly support the claim in the underlined portion of the text?", "choices": {"A": "“While Baltasar and Blimunda alternates between realistic and antirealistic modes of representation, details suggesting the i <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';
  return String(s).split(/\n\s*\n/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}
function card(q){
  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
