pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:var(--bg);padding:8px;border-radius:6px}

k_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "Ephemeral objects serve as evidence of cultural change, so they 'attest to' (give evidence of) shifts in norms that traditional objects may not.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "Ephemeral objects serve as evidence of shifts, so they 'attest to' them.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The text says ephemeral objects are useful as evidence of cultural change, so they must *show* or *confirm* shifts in norms, values, and concerns.\n\n\"Attest to\" means to serve as proof of, which fits.\n\n- A: \"dissociate from\" means to separate from, which doesn't fit evidence of change.\n- B: \"collude with\" means to conspire with, which makes no sense for objects.\n- C: \"compensate for\" means to make up for, which doesn't fit the idea of evidence.\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Words in Context", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #1 (csv 3561)", "subject": "english", "originals": {}, "csv": {"passage": "Studying menus from nineteenth-century restaurants, old coupons clipped out of newspapers, and posters promoting concerts by long-forgotten musicians may seem like a frivolous pursuit, but ephemeral objects like these are useful as evidence of cultural change: they can [[BLANK]] shifts in norms, values, and concerns that traditional objects of historical inquiry may not.", "question": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "dissociate from", "B": "collude with", "C": "compensate for", "D": "attest to"}}}, {"qid": "english-m2-02", "type": "mcq", "passage": "I rial waste and a faster return on investment.", "question": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "Components", "B": "Safeguards", "C": "Proponents", "D": "Epitomes"}}}, {"qid": "english-m2-03", "type": "mcq", "passage": "Run by researchers in Europe, the Survey of Health, Ageing, and Retirement in Europe (SHARE) is an examination of aging that has attempted to track approximately 140,000 people for several years. Long-running studies like this need a lot of participants not merely for statistical robustness but also because of ______: over such a length of time, a substantial number of participants will withdraw or fall out of contact with the researchers.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "attrition", "B": "circumspection", "C": "impartiality", "D": "replicability"}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "The colon explains that many participants withdraw or lose contact over time, which is attrition.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "Participants withdrawing or falling out of contact over time is attrition.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The text says that over a long time, many participants withdraw or fall out of contact.\n\nThat gradual loss of participants is called attrition, which explains why a large number of participants is needed.\n\n- B: \"circumspection\" means caution, which isn't about losing participants.\n- C: \"impartiality\" means fairness, which doesn't match.\n- D: \"replicability\" means the ability to repeat a study, which isn't about participants leaving.\n\n**Answer:** A", "source": "drafted", "answer_stated": "A", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Words in Context", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #3 (csv 3563)", "subject": "english", "originals": {}, "csv": {"passage": "Run by researchers in Europe, the Survey of Health, Ageing, and Retirement in Europe (SHARE) is an examination of aging that has attempted to track approximately 140,000 people for several years. Long-running studies like this need a lot of participants not merely for statistical robustness but also because of [[BLANK]]: over such a length of time, a substantial number of participants will withdraw or fall out of contact with the researchers.", "question": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "attrition", "B": "circumspection", "C": "impartiality", "D": "replicability"}}}, {"qid": "english-m2-04", "type": "mcq", "passage": "Some ethicists challenge the concept of personal character, claiming that if it were meaningful, situational factors could not, as they clearly can, induce behavior contrary to that character. As Rachana Kamtekar observes, this argument is difficult to reconcile with our lay conception of character: we expect a person of helpful character to be frequently helpful, not ______ helpful.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "self-servingly", "B": "sporadically", "C": "grudgingly", "D": "unfailingly"}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "yellow", "risk_reasons": ["sonnet disagrees with the key"], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "The ethicists' argument assumes character means never acting against it; Kamtekar notes the lay view expects frequent, not unfailing, helpfulness, so 'unfailingly' is the contrast that shows the argument demands too much. 'Sporadically' would not conflict with the ethicists' view.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "The contrast with 'frequently helpful' and the argument about behavior contrary to character point to 'sporadically' (only occasionally) as the alternative; Kamtekar says we expect frequent, not sporadic, helpfulness.", "matches_key": false, "matches_bank_key": false}], "explanation": {"text": "The text contrasts what we expect of a helpful person: \"frequently helpful\" versus the blank.\n\nThe ethicists' argument assumes character would mean never acting against it. Kamtekar notes we don't expect that, so we expect frequent help, not *unfailingly* (always) helpful behavior.\n\n\"Unfailingly\" fits the contrast with \"frequently.\"\n\n- A: \"self-servingly\" is about motive, not frequency.\n- B: \"sporadically\" means occasionally, which is close to the opposite of \"frequently\" and wouldn't be contrasted with it by \"not.\"\n- C: \"grudgingly\" is about reluctance, not frequency.\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Words in Context", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver disagrees with key: solver 2 says B, key D", "solvers disagree"], "reason": "Key D stands: the ethicists assume real character would make behavior never contrary to it, and Kamtekar counters that we expect only frequent, not unfailing, helpfulness; \"not sporadically\" (solver 2) merely restates \"frequently\" and does not answer the argument.", "proof": null}, "proposed_fix": null, "label": "R&W M2 #4 (csv 3564)", "subject": "english", "originals": {}, "csv": {"passage": "Some ethicists challenge the concept of person uscripts contain, setting up the 'whereas' contrast showing the HM's distinctive, outlier emphasis.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "The underlined contrast with other manuscripts sets up the HM as distinctive among contemporaries.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The text describes the HM, then the underlined sentence says most contemporary manuscripts like the FA consist of celebrated authors and elite readings.\n\nThe rest of the sentence says the HM, by contrast, emphasizes the popular and practical. So the underlined portion sets up the HM as unlike other manuscripts of its time, an outlier.\n\n- A: The text uses the FA as a comparison, and doesn't say it is a poor one.\n- B: The text doesn't discuss how widespread such collections were.\n- D: The HM was discussed to be contrasted, not to help understand the FA.\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Text Structure and Purpose", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #6 (csv 3566)", "subject": "english", "originals": {}, "csv": {"passage": "The Heege Manuscript (HM) is a collection of booklets of once-unbound paper sheets on which Richard Heege copied various texts at his fifteenth-century home between Derbyshire and Nottinghamshire in England. [[U]]Most other contemporary personal manuscripts like the Findern Anthology (FA) consist primarily of pieces by celebrated medieval authors like Hoccleve and other readings favored by elites,[[/U]] whereas the HM has a distinctive emphasis on the popular, including entertainments like rude comedies, and the practical, with advice about manners.", "question": "Which choice best describes the function of the underlined portion in the text as a whole?", "choices": {"A": "To suggest that the FA is a poor point of comparison for a collection like the HM", "B": "To emphasize the ubiquity of hand-copied collections like the FA and the HM in medieval England", "C": "To provide context for the text's suggestion that the HM is an outlier among collections of its time", "D": "To illustrate how the discussion of the HM earlier in the text can improve historians' understanding of the FA"}}}, {"qid": "english-m2-07", "type": "mcq", "passage": "Text 1 is T. E. Hulme's 1912 poem \"Above the Dock.\" Text 2 is from Amy Lowell's 1912 poem \"The Crescent Moon.\"\n\n**Text 1**\n\nAbove the quiet dock in mid night,\nTangled in the tall mast's corded height,\nHangs the moon. What seemed so far away\nIs but a child's balloon, forgotten after play.\n\n**Text 2**\n\nSlipping softly through the sky\nLittle horned, happy moon,\nCan you hear me up so high?\nWill you come down soon?", "stem": "Which choice best describes a notable difference in how the speaker of Text 1 and the speaker of Text 2 portray the moon?", "choices": {"A": "While both speakers characterize the moon as an entrapped figure, only the speaker of Text 1 describes the moon as being content with this fate.", "B": "While both speakers present the moon as a tangible object, only the speaker of Text 1 addresses the moon's beauty.", "C": "While the speaker of Text 1 presents the moon as an object of play, the speaker of Text 2 presents the moon as an object of serious study.", "D": "While the speaker of Text 1 presents the moon as seeming to be very close, the speaker of Text 2 emphasizes the moon's distance from the speaker."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "Text 1 says what seemed far away is 'but a child's balloon' tangled in a mast (close), while Text 2's speaker asks if the moon can hear 'up so high' and whether it will come down, stressing distance.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "Text 1 says the moon seems far but is close like a balloon; Text 2 asks the distant moon to come down.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "In Text 1 the moon hangs above the dock, tangled in the mast and compared to a child's balloon, so it seems close.\n\nIn Text 2 the speaker asks if the moon can hear \"up so high\" and asks it to \"come down soon,\" so the moon seems far away.\n\nSo Text 1 presents the moon as close and Text 2 emphasizes its distance.\n\n- A: Text 2 doesn't portray the moon as entrapped.\n- B: Text 2 doesn't present the moon as tangible, and Text 1 doesn't address its beauty.\n- C: Text 2 doesn't present the moon as an object of serious study.\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "missing", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Cross-Text Connections", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #7 (csv 3567)", "subject": "english", "originals": {}, "csv": {"passage": "Text 1 is T. E. Hulme's 1912 poem \"Above the Dock.\" Text 2 is from Amy Lowell's 1912 poem \"The Crescent Moon.\"\n\nText 1\nAbove the quiet dock in mid night,\nTangled in the tall mast's corded height,\nHangs the moon. What seemed so far away\nIs but a child's balloon, forgotten after play.\n\nText 2\nSlipping softly through the sky\nLittle horned, happy moon,\nCan you hear me up so high?\nWill you come down soon?", "question": "Which choice best describes a notable difference in how the speaker of Text 1 and the speaker of Text 2 portray the moon?", "choices": {"A": "While both speakers characterize the moon as an entrapped figure, only the speaker of Text 1 describe <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';
  return String(s).split(/\n\s*\n/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}

  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
