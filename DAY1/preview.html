_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "45", "confidence": "high", "reasoning": "Multiplying by x gives (x+1)/(5x) = k, so x = 1/(5k - 1). Setting 5k - 1 = 224 gives k = 45.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "45", "confidence": "high", "reasoning": "Multiply by 5x^2 to get x + 1 = 5kx. At x = 1/224, 225/224 = 5k/224, so k = 45.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Multiply both sides by \\(5x^2\\): \\(x + 1 = 5kx\\).\n\nSolve for \\(k\\): \\(k = \\frac{x+1}{5x}\\).\n\nSubstitute \\(x = \\frac{1}{224}\\): the numerator is \\(\\frac{1}{224} + 1 = \\frac{225}{224}\\) and the denominator is \\(\\frac{5}{224}\\).\n\nSo \\(k = \\frac{225}{224} \\div \\frac{5}{224} = \\frac{225}{5} = 45\\).\n\n**Answer:** 45", "source": "drafted", "answer_stated": "45", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Advanced Math", "skill": "Nonlinear equations in one variable and systems of equations in two variables", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #13 (csv 36)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-18_at_12.55.26_og3A4aV.png"}, "csv": {"passage": null, "question": "In the given equation, k is a constant. The solution to the given equation is 1/224. What is the\nvalue of k?", "choices": null}}, {"qid": "math-m2-14", "type": "mcq", "passage": null, "stem": "The function \\(f\\) is defined by \\(f(x) = -39^{x}\\). The function \\(g\\) is a decreasing linear function. In the \\(xy\\)-plane, the graphs of \\(y = f(x)\\) and \\(y = g(x)\\) intersect at two points, \\((h, j)\\) and \\((k, m)\\), where \\(j > m\\). When \\(g(x) < f(x)\\), which of the following must also be true?", "choices": {"A": "\\(x > k\\)", "B": "\\(x < h\\)", "C": "\\(x > k\\) or \\(x < h\  on these stories' means the literature is derived from the traditional stories.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Correct Answer: D. derived from\n\nExplanation:\nA. brooded on: This is incorrect because \"brooded on\" implies a sense of worry or contemplation, which doesn’t fit the context of literary derivation.\nB. supplanted: This is incorrect because \"supplanted\" means replaced, which contradicts the idea of drawing on traditional stories.\nC. anticipated: This is incorrect because \"anticipated\" suggests something expected or predicted, which doesn’t align with the context.\nD. derived from: This is the correct answer because it indicates that modern Hawaiian literature has roots in or is based on traditional stories.\n\n**Answer:** D", "source": "bank", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Words in Context", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #2 (csv 2)", "subject": "english", "originals": {}, "csv": {"passage": "It is hardly an exaggeration to characterize modern Hawaiian literature as having ____ the traditional stories of the Kānaka Maoli, the Native Hawaiian people. In a variety of ways, Samuel Kamakau, Kristiana Kahakauwila, and other acclaimed writers have drawn on these stories to craft a rich portrait of the Hawaiian Islands and their people.", "question": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "brooded on", "B": "supplanted", "C": "anticipated", "D": "derived from"}}}, {"qid": "english-m1-03", "type": "mcq", "passage": "The following text is from Charles Chesnutt's 1905 novel *The Colonel's Dream*. Mr. French and Mr. Kirby work together.\n\nMr. French, the senior partner, who sat opposite Kirby, was an older man—a safe guess would have <u>placed<\/u> him somew sumption and then shows how recent research has overturned that assumption.", "B": "It describes a scientific mystery and then discusses a research team's attempt to solve that mystery.", "C": "It compares fossils found in Montana and England and then points out which of those fossils provides more information.", "D": "It notes the discovery of a new ammonite species and then remarks on the importance of that discovery."}}}, {"qid": "english-m2-05", "type": "mcq", "passage": "In Egypt, use of solid fuel (e.g., coal, wood) as a share of total household fuel use fell by more than 90 percent between 2000 and 2015; such shifts are typically explained by appeal to the energy ladder, a model holding that fuel choice is mediated mainly by household income (specifically, high-technology fuels displace solid fuels as incomes rise). Alemu Mekonnen and Gunnar Köhlin’s study of fuel use in Ethiopia shows how reductive this model is, however: <u>although income of course constrained fuel choice<\/u>, several circumstances, including the local availability of different fuel sources, influenced decisions.", "stem": "Which choice best describes the function of the underlined(capitalized) portion in the text as a whole?", "choices": {"A": "It anticipates a potential objection to the description of a model that the text provides.", "B": "It admits the superficial plausibility of an assumption that the text presents as lacking any empirical support.", "C": "It acknowledges the role played by a factor whose importance the text suggests has been overstated.", "D": "It concedes that a finding may not appear to support the main view that the text advances."}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "typo", "severity": "cosmetic", "source": "question", "detail": "The question says \"underlined(capitalized) portion\", with a stray \"(capitalized)\".", "by": "sonnet"}, {"kind": "off_format", "severity": "cosmetic", "source": "question" lly explained by appeal to the energy ladder, a model holding that fuel choice is mediated mainly by household income (specifically, high-technology fuels displace solid fuels as incomes rise). Alemu Mekonnen and Gunnar Köhlin’s study of fuel use in Ethiopia shows how reductive this model is, however: \\(\\underline{although\\ income\\ of\\ course\\ constrained\\ fuel\\ choice}\\), several circumstances, including the local availability of different fuel sources, influenced decisions.", "question": "Which choice best describes the function of the underlined(capitalized) portion in the text as a whole?", "choices": {"A": "It anticipates a potential objection to the description of a model that the text provides.", "B": "It admits the superficial plausibility of an assumption that the text presents as lacking any empirical support.", "C": "It acknowledges the role played by a factor whose importance the text suggests has been overstated.", "D": "It concedes that a finding may not appear to support the main view that the text advances."}}}, {"qid": "english-m2-06", "type": "mcq", "passage": "**Text 1**\n\nIsaac Asimov, author of *Robots and Empire* and *I, Robot*, is highly regarded despite his mediocre writing style. His prose is workmanlike; his <u>characters are flat<\/u> and discuss ideas rather than emotions. That his work is enjoyable despite this is a testament to his prodigious imagination—even if people read his books only for the ideas, they will have plenty to consider.\n\n**Text 2**\n\nAsimov is critiqued for his style, but it is wrong to fault a writer for failing to do what he never intended to do. For example, although most of his novel *Foundation* consists of people discussing science and politics and we find out little about his characters’ lives, Asimov wanted to convey the vast sweep of human history over centuries, and one of his points is that at such a timescale, individuals don’t matter. Thus his lack of characterization is central to his thematic aims.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the description of Asimov's characters in the underlined portion of Text 1?", "choices": {"A": "The flatness of Asimov's characters is a feature of Robots and Empire and I, Robot but not of Foundation.", "B": "Asimov's characterizations would have been more believable if his writing had discussed fewer ideas.", "C": "Asimov's characterizations would have been richer if he had possessed a deeper understanding of history.", "D": "The flatness of Asimov's characters should not necessarily be considered a flaw in his writing."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "Text 2 says the lack of characterization is deliberate and central to Asimov's thematic aims, so the flat characters are not necessarily a flaw.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "Text 2 argues lack of characterization serves Asimov's themes, so not a flaw.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice D is the best answer because the author of Text 2 argues that Asimov’s lack of detailed characterization is intentional and central to his thematic aims. Text 2 explains that Asimov’s focus on ideas and the vast sweep of human history means that individual character details are less important. Therefore, the flatness of Asimov’s characters is not a flaw but a deliberate choice that serves his larger narrative goals.\n\nChoice A is incorrect because Text 2 does not distinguish between the flatness of characters in different works by Asimov.\nChoice B is incorrect because Text 2 does not suggest that fewer ideas would make Asimov’s characters more believable.\nChoice C is incorrect because Text 2 does not critique Asimov’s understanding of history but rather supports his thematic focus on broader historical narratives over individual character details.\n\n**Answer:** D", "source": "bank", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Cross-Text Connections", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #6 (csv 32)", "subject": "english", "originals": {}, "csv": {"passage": "Text 1\nIsaac Asimov, author of \\(\\textit{Robots and Empire}\\) and \\(\\textit{I, Robot}\\), is highly regarded despite his mediocre writing style. His prose is workmanlike; his \\(\\underline{characters\\ are\\ flat}\\) and discuss ideas rather than emotions. That his work is enjoyable despite this is a testament to his prodigious imagination—even if people read his books only for the ideas, they will have plenty to consider.\n\nText 2\nAsimov is critiqued for his style, but it is wrong to fault a writer for failing to do what he never intended to do. For example, although most of his novel \\(\\textit{Foundation}\\) consists of people discussing science and politics and we find out little about his characters’ lives, Asimov wanted to convey the vast sweep of human history over centuries, and one of his points is that at such a timescale, individuals don’t matter. Thus his lack of characterization is central to his thematic aims.", "question": "Based on the texts, how would the author of Text 2 most likely respond to the description of Asimov's characters in the underlined portion of Text 1?", "choices": {"A": "The flatness of Asimov's characters is a feature of Robots and Empire and I, Robot but not of Foundation.", "B": "Asimov's characterizations would have been more believable if his writing had discussed fewer ideas.", "C": "Asimov's characterizations would have been richer if he had possessed a deeper understanding of history.", "D": "The flatness of Asimov's characters should not necessarily be considered a flaw in his writing."}}}, {"qid": "english-m2-07", "type": "mcq", "passage": "Joel Brown and colleagues showed that high moonlight intensity inhibits the activity of the Arizona pocket mouse (Perognathus amplus), a finding explicable in terms of benefits and costs: greater lunar intensity may not enable the mice to increase foraging success enough to offset the higher chance of detection by predatory owls or hawks. Though many other nocturnal mammals respond to lunar intensity variations similarly to Arizona pocket mice, Azara's night monkeys (Aotus azarae) display the opposite pattern, as their heavy reliance on visual foraging results in a different balance of reward and risk.", "stem": "Based on the text, why do Azara's night monkeys respond to high lunar intensity differently than Arizona pocket mice do?", "choices": {"A": "In such conditions, the chance of detection by predators declines for Azara's night monkeys but rises for Arizona pocket mice.", "B": "Although the risks of activity in such conditions are greater for Azara's night monkeys than they are for Arizona pocket mice, the rewards are also greater for Azara's night monkeys.", "C": "In such conditions, the costs of activity are lower relative to the benefits of activity for Azara's night monkeys than they are for Arizona pocket mice.", "D": "Due to their heavy reliance on visual foraging, Azara's night monkeys experience a reduction in their foraging success in such conditions, whereas Arizona pocket mice experience no change in their foraging success."}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "yellow", "risk_reasons": ["sonnet medium"], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "The text puts the difference down to 'a different balance of reward and risk': the monkeys rely on vision, so moonlight makes activity pay off more relative to its cost than it does for the mice.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "medium", "reasoning": "Their visual foraging shifts the balance so costs are lower relative to benefits.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice C is the best answer because it accurately explains the difference in responses based on the balance of costs and benefits. The text indicates that for Arizona pocket mice, high lunar intensity increases the risk of predation without providing enough benefit in foraging success. In contrast, Azara’s night monkeys rely heavily on visual foraging, which benefits more from increased moonlight, resulting in a different balance of reward and risk.\n\nChoice A is incorrect because the text does not state that the chance of detection by predators declines for Azara’s night monkeys.\nChoice B is incorrect because the text suggests that the rewards are greater for Azara’s night monkeys due to their reliance on visual foraging, not because the risks are greater.\nChoice D is incorrect because the text indicates that high lunar intensity benefits Azara’s night monkeys’ foraging success, not reduces it.\n\n**Answer:** C", "source": "bank", "answer_stated": "C", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Central Ideas and Details", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver not sure: solver 2 medium"], "reason": "Key C stands: the text attributes the opposite pattern to 'a different balance of reward and risk', i.e. costs relative to benefits are lower for the monkeys; A, B and D claim specifics the text does not support.", "proof": null}, "proposed_fix": null, "label": "R&W M2 #7 (csv 33)", "subject": "english", "originals": {}, "csv": {"passage": "Joel Brown and colleagues showed that high moonlight intensity inhibits the activity of the Arizona pocket mouse (Perognathus amplus), a finding explicable in terms of benefits and costs: greater lunar intensity may not enable the mice to increase foraging success enough to offset the higher chance of detection by predatory owls or hawks. Though many other nocturnal mammals respond to lunar intensity variations similarly to Arizona pocket mice, Azara's night monkeys (Aotus azarae) display the opposite pattern, as their heavy reliance on visual foraging results in a different balance of reward and risk.", "question": "Based on the text, why do Azara's night monkeys respond to high lunar intensity differently than Arizona pocket mice do?", "choices": {"A": "In such conditions, the chance of detection by predators declines for Azara's night monkeys but rises for Arizona pocket mice.", "B": "Although the risks of activity in such conditions are greater for Azara's night monkeys than they are for Arizona pocket mice, the rewards are also greater for Azara's night monkeys.", "C": "In such conditions, the costs of activity are lower relative to the benefits of activity for Azara's night monkeys than they are for Arizona pocket mice.", "D": "Due to their heavy reliance on visual foraging, Azara's night monkeys experience a reduction in their foraging success in such conditions, whereas Arizona pocket mice experience no change in their foraging success."}}}, {"qid": "english-m2-08", "type": "mcq", "passage": "In Caddo, a language from what is now the US Southeast, vocabulary pertaining to corn cultivation resembles equivalent vocabulary in the Totozoquean language family in Mexico. This resemblance is perhaps attributable to cultural contact: such words could have entered Caddo through the intermediary of the neighboring but unrelated Chitimacha language, concurrent with the dissemination of corn itself from Mexico into the Southeast after 700 CE. That the vocabulary pertaining to domestic crops accompanies them as they diffuse into new regions is an established phenomenon globally. Crops may also be decoupled from vocabulary altogether: corn cultivation became ubiquitous among the Southeastern tribes, yet ______.\n\n**Corn-Related Vocabulary in Various Southeastern Languages**\n\n| Language family | Word (language) | English translation | Proposed origin in vocabulary of the Totozoquean language family |\n|---|---|---|---|\n| Muskogean | tanchi’ (Chickasaw); tanchi (Choctaw); vce (Muscogee, pronounced “uh-chi”) | corn | no |\n| Iroquoian | se-lu (Cherokee) | corn | no |\n| Caddoan | -k’as- (Caddo) | dried corn | yes |\n| Chitimacha | k’asma (Chitimacha) | corn | yes |", "stem": "Which choice best describes data from the table that support the underlined claim?", "choices": {"A": "the origins of vocabulary pertaining to the crop vary across languages in the region, with the words for corn in Cherokee and the Muskogean languages showing no demonstrable relationship to Totozoquean vocabulary.", "B": "words for corn in the languages of the Muskogean family evolved from a common root, with the Muscogee word having lost certain consonant sounds still present in the Chickasaw and Choctaw words.", "C": "corn-related vocabulary underwent changes when entering other, unrelated languages, as can be seen by the divergence of the Caddo word from the Chitimacha word it originated in.", "D": "the region is linguistically diverse, being home not only to Chitimacha and Caddo, but also to the Muskogean language family (including Chickasaw, Choctaw, and Muscogee) and to one Iroquoian language (Cherokee)."}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "other", "severity": "content", "source": "question", "detail": "The stem asks about \"the underlined claim\" but nothing in the passage is underlined; the passage ends in a blank (\"yet ______\") to be completed.", "by": "opus"}, {"kind": "ambiguous", "severity": "content", "source": "question", "detail": "The stem \"Which choice best describes data from the table that support the underlined claim?\" does not match the choices, which are completions of the blank.", "by": "opus"}], "risk": "yellow", "risk_reasons": ["content: other", "content: ambiguous"], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "The claim is that crops can spread without their vocabulary, and the table shows the Muskogean and Cherokee words for corn have no proposed Totozoquean origin.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "Table shows Cherokee and Muskogean corn words lack Totozoquean origin, so vocabulary did not travel with the crop.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. The blank says that corn cultivation became ubiquitous in the Southeast, \"yet\" the crop and its vocabulary were decoupled. So we need data showing that corn spread without Totozoquean-origin words coming along.\n\n2. In the table, the Muskogean words (Chickasaw, Choctaw, Muscogee) and the Cherokee word all have \"no\" in the last column. These tribes grew corn, but their words for it did not come from Totozoquean vocabulary.\n\n3. Only the Caddo and Chitimacha words are marked \"yes,\" so the origins of corn vocabulary differ across the region. Choice A states exactly this.\n\nChoice B is wrong because a shared root within Muskogean does not show that corn spread without its vocabulary.\nChoice C is wrong because the table does not show the Caddo word diverging from the Chitimacha word, and it does not address the claim.\nChoice D is wrong because the region's linguistic diversity says nothing about corn vocabulary.\n\n**Answer:** A", "source": "drafted", "answer_stated": "A", "bank_status": "wrong", "disputed_quote": "the Caddo language, which is described as closely related to the Totozoquean language family", "by": "opus"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["content issue: other", "content issue: ambiguous", "bank explanation wrong"], "reason": "Key A is correct per the table (Muskogean and Cherokee corn words marked 'no'); kept the stem-mismatch issues, dropped the cosmetic 'underlined claim' issue as a duplicate, proposed the standard stem, and replaced the bank explanation, which wrongly calls Caddo closely related to Totozoquean.", "proof": null}, "proposed_fix": {"stem": "Which choice most effectively uses data from the table to complete the text?"}, "label": "R&W M2 #8 (csv 34)", "subject": "english", "originals": {"question": "sat/question_images/34.PNG"}, "csv": {"passage": "In Caddo, a language from what is now the US Southeast, vocabulary pertaining to corn cultivation resembles equivalent vocabulary in the Totozoquean language family in Mexico. This resemblance is perhaps attributable to cultural contact: such words could have entered Caddo through the intermediary of the neighboring but unrelated Chitimacha language, concurrent with the dissemination of corn itself from Mexico into the Southeast after 700 CE. That the vocabulary pertaining to domestic crops accompanies them as they diffuse into new regions is an established phenomenon globally. Crops may also be decoupled from vocabulary altogether: corn cultivation became ubiquitous among the Southeastern tribes, yet _____.", "question": "Which choice best describes data from the table that support the underlined claim?", "choices": {"A": "the origins of vocabulary pertaining to the crop vary across languages in the region, with the words for corn in Cherokee and the Muskogean languages showing no demonstrable relationship to Totozoquean vocabulary.", "B": "words for corn in the languages of the Muskogean family evolved from a common root, with the Muscogee word having lost certain consonant sounds still present in the Chickasaw and Choctaw words.", "C": "corn-related vocabulary underwent changes when entering other, unrelated languages, as can be seen by the divergence of the Caddo word from the Chitimacha word it originated in.", "D": "the region is linguistically diverse, being home not only to Chitimacha and Caddo, but also to the Muskogean language family (including Chickasaw, Choctaw, and Muscogee) and to one Iroquoian language (Cherokee)."}}}, {"qid": "english-m2-09", "type": "mcq", "passage": "Neurobiologists Laura Cuaya, Raúl Hernández-Pérez, and colleagues investigated the language detection abilities of eighteen dogs. The researchers monitored the brain activity of Grog (a border collie), Alma (a mixed breed), and other dogs while the animals listened to three recordings: one of The Little Prince being read in Spanish, the second in Hungarian, and a third made up of short, randomly selected fragments of the first two, scrambled so that they didn't resemble human speech. Each dog was familiar with either Spanish or Hungarian, but not both. The team concluded that differences in dogs' anatomical features may affect their ability to distinguish speech from nonspeech.", "stem": "Which finding from the study, if true, would most directly support the team's conclusion?", "choices": {"A": "The pattern of brain activity that long-headed dogs showed when hearing the scrambled recording was different from the pattern of brain activity that short-headed dogs showed when hearing the language they were accustomed to.", "B": "Compared with shorter-headed dogs, longer-headed dogs showed a greater difference in brain activity when hearing either Spanish or Hungarian than when hearing the scrambled recording.", "C": "Compared with shorter-headed dogs, longer-headed dogs showed a greater difference in brain activity when hearing the language they were accustomed to than when hearing the other language.", "D": "Long-headed dogs accustomed to hearing Spanish tended to show more brain activity when hearing Spanish than long-headed dogs accustomed to hearing Hungarian showed when hearing Hungarian."}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "yellow", "risk_reasons": ["sonnet medium"], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "The conclusion is about anatomy and telling speech from nonspeech, so the support needed is that head shape changes the brain-activity difference between speech (either language) and the scrambled recording.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "medium", "reasoning": "Longer-headed dogs showing bigger speech vs scrambled difference in either language supports the anatomy claim.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice B is the best answer because it directly supports the conclusion that anatomical differences in dogs affect their ability to distinguish speech from nonspeech. If longer-headed dogs showed a greater difference in brain activity when hearing actual languages (Spanish or Hungarian) compared to scrambled recordings, it would indicate that their brain activity patterns are influenced by the structure of speech. This aligns with the team's conclusion about anatomical features playing a role in speech detection.\n\nChoice A is incorrect because it compares scrambled recordings with accustomed language but does not provide a direct comparison between longer-headed and shorter-headed dogs in the context of language detection.\nChoice C is incorrect because it compares the brain activity of dogs hearing their accustomed language to another language but does not address the scrambled recording.\nChoice D is incorrect because it focuses on long-headed dogs' response to specific languages rather than the comparison between speech and nonspeech recordings.\n\n**Answer:** B", "source": "bank", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver not sure: solver 2 medium"], "reason": "Key B stands: only B ties head shape (anatomy) to a difference between speech (either language) and nonspeech (scrambled), which is exactly the team's conclusion; A compares mismatched conditions, and C and D compare languages, not speech versus nonspeech.", "proof": null}, "proposed_fix": null, "label": "R&W M2 #9 (csv 35)", "subject": "english", "originals": {}, "csv": {"passage": "Neurobiologists Laura Cuaya, Raúl Hernández-Pérez, and colleagues investigated the language detection abilities of eighteen dogs. The researchers monitored the brain activity of Grog (a border collie), Alma (a mixed breed), and other dogs while the animals listened to three recordings: one of The Little Prince being read in Spanish, the second in Hungarian, and a third made up of short, randomly selected fragments of the first two, scrambled so that they didn't resemble human speech. Each dog was familiar with either Spanish or Hungarian, but not both. The team concluded that differences in dogs' anatomical features may affect their ability to distinguish speech from nonspeech.", "question": "Which finding from the study, if true, would most directly support the team's conclusion?", "choices": {"A": "The pattern of brain activity that long-headed dogs showed when hearing the scrambled recording was different from the pattern of brain activity that short-headed dogs showed when hearing the language they were accustomed to.", "B": "Compared with shorter-headed dogs, longer-headed dogs showed a greater difference in brain activity when hearing either Spanish or Hungarian than when hearing the scrambled recording.", "C": "Compared with shorter-headed dogs, longer-headed dogs showed a greater difference in brain activity when hearing the language they were accustomed to than when hearing the other language.", "D": "Long-headed dogs accustomed to hearing Spanish tended to show more brain activity when hearing Spanish than long-headed dogs accustomed to hearing Hungarian showed when hearing Hungarian."}}}, {"qid": "english-m2-10", "type": "mcq", "passage": "Private foundations in the United States are required to file Form 4720 if they engage in certain prohibited activities or fail to meet specific regulatory requirements. The graph illustrates the distribution of forms filed and the associated penalties for different types of taxable activities reported by private foundations in 2005. Self-dealing activities, although constituting a smaller percentage of the total forms filed, resulted in a disproportionately higher percentage of total penalties. In contrast, activities related to undistributed income, which make up a majority of the forms filed, incurred a lower percentage of the total penalties. This data suggests that foundations involved in self-dealing faced more severe financial consequences compared to those failing to meet the minimum charitable distribution requirements.\n\n![Bar chart of percentage of forms and percentage of penalties by taxable activity](r2:sat/question_images/Screenshot_2024-07-01_at_01.10.20.png)", "stem": "The data in the graph best support which conclusion about organizations that filed Form 4720 in 2005?", "choices": {"A": "Those that failed to meet the minimum charitable distribution requirement must have paid higher penalties, on average, than those organizations that filed Form 990 but also filed Form 4720 for the same reason did.", "B": "Those that engaged in self-dealing must have paid higher penalties, on average, than those that failed to meet the minimum charitable distribution requirement did.", "C": "Those that engaged in self-dealing and those that had taxable expenditures collectively paid a greater portion of the total penalty than those that failed to meet the minimum charitable distribution requirement did.", "D": "Those that failed to meet the minimum charitable distribution requirement filed a majority of the forms but did not pay a majority of the penalties."}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "unreadable_image", "severity": "cosmetic", "source": "figure", "detail": "The chart title is cropped at the top (only \"...Foundations, by Taxable Activity, 2005\" is partly visible) and a scrollbar and expand icon appear in the screenshot, but all bars, axis values and the legend are readable.", "by": "opus"}], "risk": "yellow", "risk_reasons": ["transcription medium"], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "Self-dealing accounts for about 9% of forms but about 40% of penalties, while undistributed income accounts for about 88% of forms but only about 55% of penalties, so self-dealers paid more per filer on average. D fails because 55% is a majority of penalties; C fails because 40% + 4% < 55%.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "Self-dealing is about 9% of forms but 40% of penalties, while undistributed income is 88% of forms and 55% of penalties, so average penalty per form is higher for self-dealing. D fails because 55% is a majority of penalties.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. Read the bars. Self-dealing is about 9% of forms but about 40% of penalties. Undistributed income (failing the minimum charitable distribution requirement) is about 88% of forms but about 55% of penalties.\n\n2. Compare average penalties. Self-dealing carries about 40% of the penalties across only about 9% of the forms, so each form averages a large penalty. Undistributed income carries about 55% of the penalties spread across about 88% of the forms, so each form averages a small penalty. Self-dealing therefore had the higher average penalty.\n\n3. Choice A is wrong because the graph says nothing about Form 990 filers.\n\n4. Choice C is wrong because self-dealing and taxable expenditures together paid about 44% of the penalties (about 40% + 4%), which is less than the roughly 55% paid by undistributed income.\n\n5. Choice D is wrong because the undistributed income group did pay a majority of the penalties (about 55%).\n\n**Answer:** B", "source": "drafted", "answer_stated": "B", "bank_status": "wrong", "disputed_quote": "This suggests that, on average, organizations that failed to meet the minimum charitable distribution requirement paid lower penalties compared to those that also filed Form 4720 for the same reason.", "by": "opus"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["transcription medium", "content issue: unreadable_image", "bank explanation wrong"], "reason": "Key B is correct (about 9% of forms carry about 40% of penalties for self-dealing versus 88% of forms and 55% of penalties for undistributed income); the cropped title does not hide any data, so the image issue is downgraded to cosmetic and the duplicate dropped, and the bank explanation's comparison sentence is wrong so it is replaced.", "proof": null}, "proposed_fix": null, "label": "R&W M2 #10 (csv 36)", "subject": "english", "originals": {"question": "sat/question_images/Screenshot_2024-07-01_at_01.10.20.png"}, "csv": {"passage": "Private foundations in the United States are required to file Form 4720 if they engage in certain prohibited activities or fail to meet specific regulatory requirements. The graph illustrates the distribution of forms filed and the associated penalties for different types of taxable activities reported by private foundations in 2005. Self-dealing activities, although constituting a smaller percentage of the total forms filed, resulted in a disproportionately higher percentage of total penalties. In contrast, activities related to undistributed income, which make up a majority of the forms filed, incurred a lower percentage of the total penalties. This data suggests that foundations involved in self-dealing faced more severe financial consequences compared to those failing to meet the minimum charitable distribution requirements.", "question": "The data in the graph best support which conclusion about organizations that filed Form 4720 in 2005?", "choices": {"A": "Those that failed to meet the minimum charitable distribution requirement must have paid higher penalties, on average, than those organizations that filed Form 990 but also filed Form 4720 for the same reason did.", "B": "Those that engaged in self-dealing must have paid higher penalties, on average, than those that failed to meet the minimum charitable distribution requirement did.", "C": "Those that engaged in self-dealing and those that had taxable expenditures collectively paid a greater portion of the total penalty than those that failed to meet the minimum charitable distribution requirement did.", "D": "Those that failed to meet the minimum charitable distribution requirement filed a majority of the forms but did not pay a majority of the penalties."}}}, {"qid": "english-m2-11", "type": "mcq", "passage": "Scholars cite *Mr. President*, the 1946 novel by Guatemalan author Miguel Ángel Asturias, as a foundational text of magical realism, the Latin American style of fiction in which antirealistic plot devices—often borrowed from the folkloric traditions of Indigenous and colonial societies in the Americas—are deployed in an otherwise realistic mode of representation typical of the modern novel. This style has exerted a decisive influence on authors around the world, including Olga Tokarczuk, <u>whose 1996 novel *Primeval and Other Times* resembles classic magical realist novels in its juxtaposition of literary realism with folklore—namely, that of Poland.<\/u>", "stem": "Which quotation from a literary scholar would most directly support the claim in the underlined portion of the text?", "choices": {"A": "\"The logic of the realistic plot of Primeval and Other Times is repeatedly and productively disrupted by the presence of imagery and situations drawn from Polish folklore.\"", "B": "\"Although Polish folklore clearly informs the style and occasionally antirealistic plot of Primeval and Other Times, the novel also shows the inarguable influence of the magical realist tradition of Latin America.\"", "C": "\"Like many works in the Latin American magical realist tradition, Primeval and Other Times is indebted to antirealistic elements in the folkloric tradition of Poland.\"", "D": "\"While Primeval and Other Times alternates between realistic and antirealistic modes of representation, details suggesting the influence of Polish folklore nevertheless occur throughout the novel.\""}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "The claim is that the novel juxtaposes literary realism with Polish folklore; A describes a realistic plot repeatedly disrupted by Polish folkloric imagery, directly showing that juxtaposition. C wrongly attributes Polish folklore to Latin American works, and B/D do not describe the realism-folklore juxtaposition as directly.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "A directly states the juxtaposition of a realistic plot with Polish folklore imagery, matching the claim; the others add Latin American influence or lack the juxtaposition.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice A is the best answer because it directly supports the claim that Primeval a cal realist novels in its juxtaposition of literary realism with folklore—namely, that of Poland.}}\\)", "question": "Which quotation from a literary scholar would most directly support the claim in the underlined portion of the text?", "choices": {"A": "\"The logic of the realistic plot of Primeval and Other Times is repeatedly and productively disrupted by the presence of imagery and situations drawn from Polish folklore.\"", "B": "\"Although Polish folklore clearly informs the style and occasionally antirealistic plot of Primeval and Other Times, the novel also shows the inarguable influence of the magical realist tradition of Latin America.\"", "C": "\"Like many works in the Latin American magical realist tradition, Primeval and Other Times is indebted to antirealistic elements in the folkloric tradition of Poland.\"", "D": "\"While Primeval and Other Times alternates between realistic and antirealistic modes of representation, details suggesting the influence of Polish folklore nevertheless occur throughout the novel.\""}}}, {"qid": "english-m2-12", "type": "mcq", "passage": "All stainless steel contains varying amounts of iron, carbon, and corrosion- inhibiting chromium. However, ferritic stainless steel, often used for induction cookers, contains a higher percentage of chromium (at least 10.5%) than does austenitic stainless steel and a higher concentration of iron, which is responsible for its magnetic properties. Unlike ferritic stainless steel, austenitic stainless steel has a face-centered cubic crystalline structure resulting from the addition of nickel to the alloy. Austenitic stainless steel has two subtypes: the 300 series, often used for storage containers, and the 200 series, which has less nickel and more manganese than the 300 series and is used for indoor architecture. Thus, stainless steel used to manufacture storage containers will have ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "similar magnetic properties to stainless steel used to manufacture induction cookers.", "B": "concentration of manganese greater than 10.5%, while stainless steel used to manufacture indoor architecture will not.", "C": "face-centered cubic crystalline structure, while stainless steel used to manufacture induction cookers will not.", "D": "lower percentage of nickel in its composition than stainless steel used to manufacture induction cookers will."}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "typo", "severity": "cosmetic", "source": "question", "detail": "The passage has \"corrosion- inhibiting\" with a stray space after the hyphen.", "by": "sonnet"}, {"kind": "choice_formatting", "severity": "cosmetic", "source": "question", "detail": "Choices B, C and D lack a leading article (\"concentration of manganese...\", \"face-centered cubic crystalline structure...\", \"lower percentage...\") so they do not read grammatically after \"will have\".", "by": "sonnet"}, {"kind": "typo", "severity": "cosmetic", "source": "question", "detail": "The passage contains a stray space after a hyphen: \"corrosion- inhibiting\".", "by": "sonnet"}], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "Storage containers use 300-series austenitic steel, which has a face-centered cubic structure, unlike ferritic steel used for induction cookers.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "Storage containers use 300-series austenitic steel, which has a face-centered cubic structure from nickel, while ferritic steel for induction cookers lacks it.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice C is the best answer because it logically completes the text by contrasting the structural differences between austenitic stainless steel (used for storage containers) and ferritic stainless steel (used for induction cookers). The passage explains that austenitic stainless steel has a face-centered cubic crystalline structure due to the addition of nickel, while ferritic stainless steel, used for induction cookers, does not have this structure. This contrast highlights the different properties and uses of these types of stainless steel.\n\nChoice A is incorrect because it suggests similar magnetic properties, which is not logical given the distinct differences in composition and structure described in the text.\nChoice B is incorrect because the focus is on the crystalline structure and not on manganese concentration.\nChoice D is incorrect because it discusses nickel percentages without addressing the crystalline structure, which is the main point of comparison in the text.", "source": "bank", "answer_stated": "C", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Inferences", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #12 (csv 38)", "subject": "english", "originals": {}, "csv": {"passage": "All stainless steel contains varying amounts of iron, carbon, and corrosion- inhibiting chromium. However, ferritic stainless steel, often used for induction cookers, contains a higher percentage of chromium (at least 10.5%) than does austenitic stainless steel and a higher concentration of iron, which is responsible for its magnetic properties. Unlike ferritic stainless steel, austenitic stainless steel has a face-centered cubic crystalline structure resulting from the addition of nickel to the alloy. Austenitic stainless steel has two subtypes: the 300 series, often used for storage containers, and the 200 series, which has less nickel and more manganese than the 300 series and is used for indoor architecture. Thus, stainless steel used to manufacture storage containers will have _____", "question": "Which choice most logically completes the text?", "choices": {"A": "similar magnetic properties to stainless steel used to manufacture induction cookers.", "B": "concentration of manganese greater than 10.5%, while stainless steel used to manufacture indoor architecture will not.", "C": "face-centered cubic crystalline structure, while stainless steel used to manufacture induction cookers will not.", "D": "lower percentage of nickel in its composition than stainless steel used to manufacture induction cookers will."}}}, {"qid": "english-m2-13", "type": "mcq", "passage": "As complex life cycle parasites, Lecithaster sp. and Capillaria parophrysi require multiple host species throughout their development. Extrapolating from parasite counts on Pacific herring and seven other fish species collected from Puget Sound from 1880 to 2019, Chelsea Wood et al. found that the abundance of three-host parasites, such as Lecithaster sp., negatively correlated with rising average annual sea temperatures; the abundance of two-host parasites, such as C. parophrysi, was largely stable. Noting that fish and other marine vertebrates are especially vulnerable to climate change, Wood et al. observed that all three-host parasites in the study depend on at least two vertebrate species, while all two- host parasites depend on only one, suggesting that ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "although Lecithaster sp. and C. parophrysi both require Pacific herring as a host, C. parophrysi was more adversely affected by warming- driven changes in the Pacific herring population than Lecithaster sp. was.", "B": "population size and density of the eight fish species examined in the study were likely largely unaffected by rising sea temperatures.", "C": "warming-induced population changes among Puget Sound vertebrates may have suppressed some parasite populations, but there were no changes among the eight studied host species that affected two-host parasite abundance.", "D": "parasite's sensitivity to warming temperatures is negatively correlated with the number of unique vertebrate species it depends on throughout its life cycle."}, "bank_key": "D", "key": "D", "verdict": "ambiguous", "proposed_key": null, "issues": [{"kind": "ambiguous", "severity": "content", "source": "question", "detail": "Key D says sensitivity to warming \"is negatively correlated with the number of unique vertebrate species\", but the text shows the parasites with more vertebrate hosts (three-host) declined while those with one (two-host) were stable, a positive correlation, so D contradicts the text as printed and C (\"warming-induced population changes among Puget Sound vertebrates may have suppressed some parasite populations\") is the only remaining consistent choice.", "by": "opus"}, {"kind": "typo", "severity": "cosmetic", "source": "question", "detail": "Stray spaces after hyphens in \"two- host\" and \"warming- driven\", and choice D lacks an article (\"parasite's sensitivity\" instead of \"a parasite's sensitivity\").", "by": "opus"}], "risk": "red", "risk_reasons": ["verdict ambiguous"], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "medium", "reasoning": "Three-host parasites depend on more vulnerable vertebrate hosts and declined with warming, while two-host parasites stayed stable, suggesting warming-driven vertebrate changes suppressed some parasites but not two-host ones. D reverses the relationship (sensitivity rises with number of vertebrate hosts).", "matches_key": false, "matches_bank_key": false}, {"solver": "sonnet", "answer": "D", "confidence": "medium", "reasoning": "Three-host parasites, which depend on more vertebrate species, declined with warming and two-host parasites did not, suggesting sensitivity rises with the number of vertebrate hosts.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice D is the best answer because it logically completes the text by connecting the observation that three-host parasites were negatively correlated with rising sea temperatures, whereas two-host parasites were stable, with the conclusion that the sensitivity to warming temperatures is related to the complexity of the parasite's life cycle. Specifically, it suggests that parasites requiring multiple host species (three-host parasites) are more vulnerable to changes in sea temperature than those requiring fewer hosts (two-host parasites).\n\nChoice A is incorrect because it incorrectly attributes greater adverse effects to C. parophrysi rather than Lecithaster sp., which contradicts the data provided.\nChoice B is incorrect because it suggests that fish population size and density were unaffected, which is irrelevant to the conclusion about parasite abundance.\nChoice C is incorrect because it inaccurately claims no changes in host species that affected two-host parasite abundance, which does not directly support the conclusion about the correlation between parasite sensitivity and the number of host species.", "source": "bank", "answer_stated": "D", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Inferences", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver disagrees with key: solver 1 says C, key D", "solver not sure: solver 1 medium", "solver not sure: solver 2 medium", "solvers disagree", "content issue: ambiguous"], "reason": "Ambiguous: key D as printed states a negative correlation that reverses what the text implies (more vertebrate hosts, more sensitivity), likely a misprint of \"positively\", while C is consistent; the solvers split with medium confidence, so a teacher should decide between fixing D's wording or rekeying to C (duplicate typo issue merged, the \"corrosion- inhibiting\" example dropped as it is not in this question).", "proof": null}, "proposed_fix": null, "label": "R&W M2 #13 (csv 39)", "subject": "engl ish?", "choices": {"A": "Organization—", "B": "Organization,", "C": "Organization", "D": "Organization:"}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "The appositive is opened with an em dash after 'Interpol', so it must be closed with a matching em dash.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "The appositive 'the International Criminal Police Organization' began with a dash, so it must close with a dash.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice A is the best answer because the em dash (—) is used to set off additional information or an explanation that is closely related to the main clause but could be omitted without changing the main point of the sentence. In this context, the phrase \"the International Criminal Police\" provides a definition or explanation of \"Interpol,\" and the em dash appropriately sets off this explanatory information.\n\nChoice B is incorrect because a comma would not adequately separate the explanatory phrase from the rest of the sentence, leading to a less clear sentence structure.\nChoice C is incorrect because a period would incorrectly separate the explanatory phrase from the rest of the sentence, disrupting the flow and making the sentence incomplete.\nChoice D is incorrect because a colon is used to introduce a list or a further explanation, which is not needed in this context.", "source": "bank", "answer_stated": "A", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Standard English Conventions", "skill": "Boundaries", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #14 (csv 40)", "subject": "english", "originals": {}, "csv": {"passa <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';
  return String(s).split(/\n\s*\n/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}
function card(q){
  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
