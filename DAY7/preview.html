k_key": "10.6", "key": "10.6", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "53/5", "confidence": "high", "reasoning": "Solutions are -7/5 and ±sqrt(5k + 7), with product (7/5)(5k + 7) = 84, so 5k + 7 = 60 and k = 53/5.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "53/5", "confidence": "high", "reasoning": "Roots are -7/5, sqrt(5k+7), -sqrt(5k+7); their product is (7/5)(5k+7) = 84, so 5k+7 = 60 and k = 53/5.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "1. Set each factor to zero. The solutions are \\(x = -\\frac{7}{5}\\), \\(x = \\sqrt{5k + 7}\\) and \\(x = -\\sqrt{5k + 7}\\).\n\n2. Multiply them: \\(\\left(-\\frac{7}{5}\\right)\\left(\\sqrt{5k + 7}\\right)\\left(-\\sqrt{5k + 7}\\right) = \\frac{7}{5}(5k + 7)\\).\n\n3. Set this equal to 84: \\(\\frac{7}{5}(5k + 7) = 84\\), so \\(5k + 7 = 60\\).\n\n4. Then \\(5k = 53\\), so \\(k = \\frac{53}{5} = 10.6\\).\n\n**Answer:** 10.6", "source": "drafted", "answer_stated": "10.6", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Advanced Math", "skill": "Nonlinear equations in one variable and systems of equations in two variables", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #19 (csv 234)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-07_182607.png"}, "csv": {"passage": "In the given equation, k is a positive constant. The product of the solutions to the equation is 84. What is the value of k?", "question": "", "choices": null}}, {"qid": "math-m2-20", "type": "mcq", "passage": null, "stem": "Each of the following frequency tables represents a data set. Which of these frequency tables represents the data set with the smallest standard deviation?", "choices": {"A": "| Value | Frequency |\n|---|---|\n| 5 | 0 |\ ion Island being one of the most complex books but rather discusses the structure of the series in general.", "source": "bank", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Text Structure and Purpose", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #5 (csv 246)", "subject": "english", "originals": {}, "csv": {"passage": "\"Desolation Island, first published in 1978, is a novel in Patrick O'Brian's Aubrey/Maturin series, which includes twenty completed books. Some critics have found fault with the abrupt endings of Desolation Island and other books in the series, saying that they do not finish conclusively but arbitrarily stop. But other critics argue that the books should not be thought of as discrete texts with traditional beginnings and endings but as a single incredibly long work, similar to other multivolume stories, such as John Galsworthy's The Forsyte Saga.\"", "question": "Which choice best states the main purpose of the text?", "choices": {"A": "To explain why many critics find the Aubrey/Maturin novels to be remarkably entertaining despite flaws in the novels' structures", "B": "To describe a characteristic of the Aubrey/Maturin novels and offer two differing viewpoints on this characteristic", "C": "To argue that the Aubrey/Maturin series should have the literary renown of The Forsyte Saga", "D": "To present a reason the unusual structure that O'Brian uses for Desolation Island makes it one of his most complex books"}}}, {"qid": "english-m2-06", "type": "mcq", "passage": "**Text 1**\n\nIsaac Asimov, author of *Robots and Empire* and *I, Robot*, is highly regarded despite his <u>mediocre writing style<\/u>. His prose is workmanlike; his <u>characters are flat and discuss ideas rather than emotions<\/u>. That his work is enjoyable despite this is a testament to his prodigious imagination—even  conducted using data from the studies by Zhang and colleagues and Zwaan and colleagues.", "D": "Both the study by Zhang and colleagues and that by Green and Extavour compare convergence through shared genetic mechanisms to convergence through different genetic mechanisms."}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "off_format", "severity": "cosmetic", "source": "question", "detail": "The bank passage is wrapped in stray quotation marks: \"\\\"Wenheng Zhang and colleagues ... for their 2012 paper.\\\"\".", "by": "opus"}], "risk": "yellow", "risk_reasons": ["sonnet medium"], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "The earlier studies each looked at only one mechanism, while Green and Extavour studied both types of convergence together, so their study is more comprehensive.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "medium", "reasoning": "Prior studies each examined only one type of convergence, whereas Green and Extavour evaluated both in a single study. D is wrong because Zhang's work examined only shared mechanisms.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice A is the best answer because the text discusses how Green and Extavour's study evaluated both types of convergence (shared and different genetic mechanisms) in a single study, suggesting a more comprehensive approach.\n\nChoice B is incorrect because it incorrectly implies that convergent evolution was previously assumed to require shared genetic mechanisms.\nChoice C is incorrect because the text does not state that Green and Extavour used data from the other studies.\nChoice D is incorrect because it incorrectly equates the comprehensiveness of the studies.", "source": "bank", "answer_stated": "A", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Central Ideas and Details", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver not sure: solver 2 medium"], "reason": "Each earlier study examined only one convergence mechanism, while Green and Extavour evaluated both, so A is the main idea; D wrongly says Zhang compared both types.", "proof": null}, "proposed_fix": null, "label": "R&W M2 #8 (csv 249)", "subject": "english", "originals": {}, "csv": {"passage": "\"Wenheng Zhang and colleagues have explored how convergent evolution—a phenomenon that occurs when the same trait evolves independently in two reproductively separate lineages—can result from a genetic mechanism shared by both lineages. Meanwhile, Bas J. Zwaan and colleagues have investigated how convergence occurs through different genetic mechanisms, but the relative prevalence of convergence through shared and different genetic processes is still poorly understood. This motivated biologists Delbert A. Green II and Cassandra G. Extavour to evaluate both types of convergence in a single study for their 2012 paper.\"", "question": "Which choice best states the main idea of the text?", "choices": {"A": "Green and Extavour's study addresses convergent evolution more comprehensively than the studies by Zhang and colleagues and Zwaan and colleagues do.", "B": "Before Green and Extavour's study, convergent evolution was assumed to require a shared genetic mechanism between two lineages that share the trait.", "C": "Green and Extavour's study was conducted using data from the studies by Zhang and colleagues and Zwaan and colleagues.", "D": "Both the study by Zhang and colleagues and that by Green and Extavour compare convergence through shared genetic mechanisms to convergence through different genetic mechanisms."}}}, {"qid": "english-m2-09", "type": "mcq", "passage": "Over time, marine mollusks called nautilids continually add segments to their shells, and the chemical composition of each segment is influenced by the available materials in the surrounding water when the segment forms. Paleontologist Amane Tajika and colleagues analyzed the septa (the walls between shell chambers) of one male (samples labeled “M”) and one female (samples labeled “F”) nautilid, finding that sample F02 had the same concentration of oxygen-18 as did water approximately 140 meters deep and that the oxygen-18 concentration in sample M23 matched that of water at approximately 385 meters deep. Tajika et al. concluded that sample F02 formed at a higher point in the water column than did M23.", "stem": "Which finding, if true, would most directly support the researchers' conclusion?", "choices": {"A": "Regardless of sex, nautilids spend most of their lives at depths of 50 meters or greater, where oxygen-18 concentrations typically differ from those higher in the water column.", "B": "In nautilids, sex predicts septa growth rate more strongly than does oxygen-18 concentration in the surrounding water.", "C": "Among nautilids, there is no effect of sex on the uptake of oxygen-18 from water or its deposition in septa.", "D": "Male nautilids tend to show higher concentrations of oxygen-18 than do female nautilids inhabiting the same point in the water column."}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "The samples come from a male and a female. Reading oxygen-18 as depth across sexes is valid only if sex does not affect how oxygen-18 is taken up or deposited.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "If sex does not affect oxygen-18 uptake or deposition, the F versus M difference reflects water depth, which supports the conclusion.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice C is the best answer because it directly supports the conclusion that the differences in oxygen-18 concentrations are due to the depths at which the segments formed, rather than the sex of the nautilids.\n\nChoice A is incorrect because it does not address the specific depths at which the samples were found.\nChoice B is incorrect because it introduces an unrelated variable (septa growth rate) and does not address oxygen-18 concentration.\nChoice D is incorrect because it would suggest a sex-related difference in oxygen-18 concentration, which would not support the conclusion.", "source": "bank", "answer_stated": "C", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #9 (csv 250)", "subject": "english", "originals": {}, "csv": {"passage": "\"Over time, marine mollusks called nautilids continually add segments to their shells, and the chemical composition of each segment is influenced by the available materials in the surrounding water when the segment forms. Paleontologist Amane Tajika and colleagues analyzed the septa (the walls between shell chambers) of one male (samples labeled “M”) and one female (samples labeled “F”) nautilid, finding that sample F02 had the same concentration of oxygen-18 as did water approximately 140 meters deep and that the oxygen-18 concentration in sample M23 matched that of water at approximately 385 meters deep. Tajika et al. concluded that sample F02 formed at a higher point in the water column than did M23.\"", "question": "Which finding, if true, would most directly support the researchers' conclusion?", "choices": {"A": "Regardless of sex, nautilids spend most of their lives at depths of 50 meters or greater, where oxygen-18 concentrations typically differ from those higher in the water column.", "B": "In nautilids, sex predicts septa growth rate more strongly than does oxygen-18 concentration in the surrounding water.", "C": "Among nautilids, there is no effect of sex on the uptake of oxygen-18 from water or its deposition in septa.", "D": "Male nautilids tend to show higher concentrations of oxygen-18 than do female nautilids inhabiting the same point in the water column."}}}, {"qid": "english-m2-10", "type": "mcq", "passage": "Cane is a 1923 novel by Jean Toomer. In one portion of the novel, Toomer uses figurative language to connect the narrator’s urban environment of Washington, DC, and the rural South of the narrator’s past, writing, ______", "stem": "Which quotation from Cane most effectively illustrates the claim?", "choices": {"A": "“The Capitol dome looked like a gray ghost ship drifting in from sea.”", "B": "“The young trees had not outgrown their [planter] boxes then. V Street [in Washington, DC] was lined with them.”", "C": "“The [train] engines of this valley have a whistle, the echoes of which sound like iterated gasps and sobs. I always think of them as crude music.”", "D": "“And when the wind is from the South, soil of my homeland falls like a fertile shower upon the lean streets of [Washington, DC].”"}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "Only D uses figurative language (soil falling 'like a fertile shower') that links the narrator's Southern homeland to the streets of Washington, DC.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "Only D links the Southern homeland (soil from the South) with the urban setting of Washington, DC through a figurative image.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice D is the best answer because it uses figurative language to connect the narrator's rural past in th <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';
  return String(s).split(/\n\s*\n/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}
function card(q){
  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
