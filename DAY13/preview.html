"B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "4x-5y=8 gives y=(4/5)x-8/5, slope 0.8; parallel lines share slope.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "Slope of 4x-5y=8 is 4/5=0.8; parallel lines share slope.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Parallel lines have the same slope, so find the slope of line r.\n\nSolve \\(4x-5y=8\\) for \\(y\\): \\(-5y=-4x+8\\), so \\(y=\\frac{4}{5}x-\\frac{8}{5}\\).\n\nThe slope of line r is \\(\\frac{4}{5}=0.8\\), so line s also has slope 0.8.\n\n**Answer:** B", "source": "drafted", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Algebra", "skill": "Linear equations in two variables", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #12 (csv 430)", "subject": "math", "originals": {}, "csv": {"passage": "Line r is defined by the equation 4x-5y=8. Line s is parallel to line r in the xy-plane. What is the slope of line s?", "question": "", "choices": {"A": "1.25", "B": "0.8", "C": "-4", "D": "-5"}}}, {"qid": "math-m1-13", "type": "mcq", "passage": null, "stem": "The cost to rent a bus from Company X is $750 for the first 2 hours and an additional $50 per hour for each hour after the first 2 hours. If the total cost to rent the bus from Company X for \\(t\\) hours, where \\(t > 2\\), is $1,050, which equation represents this situation?", "choices": {"A": "\\(750(t - 2) + 50t = 1050\\)", "B": "\\(750(2t) + 50t = 1050\\)", "C": "\\(750 + 50(t - 2) = 1050\\)", "D": "\\(750 + 50(2t) = 1050\\)"}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "Flat $750 for the first 2 hours plus $50 for each of the t-2 additional hours: 750+50(t-2)=1050.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "Cost is 750 plus 50 per hour beyond 2 hours: 750+50(t-2)=1050.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The first 2 hours cost a flat $750.\n\nBecause \\(t>2\\), the number of hours after the first 2 is \\(t-2\\), and each costs $50. That part costs \\(50(t-2)\\).\n\nThe total is \\(750+50(t-2)\\), and it equals 1,050, so the equation is \\(750+50(t-2)=1050\\).\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Algebra", "skill": "Linear equations in one variable", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #13 (csv 431)", "subject": "math", "originals": {}, "csv": {"passage": "The cost to rent a bus from Company X is $750 for the first 2 hours and an additional $50 per hour for each hour after the first 2 hours. If the total cost to rent the bus from Company X for t hours, where t > 2 , is $1,050, which equation represents this situation?", "question": "", "choices": {"A": "750(t - 2) + 50t = 1050", "B": "750(2t) + 50t = 1050", "C": "750 + 50(t - 2) = 1050", "D": "750 + 50(2t) = 1050"}}}, {"qid": "math-m1-14", "type": "mcq", "passage": null, "stem": "The given equation models a company's active projects over 6 months, where \\(y\\) is the estimated number of active projects \\(x\\) months after the end of April 2012, where \\(0 < x < 6\\).\n\n\\[ y = -\\frac{1}{4}x^2 + x + 28 \\]\n\nWhich statement is the best interpretation of the y-intercept of the graph of this equation in the ay-plane?", "choices": {"A": "At the end of April 2012, the estimated number of active projects was 0.", "B": "At  x < 6 . Which statement is the best interpretation of the y-intercept of the graph of this equation in the ay-plane?", "question": "", "choices": {"A": "At the end of April 2012, the estimated number of active projects was 0.", "B": "At the end of April 2012, the estimated number of active projects was 28.", "C": "At the end of May 2012, the estimated number of active projects was 0.", "D": "At the end of May 2012, the estimated number of active projects was 28."}}}, {"qid": "math-m1-15", "type": "mcq", "passage": null, "stem": "In right triangle RST, the sum of the measures of angle R and angle S is 90 degrees. The value of \\(\\sin(R)\\) is \\(\\frac{4\\sqrt{2}}{9}\\). What is the value of \\(\\cos(S)\\)?", "choices": {"A": "\\(\\frac{4\\sqrt{2}}{9}\\)", "B": "\\(\\frac{4\\sqrt{2}}{7}\\)", "C": "\\(\\frac{7\\sqrt{2}}{8}\\)", "D": "\\(\\frac{9\\sqrt{2}}{8}\\)"}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "R and S are complementary, so cos(S)=sin(R)=4√2/9.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "R and S are complementary, so cos(S)=sin(R)=4√2/9.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Angles R and S add to 90 degrees, so they are the two acute angles of a right triangle and are complementary.\n\nFor complementary angles, the sine of one equals the cosine of the other: \\(\\cos(S)=\\sin(R)\\).\n\nTherefore \\(\\cos(S)=\\frac{4\\sqrt{2}}{9}\\).\n\n**Answer:** A", "source": "drafted", "answer_stated": "A", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Geometry and Trigonometry", "skill": "Right triangles and trigonometry", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #15 (c ": {"passage": "In triangle ABC, angle B is a right angle, and the length of BC is 248 millimeters. If cos(A)=3/5, what is the length, in millimeters, of AB?", "question": "", "choices": {"A": "62", "B": "186", "C": "248", "D": "310"}}}, {"qid": "math-m1-19", "type": "mcq", "passage": null, "stem": "In a certain state, the population of pheasants, a type of bird, is estimated each year by counting the number of pheasants observed along certain roads in the state. On average, each year from 2005 to 2015 the number of pheasants counted per mile of road decreased by 3.5% of the number of pheasants per mile of road the previous year. Based on this average, if there were 6.97 pheasants per mile of road in this state in 2005, which of the following best approximates the number of pheasants per mile of road in 2015?", "choices": {"A": "\\(0.965 (6.97)^{10}\\)", "B": "\\(1.035(6.97)^{10}\\)", "C": "\\(6.97(0.035)^{10}\\)", "D": "\\(6.97(0.965)^{10}\\)"}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "A 3.5% annual decrease multiplies by 0.965 each year for 10 years: 6.97(0.965)^10.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "A 3.5% yearly decrease multiplies by 0.965 each year for 10 years: 6.97(0.965)^10.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "A decrease of 3.5% each year means each year's value is \\(100\\%-3.5\\%=96.5\\%=0.965\\) times the previous year's value.\n\nThis is exponential decay: starting value times \\(0.965\\) for each year that passes.\n\nFrom 2005 to 2015 is 10 years, so the 2015 value is \\(6.97(0.965)^{10}\\).\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Advanced Math", "ski asure of one of these angles is \\((9x-190)\\). Which of the following could NOT be the sum of the measures of any two of these angles?", "choices": {"A": "\\((-18x +380)\\)", "B": "\\((-18x+740)\\)", "C": "\\((18x-380)\\)", "D": "180"}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "The angles are 9x - 190 and 370 - 9x, so the possible sums are 18x - 380, 740 - 18x and 180. -18x + 380 is not one of them.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "With angle t, possible sums of two angles are 2t, 360-2t, and 180; 18x-380 = 2t and 740-18x = 360-2t are possible, but -18x+380 = -2t is negative so it is impossible.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Let \\(\\theta = 9x - 190\\). Intersecting lines form two equal angles of measure \\(\\theta\\) and two equal angles of measure \\(180 - \\theta\\).\n\nPossible sums of two of the angles:\n\n- \\(\\theta + \\theta = 18x - 380\\) (choice C)\n- \\(\\theta + (180 - \\theta) = 180\\) (choice D)\n- \\((180 - \\theta) + (180 - \\theta) = 360 - 2(9x - 190) = 740 - 18x\\) (choice B)\n\nChoice A, \\(-18x + 380 = -2\\theta\\), is the opposite of \\(2\\theta\\). Since \\(\\theta\\) is an angle measure and is positive, \\(-2\\theta\\) is negative and cannot be a sum of angle measures.\n\n**Answer:** A", "source": "drafted", "answer_stated": "A", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Geometry and Trigonometry", "skill": "Lines, angles, and triangles", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #18 (csv 459)", "subject": "math", "originals": {}, "csv": {"passage": "Two lines intersect at exactly one point, forming two acute angles . care about: This aligns with the context. The narrator does not \"care about\" or show interest in what his sisters are doing.\nD. earn: This doesn't fit the context either, as \"earn\" relates to gaining something through effort, which isn't relevant to the activities mentioned.\nConclusion:\nCorrect Answer: C. care about\nReasoning: The phrase \"concern myself with\" in this context means the narrator does not care about or take an interest in the activities his sisters are involved in.", "source": "bank", "answer_stated": "C", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Words in Context", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #1 (csv 540)", "subject": "english", "originals": {}, "csv": {"passage": "The following text is from Rudolfo Anaya's 1972 novel \\(\\textit{Bless Me, Utma}\\). The young narrator is eating breakfast with his two sisters in their home in rural New Mexico.\n\\(\\hspace*{2em}\\) I sat across the table from Deborah and Teresa and ate my atole and the hot tortilla with butter. I said very little. I usually spoke very little to my two sisters. They were older than I and they were very close. They usually spent the entire day in the attic, playing dolls and giggling. I did not \\(\\underline{concern\\ myself\\ with\\ those}\\) things.", "question": "As used in the text, what does the phrase \"concern myself with\" most nearly mean?", "choices": {"A": "craft", "B": "get angry about", "C": "care about", "D": "earn"}}}, {"qid": "english-m1-02", "type": "mcq", "passage": "The percentage of US forest land that a 2023 federal report identified as being either mature or old growth exceeds other recent estimates. Given how little ______ there is among scientists regarding the scope of these categories, this discrepancy shouldn't be surprising: forest researchers regularly dispute one another's classifica  point about the Spanish language?", "choices": {"A": "It has served as a medium through which Indigenous languages have influenced English.", "B": "Its contribution to English vocabulary roughly equals the collective contribution by Indigenous languages.", "C": "It has borrowed words from Indigenous languages and contributed words to them.", "D": "It adopted Nahuatl and Taíno words in approximately equal numbers."}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "Both 'cocoa' (from Nahuatl) and 'iguana' (from Taíno) entered English through Spanish, so Spanish served as a medium for Indigenous influence on English.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "Both examples show words from Nahuatl and Taíno entering English through Spanish, so Spanish acted as a conduit.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The text gives examples of how words like \"cocoa\" and \"iguana\" came into English via Spanish, showing that Spanish served as a medium through which Indigenous languages influenced English (A).\n\nThere is no comparison of the Spanish contribution to English vocabulary to the collective contribution of Indigenous languages (B).\n\nThe text does not discuss Spanish contributing words to Indigenous languages (C).\n\nThe text mentions words from Nahuatl and Taino but does not compare their numbers (D).\n\nCorrect Answer:\nA. It has served as a medium through which Indigenous languages have influenced English.", "source": "bank", "answer_stated": "A", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Central Ideas and Details", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fi tement?", "choices": {"A": "2,185 square miles", "B": "707 square miles", "C": "6,963 square miles", "D": "1,583 square miles"}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "The table lists the Colville Tribes in Washington with an area of 2,185 square miles.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "The table lists Colville Tribes in Washington at 2,185 square miles.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The table lists the total areas of various tribal nations around the United States.\n\nThe Colville Tribes, located in Washington, have an area of 2,185 square miles.\n\nCorrect Answer:\nA. 2,185 square miles", "source": "bank", "answer_stated": "A", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #11 (csv 550)", "subject": "english", "originals": {"question": "sat/question_images/Screenshot_2024-10-14_102608.png"}, "csv": {"passage": "In terms of total area, the Navajo Nation is the largest tribal nation in the United States. It covers 24,425 square miles in Arizona, Colorado, and New Mexico. Most tribal nations in the US are much smaller. For example, the total area of the Muscogee Nation in Oklahoma is 4,867 square miles. And in Washington, the total area of the Colville Tribes is _____.", "question": "Which choice most effectively uses data from the table to complete the statement?", "choices": {"A": "2,185 square miles", "B": "707 square miles", "C": "6,963 square miles", "D": "1,583 square miles"}}}, {"qid": "english-m1-12", "type": "mcq", "passage": "Whi  claim that Mrs. Sommers experiences a shift in her sense of self as a result of putting on certain articles of clothing. The other choices describe her actions and practical nature but do not capture the transformation in her self-perception.", "source": "bank", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #13 (csv 552)", "subject": "english", "originals": {}, "csv": {"passage": "\"A Pair of Silk Stockings\" is an 1897 short story written by Kate Chopin. In the story, Chopin suggests that the protagonist, Mrs. Sommers, experiences a shift in her sense of self as a result of putting on certain articles of clothing, writing____", "question": "Which quotation from \"A Pair of Silk Stockings\" most effectively illustrates the claim?", "choices": {"A": "\"Mrs. Sommers was one who knew the value of bargains; who could stand for hours making her way inch by inch toward the desired object that was selling below cost.\"", "B": "\"She held back her skirts and turned her feet one way and her head another way as she glanced down at the polished pointed-tipped boots.\"", "C": "\"She would buy so and so many yards of percale for new shirt waists for the boys and Janie and Mag.\"", "D": "\"Her stockings and boots and well-fitting gloves had worked marvels in her bearing – had given her a feeling of assurance, a sense of belonging to the well-dressed multitude.\""}}}, {"qid": "english-m1-14", "type": "mcq", "passage": "A student in an economics course is examining the decline since 1950 in average hours worked per person per year in various nations due to both increased productivity and the adoption of policies that limit working hours. The first task in this investigation is to determine how the decline in Argentina compares to that in dom, and Mexico", "source": "bank", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["content issue: image_text_mismatch", "content issue: typo"], "reason": "Key D is correct (Argentina's -17% is a smaller decrease than Ireland's -28% and the UK's -24% but larger than Mexico's -7%); the 1995/1950 header error is in the bank's own figure, so I kept it as a figure issue and dropped the duplicate typo issue that named the question as its source.", "proof": null}, "proposed_fix": null, "label": "R&W M1 #14 (csv 553)", "subject": "english", "originals": {"question": "sat/question_images/Screenshot_2024-07-12_162505.png"}, "csv": {"passage": "A student in an economics course is examining the decline since 1950 in average hours worked per person per year in various nations due to both increased productivity and the adoption of policies that limit working hours. The first task in this investigation is to determine how the decline in Argentina compares to that in other countries. The student finds that _____.", "question": "Which choice most effectively uses data from the table to complete the student's conclusion?", "choices": {"A": "the decline in number of hours worked was greater in Argentina than it was in Ireland, the United Kingdom, or Mexico", "B": "while the number of hours worked rose in Argentina between 1950 and 2017, it declined in Ireland, the United Kingdom, and Mexico", "C": "though the percent decrease in hours worked in Argentina was greater than in Ireland and Mexico, it was less than that in the United Kingdom", "D": "though the percent decrease in hours worked in Argentina was less than that in Ireland and the United Kingdom, it was greater than that in Mexico"}}}, {"qid": "english-m1-15", "type": "mcq", "passage": "The Mammillaria ll, "label": "R&W M2 #7 (csv 573)", "subject": "english", "originals": {}, "csv": {"passage": "Rejane P. Oliveira and colleagues relied on historical DNA (hDNA) – genomic data incidentally preserved in specimens housed in natural history collections – to investigate the evolutionary trajectory of the Malagasy grass genus Chasechloa. Although this approach offers unique benefits, such as the ability to ascertain the biogeographical origins of organisms, it remains a relatively underutilized resource because hDNA is often to some extent degraded, a situation not easily remediable under current methodological paradigms and with extant DNA extraction and analysis technologies.", "question": "Information in the text best supports which statement about hDNA?", "choices": {"A": "It may yield insights that other types of genomic data cannot.", "B": "It may be underused because of its controversial status among scientists.", "C": "It has thus far proved valuable mainly to researchers studying flora.", "D": "It tends to be much more degraded than other types of DNA of comparable age."}}}, {"qid": "english-m2-08", "type": "mcq", "passage": "Meredith F. Protas and colleagues have explored how convergent evolution – a phenomenon that occurs when the same trait evolves independently in two reproductively separate lineages – can result from a genetic mechanism shared by both lineages. Meanwhile, Cynthia C. Steiner and colleagues have investigated how convergence occurs through different genetic mechanisms, but the relative prevalence of convergence through shared and different genetic processes is still poorly understood. This motivated biologists Delbert A. Green II and Cassandra G. Extavour to evaluate both types of convergence in a single study for their 2012 paper.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Green and Extavour’s study was conducted using data from the studies by Protas and colleagues and Steiner and colleagues.", "B": "Green and Extavour’s study addresses convergent evolution more comprehensively than the studies by Protas and colleagues and Steiner and colleagues do.", "C": "Both the study by Protas and colleagues and that by Green and Extavour compare convergence through shared genetic mechanisms to convergence through different genetic mechanisms.", "D": "Before Green and Extavour’s study, convergent evolution was assumed to require a shared genetic mechanism between two lineages that share the trait."}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "yellow", "risk_reasons": ["sonnet medium"], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "Earlier studies each examined one type of convergence, while Green and Extavour evaluated both types in a single study, a more comprehensive approach.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "medium", "reasoning": "Prior studies each covered one type of convergence, while Green and Extavour evaluated both types in a single study, so theirs is more comprehensive.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Main Idea Analysis of the Text:\n\nThe text discusses research on convergent evolution by Meredith F. Protas and colleagues, Cynthia C. Steiner and colleagues, and Delbert A. Green II and Cassandra G. Extavour. Here's the breakdown:\n\nProtas and colleagues:\n\nExplored how convergent evolution can result from a genetic mechanism shared by both lineages.\nSteiner and colleagues:\n\nInvestigated how convergence occurs through different genetic mechanisms.\nHighlighted that the prevalence of convergence through shared and different genetic processes is still poorly understood.\nGreen and Extavour:\n\nMotivated by the findings of Protas and Steiner, they evaluated both types of convergence (shared genetic mechanisms and different genetic mechanisms) in a single study in 2012.\nAnswer Choices Analysis:\n\nA) Green and Extavour’s study was conducted using data from the studies by Protas and colleagues and Steiner and colleagues.\n\nThis option is incorrect because the text does not state that Green and Extavour used data from Protas and Steiner. It only mentions that they were motivated by these studies.\nB) Green and Extavour’s study addresses convergent evolution more comprehensively than the studies by Protas and colleagues and Steiner and colleagues do.\n\nThis option is correct because the text implies that Green and Extavour's study aimed to evaluate both types of convergence in a single study, thus addressing convergent evolution more comprehensively than the individual studies by Protas and Steiner.\nC) Both the study by Protas and colleagues and that by Green and Extavour compare convergence through shared genetic mechanisms to convergence through different genetic mechanisms.\n\nThis option is incorrect because it misrepresents the main idea. It implies that both studies had the same focus, while the text emphasizes that Green and Extavour's study was motivated by the findings of the previous studies and aimed to address both types of convergence comprehensively.\nD) Before Green and Extavour’s study, convergent evolution was assumed to require a shared genetic mechanism between two lineages that share the trait.\n\nThis is not mentioned in the text. It talks about how convergence through different genetic mechanisms was investigated, not about assumptions before Green and Extavour’s study.\nCorrect Answer: B) Green and Extavour’s study addresses convergent evolution more comprehensively than the studies by Protas and colleagues and Steiner and colleagues do.\n\nExplanation:\n\nThe main idea is that Green and Extavour’s study, motivated by the previous studies of Protas and Steiner, aimed to evaluate both types of convergence (shared and different genetic mechanisms) in a single study. This comprehensive approach addresses convergent evolution more thoroughly than the individual studies by Protas and Steiner, which focused on specific aspects of convergence.", "source": "bank", "answer_stated": "B", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Central Ideas and Details", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver not sure: solver 2 medium"], "reason": "Key B stands: each earlier team studied one type of convergence while Green and Extavour evaluated both in one study, so theirs is more comprehensive; A, C and D are unsupported or contradicted.", "proof": null}, "proposed_fix": null, "label": "R&W M2 #8 (csv 574)", "subject": "english", "originals": {}, "csv": {"passage": "Meredith F. Protas and colleagues have explored how convergent evolution – a phenomenon that occurs when the same trait evolves independently in two reproductively separate lineages – can result from a genetic mechanism shared by both lineages. Meanwhile, Cynthia C. Steiner and colleagues have investigated how convergence occurs through different genetic mechanisms, but the relative prevalence of convergence through shared and different genetic processes is still poorly understood. This motivated biologists Delbert A. Green II and Cassandra G. Extavour to evaluate both types of convergence in a single study for their 2012 paper.", "question": "Which choice best states the main idea of the text?", "choices": {"A": "Green and Extavour’s study was conducted using data from the studies by Protas and colleagues and Steiner and colleagues.", "B": "Green and Extavour’s study addresses convergent evolution more comprehensively than the studies by Protas and colleagues and Steiner and colleagues do.", "C": "Both the study by Protas and colleagues and that by Green and Extavour compare convergence through shared genetic mechanisms to convergence through different genetic mechanisms.", "D": "Before Green and Extavour’s study, convergent evolution was assumed to require a shared genetic mechanism between two lineages that share the trait."}}}, {"qid": "english-m2-09", "type": "mcq", "passage": "Over time, marine mollusks called nautilids continually add segments to their shells, and the chemical composition of each segment is influenced by the available materials in the surrounding water when the segment forms. Paleontologist Amane Tajika and colleagues analyzed the septa (the walls between shell chambers) of one male (samples labeled “M”) and one female (samples labeled “F”) nautilid, finding that sample M06 had the same concentration of oxygen-18 as did water approximately 120 meters deep and that the oxygen-18 concentration in sample F14 matched that of water at approximately 385 meters deep. Tajika et al. concluded that sample M06 formed at a higher point in the water column than did F14.", "stem": "Which finding, if true, would most directly support the researchers’ conclusion?", "choices": {"A": "In nautilids, sex predicts septa growth rate more strongly than does oxygen-18 concentration in the surrounding water.", "B": "Regardless of sex, nautilids spend most of their lives at depths of 50 meters or greater, where oxygen-18 concentrations typically differ from those higher in the water column.", "C": "Male nautilids tend to show higher concentrations of oxygen-18 than do female nautilids inhabiting the same point in the water column.", "D": "Among nautilids, there is no effect of sex on the uptake of oxygen-18 from water or its deposition in septa."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "The conclusion compares a male sample with a female sample using oxygen-18 as a depth marker, which is valid only if sex does not affect how oxygen-18 is taken up and deposited in septa.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "If sex does not affect oxygen-18 uptake or deposition, the differing concentrations reflect depth rather than sex, supporting the conclusion.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "\"Among nautilids, there is no effect of sex on the uptake of oxygen-18 from water or its deposition in septa.\"\nThis finding supports the researchers' conclusion because it eliminates the variable of sex as a factor affecting oxygen-18 concentration in the septa. If sex did not influence the uptake or deposition of oxygen-18, the difference in oxygen-18 concentrations must be due to the depth at which the nautilids lived when the septa formed. This directly supports the conclusion that the male sample formed at a higher depth than the female sample.\nExplanation of Incorrect Answers:\n\nA) \"In nautilids, sex predicts septa growth rate more strongly than does oxygen-18 concentration in the surrounding water.\"\n\nThis option is irrelevant to the conclusion about the depth at which the samples formed. It focuses on growth rate rather than oxygen-18 concentration.\nB) \"Regardless of sex, nautilids spend most of their lives at depths of 50 meters or greater, where oxygen-18 concentrations typically differ from those higher in the water column.\"\n\nWhile this statement might provide some context about nautilid behavior, it doesn't directly support the specific conclusion about the difference in formation depth of the samples based on oxygen-18 concentrations.\nC) \"Male nautilids tend to show higher concentrations of oxygen-18 than do female nautilids inhabiting the same point in the water column.\"\n\nThis option contradicts the researchers' findings because if males generally have higher oxygen-18 concentrations than females at the same depth, the difference observed in the samples could be due to sex rather than depth. This undermines the conclusion.\nIn summary, option D is the best answer because it directly supports the researchers' conclusion by ruling out sex as a confounding factor in the concentration of oxygen-18, thereby reinforcing the conclusion that the differences in oxygen-18 concentrations are due to the different depths at which the samples formed.", "source": "bank", "answer_stated": "D", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M2 #9 (csv 575)", "subject": "english", "originals": {}, "csv": {"passage": "Over time, marine mollusks called nautilids continually add segments to their shells, and the chemical composition of each segment is influenced by the available materials in the surrounding water when the segment forms. Paleontologist Amane Tajika and colleagues analyzed the septa (the walls between shell chambers) of one male (samples labeled “M”) and one female (samples labeled “F”) nautilid, finding that sample M06 had the same concentration of oxygen-18 as did water approximately 120 meters deep and that the oxygen-18 concentration in sample F14 matched that of water at approximately 385 meters deep. Tajika et al. concluded that sample M06 formed at a higher point in the water column than did F14.", "question": "Which finding, if true, would most directly support the researchers’ conclusion?", "choices": {"A": "In nautilids, sex predicts septa growth rate more strongly than does oxygen-18 concentration in the surrounding water.", "B": "Regardless of sex, nautilids spend most of their lives at depths of 50 meters or greater, where oxygen-18 concentrations typically differ from those higher in the water column.", "C": "Male nautilids tend to show higher concentrations of oxygen-18 than do female nautilids inhabiting the same point in the water column.", "D": "Among nautilids, there is no effect of sex on the uptake of oxygen-18 from water or its deposition in septa."}}}, {"qid": "english-m2-10", "type": "mcq", "passage": "Callie W. Babbitt, Hema Madaka, and colleagues assembled a database of materials used in consumer electronics by studying products in the lab and by gathering data from similar product studies. The team gave each of these studies a rating for level of traceability (with a higher rating for clearer descriptions of procedures) and for category consistency (with a higher rating for using materials categories more closely aligned with the categories in the team’s database). Based on these ratings, a second research team concluded that the methodology was better explained in a study by Greg L. Kozak and Gregory A. Keoleian than it was in a study by Martin Streicher-Porte and colleagues.", "stem": "Which finding, if true, would most directly challenge the second research team’s conclusion?", "choices": {"A": "The study by Kozak and Keoleian had a lower consistency rating than the study by Streicher-Porte and colleagues did.", "B": "The study by Kozak and Keoleian had a high consistency rating and a high traceability rating.", "C": "The study by Streicher-Porte and colleagues had a medium consistency rating and a medium traceability rating.", "D": "The study by Kozak and Keoleian had a lower traceability rating than the study by Streicher-Porte and colleagues did."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "Traceability ratings measure how clearly procedures (methodology) were described. A lower traceability rating for Kozak and Keoleian than for Streicher-Porte would directly contradict the claim that Kozak's methodology was better explained.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "a rming on net CO2 balance in Alaska, concluding that net CO2 is likely to increase if warming hastens spring snow melt.", "stem": "Which finding, if true, would most directly support the researchers’ conclusion?", "choices": {"A": "Early snow melt reduces the amount of soil moisture available for the growth of plant species such as C. canadensis, and it raises the rate of heterotrophic respiration.", "B": "Early snow melt extends the period in which plant species such as C. canadensis can absorb CO2, but has no effect on the rate of heterotrophic respiration.", "C": "Early snow melt slows the growth of plant species such as C. canadensis by reducing soil insulation, and it suppresses heterotrophic respiration.", "D": "Early snow melt amplifies the effect of solar radiation on the growth of plant species such as C. canadensis and on the rate of heterotrophic respiration."}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "typo", "severity": "content", "source": "question", "detail": "The passage splices in a stray fragment from choice A: \"but also potentially enabling Early snow melt reduces the amount of soil moisture available for the increased CO2 output through greater heterotrophic respiration\".", "by": "opus"}], "risk": "yellow", "risk_reasons": ["content: typo", "transcription medium", "opus medium", "sonnet medium"], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "medium", "reasoning": "Net CO2 rises if uptake by plants falls while respiration output rises; A gives both effects. The passage contains a stray inserted fragment ('Early snow melt reduces the amount of soil moisture available for the'), but the logic is still clear.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "medium", "reasoning": "Early melt that reduces moisture for plant growth (less CO2 absorption) and raises heterotrophic respiration (more CO2 output) would raise net CO2, supporting the conclusion. The passage text is garbled but this still fits.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Explanation of Correct Answer (A):\n\n\"Early snow melt reduces the amount of soil moisture available for the growth of plant species such as C. canadensis, and it raises the rate of heterotrophic respiration.\"\n\nThis finding directly supports the researchers' conclusion that net CO2 is likely to increase if warming hastens spring snow melt. It links the early snow melt to reduced soil moisture, which in turn affects both plant growth and the rate of heterotrophic respiration (CO2 output).\n\nExplanation of Incorrect Answers:\n\nB) \"Early snow melt extends the period in which plant species such as C. canadensis can absorb CO2, but has no effect on the rate of heterotrophic respiration.\"\n\nThis finding contradicts the researchers' conclusion by stating that early snow melt has no effect on heterotrophic respiration, which is a critical part of their argument.\n\nC) \"Early snow melt slows the growth of plant species such as C. canadensis by reducing soil insulation, and it suppresses heterotrophic respiration.\"\n\nThis finding also contradicts the researchers' conclusion by indicating that early snow melt suppresses heterotrophic respiration, whereas the researchers suggest that it would increase heterotrophic respiration.\n\nD) \"Early snow melt amplifies the effect of solar radiation on the growth of plant species such as C. canadensis and on the rate of heterotrophic respiration.\"\n\nWhile this finding mentions an effect on both plant growth and heterotrophic respiration, it does not specify that early snow melt reduces soil moisture or directly links to the increase in CO2. It is less direct in supporting the conclusion compared to option A.\n\nIn summary, option A most directly supports the researchers' conclusion by clearly linking early snow melt to reduced soil moisture and increased heterotrophic re <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';
  return String(s).split(/\n\s*\n/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}
function card(q){
  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
