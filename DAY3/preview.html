nts; 4x + y = 46 multiplied by 6 gives 24x + 6y = 276.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "Slope = (70-94)/(-6+12) = -4 and y = 46 at x = 0, so 4x + y = 46, i.e. 24x + 6y = 276.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Find the slope using two points, \\((-12, 94)\\) and \\((12, -2)\\): \\(m = \\frac{-2 - 94}{12 - (-12)} = \\frac{-96}{24} = -4\\).\n\nUse the point \\((12, -2)\\) to find the intercept: \\(-2 = -4(12) + b\\), so \\(b = 46\\). The line is \\(y = -4x + 46\\), or \\(4x + y = 46\\).\n\nNone of the choices has coefficients 4 and 1, so multiply both sides by 6: \\(24x + 6y = 276\\).\n\nCheck with \\((-12, 94)\\): \\(24(-12) + 6(94) = -288 + 564 = 276\\).\n\n**Answer:** B", "source": "drafted", "answer_stated": "B", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Algebra", "skill": "Linear equations in two variables", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #14 (csv 582)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-22_at_13.00.02.png"}, "csv": {"passage": null, "question": "", "choices": {"A": "24x + 6y = 46", "B": "24x + 6y = 276", "C": "24y + 6x = 46", "D": "6x + 24y = 276"}}}, {"qid": "math-m1-15", "type": "mcq", "passage": null, "stem": "\\[ y = 2x^2 - 19x + 40 \\]\n\n\\[ y = x + a \\]\n\nIn the given system of equations, \\(a\\) is a constant. The graphs of the equations in the given system intersect at exactly one point, \\((x, y)\\), in the \\(xy\\)-plane. What is the value of \\(x\\)?", "choices": {"A": "-10", "B": "-5", "C": "5", "D": "10"}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "Setting equal gives 2x^2 - 20x + (40 - a) = 0; exactly one solution means a double root at x = 20/(2*2) = 5.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "Setting equal gives 2x^2 - 20x + 40 - a = 0; one intersection means a double root, so x = 20/4 = 5.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The graphs intersect where the \\(y\\)-values are equal: \\(2x^2 - 19x + 40 = x + a\\), which gives \\(2x^2 - 20x + (40 - a) = 0\\).\n\nExactly one intersection point means this quadratic has exactly one solution, so its discriminant is 0: \\((-20)^2 - 4(2)(40 - a) = 0\\).\n\nSimplify: \\(400 - 320 + 8a = 0\\), so \\(a = -10\\).\n\nSubstitute \\(a = -10\\): \\(2x^2 - 20x + 50 = 0\\), so \\(x^2 - 10x + 25 = 0\\) and \\((x - 5)^2 = 0\\). Thus \\(x = 5\\).\n\n(Shortcut: a quadratic with one solution has it at \\(x = -\\frac{b}{2a} = \\frac{20}{4} = 5\\).)\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Advanced Math", "skill": "Nonlinear equations in one variable and systems of equations in two variables", "difficulty": "hard", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M1 #15 (csv 583)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-22_at_13.01.37.png"}, "csv": {"passage": null, "question": "", "choices": {"A": "-10", "B": "-5", "C": "5", "D": "10"}}}, {"qid": "math-m1-16", "type": "grid_in", "passage": null, "stem": "Line \\(p\\) in the \\(xy\\)-plane is defined by \\(y = x + \\frac{5}{9}\\) and passes through the points \\((a, 0)\\) and \\((0, b)\\), where \\(a\\) and \\(b\\) are constants. What is the value of \\(a\\)?", "choices": null, "bank_key": "-5/9", "key": "-5/9", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"sol ", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "18", "confidence": "high", "reasoning": "9p - 54 = 108 gives 9p = 162, so p = 18.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "18", "confidence": "high", "reasoning": "Original total is 108 + 54 = 162, and 162 / 9 = 18.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Let \\(p\\) be the original price of one shirt, in dollars. The 9 shirts cost \\(9p\\) before the coupon.\n\nAfter the $54 coupon, the cost is $108:\n\n\\[ 9p - 54 = 108 \\]\n\nAdd 54 to both sides: \\(9p = 162\\).\n\nDivide by 9: \\(p = 18\\).\n\n**Answer:** 18", "source": "drafted", "answer_stated": "18", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Algebra", "skill": "Linear equations in one variable", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #13 (csv 604)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-22_at_13.41.39.png"}, "csv": {"passage": null, "question": "", "choices": null}}, {"qid": "math-m2-14", "type": "mcq", "passage": null, "stem": "The maximum temperature on April 1, in degrees Fahrenheit (\\(^\\circ\\)F), was recorded each year at a certain weather station for 11 years. The histogram summarizes the recorded data set.\n\n![Histogram of maximum temperature on April 1 (degrees F) versus number of years; bins of width 5 from 40 to 80 with counts 1, 2, 3, 3, 1, 0, 0, 1](r2:sat/question_images/Screenshot_2024-07-22_at_13.42.07.png)\n\nThe temperature of \\(78.2^\\circ\\)F is removed from this data set to create a new data set of 10 temperatures. Which of the following statements must be true?\n\nI. The mean of the new data set is less than the mean of the original data set.\nII. The median of the new data set is less than the median of the original data set.", "choices": {"A": "I only", "B": "II only", "C": "I and II", "D": "Neither I nor II"}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "78.2 is the maximum value, so removing it must lower the mean. The original median is the 6th value and the new median averages the 5th and 6th, both in the 50-55 bin; they could be equal, so the median need not decrease.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "78.2 is above the mean so removing it lowers the mean (I true). The original median is the 6th value in the 50-55 bin; the new median is the average of the original 5th and 6th values, both in 50-55 and possibly equal, so II need not be true.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Read the bar heights from the histogram (counts for the bins 40-45, 45-50, 50-55, 55-60, 60-65, 65-70, 70-75, 75-80): 1, 2, 3, 3, 1, 0, 0, 1. That is 11 years in total. The value 78.2 is in the last bar.\n\n**Statement I.** Every other temperature is below 65, so 78.2 is larger than all of them and therefore larger than the mean of the original data set. Removing a value that is above the mean lowers the mean. Statement I must be true.\n\n**Statement II.** The original median is the 6th of 11 values. The bar counts add up to 1, 3, 6 through the 50-55 bin, so the 6th value is in 50-55. The new median is the average of the 5th and 6th values, which are both in 50-55 and are unchanged by the removal.\n\nThat average is less than the 6th value only if the 5th value is smaller than the 6th. If they are equal, the median stays the same. The histogram does not tell us which, so Statement II does not have to be true.\n\nOnly Statement I must be true.\n\n**Answer:** A", "source": "drafted", "answ \), so it equals the sum of the two remote interior angles:\n\n\\[ x + y = (3x + 5) + (2x + 9) = 5x + 14 \\]\n\nThis gives \\(y = 4x + 14\\).\n\nThe three angles of triangle \\(PQR\\) add to 180:\n\n\\[ (3x + 5) + (2x + 9) + (4y + 5) = 180 \\quad\\Rightarrow\\quad 5x + 4y = 161 \\]\n\nSubstitute \\(y = 4x + 14\\): \\(5x + 16x + 56 = 161\\), so \\(21x = 105\\) and \\(x = 5\\).\n\nThen \\(y = 4(5) + 14 = 34\\), and \\(x + y = 5 + 34 = 39\\).\n\n**Answer:** 39", "source": "drafted", "answer_stated": "39", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Geometry and Trigonometry", "skill": "Lines, angles, and triangles", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #17 (csv 608)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-22_at_13.44.37.png"}, "csv": {"passage": null, "question": "", "choices": null}}, {"qid": "math-m2-18", "type": "mcq", "passage": null, "stem": "The triangle inequality theorem states that the sum of any two sides of a triangle must be greater than the length of the third side. If a triangle has side lengths of 8 and 13, which inequality represents the possible lengths, \\(x\\), of the third side of the triangle?", "choices": {"A": "\\(x < 21\\)", "B": "\\(x > 21\\)", "C": "\\(5 < x < 21\\)", "D": "\\(x > 21\\) or \\(x < 5\\)"}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "choice_formatting", "severity": "cosmetic", "source": "question", "detail": "The CSV choices use small-form Unicode comparison signs (e.g. \"x ﹤ 21\", \"5 ﹤x﹤ 21\") instead of ordinary < and >.", "by": "sonnet"}], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "The third side must exceed 13 - 8 = 5 and be less than 13 + 8 = 21.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "Third side must be greater than 13 - 8 = 5 and less than 8 + 13 = 21.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "For a triangle with sides 8, 13 and \\(x\\), the sum of any two sides must be greater than the third side.\n\n- \\(8 + 13 > x\\), so \\(x < 21\\).\n- \\(8 + x > 13\\), so \\(x > 5\\).\n- \\(13 + x > 8\\) is true for every positive \\(x\\), so it adds no new limit.\n\nCombining the first two results gives \\(5 < x < 21\\).\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Geometry and Trigonometry", "skill": "Lines, angles, and triangles", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #18 (csv 609)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-22_at_13.44.59.png"}, "csv": {"passage": null, "question": "", "choices": {"A": "x ﹤ 21", "B": "x ﹥ 21", "C": "5 ﹤x﹤ 21", "D": "x ﹥ 21 or x ﹤5"}}}, {"qid": "math-m2-19", "type": "mcq", "passage": null, "stem": "A right circular cone has a volume of \\(2{,}700\\pi\\) cubic centimeters and the area of its base is \\(225\\pi\\) square centimeters. What is the slant height, in centimeters, of this cone?", "choices": {"A": "12", "B": "15", "C": "36", "D": "39"}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "V = (1/3)Bh gives 2700 = 75h, so h = 36; r = 15 from the base area, so the slant height is sqrt(36^2 + 15^2) = 39.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "Base area gives r = 15; V = (1/3)(225pi)h = 2700pi gives h = 36; slant height = sqrt(36^2 + 15^2) = 39.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The base is a circle, so \\(\\pi r^2 = 225\\pi\\). Then \\(r^2 = 225\\) and \\(r = 15\\).\n\nUse the cone volume formula \\(V = \\frac{1}{3}\\pi r^2 h\\):\n\n\\[ \\frac{1}{3}(225\\pi)h = 2700\\pi \\quad\\Rightarrow\\quad 75h = 2700 \\quad\\Rightarrow\\quad h = 36 \\]\n\nThe radius, height and slant height \\(\\ell\\) form a right triangle, with \\(\\ell\\) as the hypotenuse:\n\n\\[ \\ell = \\sqrt{15^2 + 36^2} = \\sqrt{225 + 1296} = \\sqrt{1521} = 39 \\]\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Geometry and Trigonometry", "skill": "Area and volume", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #19 (csv 610)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-22_at_13.47.17.png"}, "csv": {"passage": null, "question": "", "choices": {"A": "12", "B": "15", "C": "36", "D": "39"}}}, {"qid": "math-m2-20", "type": "grid_in", "passage": null, "stem": "A quadratic function models the height, in feet, of an object above the ground in terms of the time, in seconds, after the object was launched. According to the model, the object was launched from a height of 0 feet and reached its maximum height of 1,600 feet 10 seconds after it was launched. Based on the model, what was the height, in feet, of the object 15 seconds after it was launched?", "choices": null, "bank_key": "1200", "key": "1200", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "1200", "confidence": "high", "reasoning": "h(t) = a(t - 10)^2 + 1600 with h(0) = 0 gives a = -16, so h(15) = -16(25) + 1600 = 1200.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "1200", "confidence": "high", "reasoning": "f(t) = a(t-10)^2 + 1600 with f(0) = 0 gives a = -16; f(15) = -16(25) + 1600 = 1200.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The graph of a quadratic function is symmetric about its vertex. The maximum height is the vertex, so the vertex is \\((10, 1600)\\) and\n\n\\[ h(t) = a(t - 10)^2 + 1600 \\]\n\nwith \\(a < 0\\).\n\nThe object starts at height 0, so \\(h(0) = 0\\):\n\n\\[ a(0 - 10)^2 + 1600 = 0 \\quad\\Rightarrow\\quad 100a = -1600 \\quad\\Rightarrow\\quad a = -16 \\]\n\nNow find the height at \\(t = 15\\):\n\n\\[ h(15) = -16(15 - 10)^2 + 1600 = -16(25) + 1600 = 1200 \\]\n\nThe object is 1200 feet high 15 seconds after launch.\n\n**Answer:** 1200", "source": "drafted", "answer_stated": "1200", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Advanced Math", "skill": "Nonlinear functions", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #20 (csv 611)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-22_at_13.47.54.png"}, "csv": {"passage": null, "question": "", "choices": null}}, {"qid": "math-m2-21", "type": "mcq", "passage": null, "stem": "The cost of renting a power washer is $92 for the first day and $46 for each additional day. Which of the following functions gives the cost \\(C(d)\\), in dollars, of renting the power washer for \\(d\\) days, where \\(d\\) is a positive integer?", "choices": {"A": "\\(C(d) = 46d + 46\\)", "B": "\\(C(d) = 46d + 92\\)", "C": "\\(C(d) = 92d - 46\\)", "D": "\\(C(d) = 92d + 138\\)"}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "C(d) = 92 + 46(d - 1) = 46d + 46.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "C(d) = 92 + 46(d - 1) = 46d + 46.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The first day costs $92. Each of the other \\(d - 1\\) days costs $46, so\n\n\\[ C(d) = 92 + 46(d - 1) \\]\n\nDistribute: \\(C(d) = 92 + 46d - 46\\).\n\nCombine like terms: \\(C(d) = 46d + 46\\).\n\nCheck with \\(d = 1\\): \\(46 + 46 = 92\\), which matches the cost of the first day.\n\n**Answer:** A", "source": "drafted", "answer_stated": "A", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Algebra", "skill": "Linear functions", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #21 (csv 612)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-22_at_13.48.14.png"}, "csv": {"passage": null, "question": "", "choices": {"A": "C(d) = 46d + 46", "B": "C(d) = 46d + 92", "C": "C(d) = 92d - 46", "D": "C(d) = 92d + 138"}}}, {"qid": "math-m2-22", "type": "mcq", "passage": null, "stem": "The function \\(f\\) is defined by \\(f(x) = ax^2 + bx + c\\), where \\(a\\), \\(b\\), and \\(c\\) are constants. The graph of \\(y = f(x)\\) in the \\(xy\\)-plane passes through the points \\((9, 0)\\) and \\((-2, 0)\\). If \\(a\\) is an integer greater than 1, which of the following could be the value of \\(a + b\\)?", "choices": {"A": "8", "B": "7", "C": "-6", "D": "-12"}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "f(x) = a(x - 9)(x + 2) = a(x^2 - 7x - 18), so b = -7a and a + b = -6a; with a = 2, a + b = -12.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "f(x) = a(x-9)(x+2) = a x^2 - 7a x - 18a, so b = -7a and a + b = -6a; for integer a > 1 this is a multiple of -6 at most -12, so -12 (a = 2).", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The graph passes through \\((9, 0)\\) and \\((-2, 0)\\), so 9 and \\(-2\\) are the zeros of \\(f\\). Write the function in factored form:\n\n\\[ f(x) = a(x - 9)(x + 2) = a(x^2 - 7x - 18) \\]\n\nMatching with \\(ax^2 + bx + c\\) gives \\(b = -7a\\).\n\nSo \\(a + b = a - 7a = -6a\\).\n\nSince \\(a\\) is an integer greater than 1, \\(a + b\\) is \\(-12\\) (for \\(a = 2\\)), \\(-18\\), \\(-24\\), and so on. Of the choices, only \\(-12\\) is possible. The value \\(-6\\) would need \\(a = 1\\), which is not allowed.\n\n**Answer:** D", "source": "drafted", "answer_stated": "D", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Advanced Math", "skill": "Nonlinear functions", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "Math M2 #22 (csv 613)", "subject": "math", "originals": {"question": "sat/question_images/Screenshot_2024-07-22_at_13.49.20.png"}, "csv": {"passage": null, "question": "", "choices": {"A": "8", "B": "7", "C": "-6", "D": "-12"}}}, {"qid": "english-m1-01", "type": "mcq", "passage": "The way in which individual elements are balanced within a photographic image tends to affect how viewers perceive it: symmetry tends to give the elements equal importance, asymmetry emphasizes differences, and radial balance (organizing the elements around a central point) emphasizes the center over the periphery. What a photograph conveys is therefore largely ______ how it is balanced.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "reserved for", "B": "inhibited by", "C": "contingent on", "D": "obligated to"}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "The text says balance determines how viewers perceive a ph <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)

  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';

    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}
function card(q){
  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
