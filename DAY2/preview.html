:root{--bg:#f6f6f8;--card:#fff;--ink:#16141d;--muted:#666;--line:#e3e3e8;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--accent:#6d4ad6}

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}

.head b{font-size:16px}.chip{border-radius:999px;padding:1px 9px;font-size:13px;color:#fff}
.green{background:var(--green)}.yellow{background:var(--yellow)}.red{background:var(--red)}
.muted{color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.cols{grid-template-columns:1fr}}

.choice{display:flex;gap:8px;margin:4px 0;align-items:baseline}.choice p{margin:0}.choice .l{font-weight:600;min-width:1.4em}.choice.key .l{color:var(--green)}
table{border-collapse:collapse;margin:6px 0}td,th{border:1px solid var(--line);padding:3px 8px}
ul.issues{margin:6px 0;padding-left:20px}details{margin-top:8px}summary{cursor:pointer;color:var(--muted)}
pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:var(--bg);padding:8px;border-radius:6px}

ause it accurately describes the structure of the text.", "source": "bank", "answer_stated": "C", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Craft and Structure", "skill": "Text Structure and Purpose", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #6 (csv 708)", "subject": "english", "originals": {}, "csv": {"passage": "In what is now Washington state, the Tulalip Tribes operate the Hibulb Cultural Center. Relying on traditional knowledge to guide the design of exhibits, this institution presents Tulalip history and culture to the tribes’ citizens. The Turtle Mountain Band of Chippewa, a tribe in North Dakota, employs a similar strategy in its own cultural center. Both centers contrast with museums that aren’t Indigenous-led; when displaying Indigenous artifacts, such museums tend to anticipate mainly non-Indigenous audiences and rely on Euro-centric strategies for designing exhibits.", "question": "Which choice best describes the overall structure of the text?", "choices": {"A": "It describes how tribal cultural centers designed exhibits of a particular set of artifacts, then analyzes how non-Indigenous institutions designed exhibits of the same artifacts.", "B": "It examines how tribal citizens respond to exhibits at tribal cultural centers, then speculates how non-Indigenous audiences would respond to the same exhibits.", "C": "It discusses two cultural centers operated by tribes, then compares them with non-Indigenous institutions that present Indigenous exhibits.", "D": "It outlines an early strategy for exhibit design used by one tribal cultural center, then explains a newer strategy used by a different tribal cultural center."}}}, {"qid": "english-m1-07", "type": "mcq", "passage": "**Text 1**\n\nThe University of Wisconsin and the online class provider Coursera are two of the many institutions offering training programs in entrepreneurship. But ence topic submissions.", "B": "In 2019, there were more physics and space science topic submissions than there were medicine and health topic submissions.", "C": "The lowest number of animal science topic submissions in a year was approximately 95 in 2016.", "D": "The highest number of medicine and health topic submissions during the period shown is approximately 285 in 2019."}}}, {"qid": "english-m1-12", "type": "mcq", "passage": "Claudine at School is a 1900 novel by Colette, originally written in French. The narrator is a fifteen-year-old girl living in a small, rural town. She presents herself as having a strong emotional attachment to the surrounding forests: ______", "stem": "Which quotation from a translation of Claudine at School most effectively illustrates the claim?", "choices": {"A": "“If I had a Mamma, I know very well that she would not have let me stay [in Montigny] twenty-four hours. But Papa—he doesn’t notice anything and doesn’t bother about me.”", "B": "“And then there are my favourites, the great woods that are sixteen and twenty years old. It makes my heart bleed to see one of those cut down.”", "C": "“Green meadows make rifts in [the woods] here and there, so do little patches of cultivation. But these do not amount to much, for the magnificent woods devour everything. As a result, this lovely region is atrociously poor and its few scattered farms provide just the requisite number of red roofs to set off the velvety green of the woods.”", "D": "“Under the firs, you light a fire, even in summer, because it’s forbidden; you cook any old thing, an apple, a pear; a potato stolen from a field, some wholemeal bread if you’ve nothing better.”"}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "The claim is about the narrator's personal emotional attachment to the forests. B calls the woods 'my favourites' and says 'it makes my heart bleed' to see one cut down, which shows that feeling directly.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "The claim is about a strong emotional attachment to the forests. Only B shows that, with 'It makes my heart bleed to see one of those cut down.'", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "**Context Clues:**\n\nThe text asks for a quotation that shows the narrator's strong emotional attachment to the forests.\n\nThe quotation should express deep feelings or a personal connection to the forests.\n\n**Choices Evaluation:**\n\nA. This quotation talks about the narrator's parents and does not express an emotional attachment to the forests.\n\nB. This quotation directly expresses the narrator's favorite woods and her emotional pain (\"makes my heart bleed\") at seeing them cut down. This clearly shows a strong emotional attachment.\n\nC. This quotation describes the landscape and the impact of the woods on the region but does not directly express an emotional attachment.\n\nD. This quotation describes an activity done in the woods but does not convey strong emotions or attachment.\n\n**Conclusion:**\n\nThe best choice is B (\"And then there are my favourites, the great woods that are sixteen and twenty years old. It makes my heart bleed to see one of those cut down\") because it explicitly expresses the narrator's emotional connection and distress at the loss of the woods, illustrating her strong attachment.", "source": "bank", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "easy", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #12 (csv 714)", "subject": "english", "originals": {}, "csv": {"passage": "Claudine at School is a 1 231132.png)", "stem": "Which choice most effectively uses data from the graph to complete the assertion?", "choices": {"A": "difference between mean forest patch size in Class VIII and in Class VI in 2000.", "B": "steady increase in mean forest patch size from 1960 to 1979, followed by a more sudden increase in 1986 for all classes.", "C": "increase in mean forest patch size after 1986 in all classes.", "D": "similarity in mean forest patch size in Class VIII and Class VII in 1986."}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [{"kind": "grammar", "severity": "cosmetic", "source": "question", "detail": "The passage ends with the awkward \"there was a (an) ______\", where the article is hedged as \"a (an)\".", "by": "opus"}], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "The assertion is about the effect of new conservation policies, so it needs a recovery in patch size. The graph shows all three classes rising from 1986 to 2000 after a sharp drop.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "C", "confidence": "high", "reasoning": "In the graph, mean patch size rises from 1986 to 2000 in all three classes, which fits the effect of new conservation policies. B is wrong because sizes fall from 1979 to 1986. D is wrong because Class VIII and VII differ in 1986.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "The text says new conservation policies led to a change in forest patch size, so the answer must describe a change in the graph that fits the effect of such policies: forest patches getting larger.\n\nOn the graph, mean patch size in all three classes falls sharply from 1979 to 1986, then rises from 1986 to 2000. Class VIII goes from about 37 to about 60 hectares, Class VII from about 27 to about 49, and Class VI from about 20 to about 35.\n\nChoice C states this increase after 1986 in all classes, so it is supported by the graph and fits the effect of conservation policies.\n\n- A: It describes a difference between two classes in 2000. That is a comparison at one moment, not an effect of the policies.\n- B: It is false. Patch size did not increase in 1986; it dropped sharply in all classes.\n- D: It describes how similar two classes were in 1986. That is also a comparison at one moment, not a change caused by the policies.\n\n**Answer:** C", "source": "drafted", "answer_stated": "C", "bank_status": "wrong", "disputed_quote": "Introduces unnecessary details (1960 to 1979) not mentioned in the passage, making it less relevant.", "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["bank explanation wrong"], "reason": "Key C stands: all three classes rise from 1986 to 2000 (about 37 to 60, 27 to 49, 20 to 35), which fits the effect of conservation policies; the bank explanation misstates why B is wrong, and the drafted explanation is accurate.", "proof": null}, "proposed_fix": null, "label": "R&W M1 #13 (csv 715)", "subject": "english", "originals": {"question": "sat/question_images/Screenshot_2024-07-20_231132.png"}, "csv": {"passage": "To understand the extent of deforestation in the Chorotega region of Costa Rica, Juan Pablo Arroyo-Mora and colleagues used historical aerial photography and remote sensing data to track changes in the annual mean size of forest patches across different land use capability classes (categories that indicate possible uses of forest land). Due to the implementation of new conservation policies in the Chorotega region, there was a (an) __________", "question": "Which choice most effectively uses data from the graph to complete the assertion?", "choices": {"A": "difference between mean forest patch size in Class VIII and in Class VI in 2000.", "B": "steady increase in mean forest patch size from 1960 to 1979, followed by a more sudden increase in 1986 for all classes.", "C": "increase in mean forest patch size after 1986 in all classes.", "D": "similarity in mean forest patch size in Class VIII and Class VII in 1986."}}}, {"qid": "english-m1-14", "type": "mcq", "passage": "Veronica L. Bura, Akito Y. Kawahara, and Jayne E. Yack investigated the evolution and function of sound production in silk moth and hawk moth caterpillars. They found that during harmless simulated attacks on isolated caterpillars, 33% of the tested species produced sound, which ranged from clicks in Actias luna to whistles in Rhodinia fugax. Although some insects use sound to communicate with members of the same species, the researchers claim that the caterpillar sounds recorded in their study are directed primarily at predators.", "stem": "Which finding, if true, would most directly support Bura and colleagues’ claim?", "choices": {"A": "In most cases, the sound that a caterpillar species produced during simulated attacks was not produced by other caterpillar species during simulated attacks.", "B": "Chickens and yellow warblers, two predators of caterpillars, have been observed to stop their attacks in response to caterpillar sounds.", "C": "Each caterpillar species tended to produce one sound during simulated attacks, although individuals occasionally made a variety of other sounds during simulated attacks as well.", "D": "Caterpillar clicks were emitted in a frequency detectable by birds that prey on caterpillars, but caterpillar whistles were not."}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "If predators such as chickens and warblers stop attacking when caterpillars make sounds, the sounds are aimed at predators and work as a defense. That directly supports the claim.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "The claim is that the sounds are directed at predators. Predators stopping their attacks when they hear the sounds is the most direct support for it.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "**Context Clues:**\n\nThe text claims that caterpillar sounds are directed primarily at predators.\n\nThe key is to find evidence that supports the idea that the sounds deter predators.\n\n**Choices Evaluation:**\n\nA. This option discusses the uniqueness of sounds among different species but does not address the effect on predators.\n\nB. This option directly supports the claim by showing that predators (chickens and yellow warblers) stop their attacks in response to caterpillar sounds, indicating the sounds are effective against predators.\n\nC. This option discusses the variety of sounds produced but does not directly support the claim about the sounds being directed at predators.\n\nD. This option discusses the detectability of sounds by birds but does not provide evidence that the sounds stop predator attacks.\n\n**Conclusion:**\n\nThe best choice is B (\"Chickens and yellow warblers, two predators of caterpillars, have been observed to stop their attacks in response to caterpillar sounds\") because it directly supports the claim that the caterpillar sounds are intended to deter predators.", "source": "bank", "answer_stated": "B", "bank_status": "usable", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": null, "proposed_fix": null, "label": "R&W M1 #14 (csv 716)", "subject": "english", "originals": {}, "csv": {"passage": "Veronica L. Bura, Akito Y. Kawahara, and Jayne E. Yack investigated the evolution and function of sound production in silk moth and hawk moth caterpillars. They found that during harmless simulated attacks on isolated caterpillars, 33% of the tested species produced sound, which ranged from clicks in Actias luna to whistles in Rhodinia fugax. Although some insects use sound to communicate with members of the same species, the researchers claim that the caterpillar sounds recorded in their study are directed primarily at predators.", "question": "Which finding, if true, would most directly support Bura and colleagues’ claim?", "choices": {"A": "In most cases, the sound that a caterpillar species produced during simulated attacks was not produced by other caterpillar species during simulated attacks.", "B": "Chickens and yellow warblers, two predators of caterpillars, have been observed to stop their attacks in response to caterpillar sounds.", "C": "Each caterpillar species tended to produce one sound during simulated attacks, although individuals occasionally made a variety of other sounds during simulated attacks as well.", "D": "Caterpillar clicks were emitted in a frequency detectable by birds that prey on caterpillars, but caterpillar whistles were not."}}}, {"qid": "english-m1-15", "type": "mcq", "passage": "In dialects of English spoken in Scotland, the “r” sound is strongly emphasized when it appears at the end of syllables (as in “car”) or before other consonant sounds (as in “bird”). English dialects of the Upland South, a region stretching from Oklahoma to western Virginia, place similar emphasis on “r” at the ends of syllables and before other consonant sounds. Historical records show that the Upland South was colonized largely by people whose ancestors came from Scotland. Thus, linguists have concluded that ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "the English dialects spoken in the Upland South acquired their emphasis on the “r” sound from dialects spoken in Scotland.", "B": "emphasis on the “r” sound will eventually spread from English dialects spoken in the Upland South to dialects spoken elsewhere.", "C": "the English dialects spoken in Scotland were influenced by dialects spoken in the Upland South.", "D": "people from Scotland abandoned their emphasis on the “r” sound after relocating to the Upland South."}, "bank_key": "A", "key": "A", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "A", "confidence": "high", "reasoning": "Both dialects share the same 'r' emphasis, and the Upland South was settled largely by people of Scottish descent. The logical conclusion is that the Upland South dialects got this feature from Scottish dialects.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "A", "confidence": "high", "reasoning": "The Upland South was colonized largely by people with Scottish ancestry, and its dialects share the emphasized 'r'. The logical conclusion is that the dialects inherited the trait from Scotland.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "**Context Clues:**\n\nThe text points out a strong similarity between the emphasis on the \"r\" sound in both Scottish dialects and the dialects of the Upland South.\n\nIt also mentions that the Upland South was colonized by people from Scotland.\n\n**Choices Evaluation:**\n\nA. This choice logically completes the text by suggesting that the English dialects in the Upland South acquired their emphasis on the \"r\" sound from Scottish dialects, which aligns with the historical colonization mentioned.\n\nB. This choice is speculative and does not explain the historical connection.\n\nC. This choice incorrectly suggests that Scottish dialects were influenced by the Upland South dialects, which is not supported by the historical timeline provided.\n\nD. This choice contradicts the evidence presented in the text, which indicates that the emphasis on the \"r\" sound persisted in both regions.\n\n**Conclusion:**\n\nThe best choi h Hand #1", "B": "painting, Gun with Hand #1,", "C": "painting Gun with Hand #1,", "D": "painting, Gun with Hand #1"}, "bank_key": "C", "key": "B", "verdict": "key_wrong", "proposed_key": "B", "issues": [{"kind": "wrong_key", "severity": "content", "source": "question", "detail": "Bank key C treats the title as a restrictive appositive after the indefinite phrase \"a ... oil painting\"; the title is nonrestrictive and needs commas on both sides, so the correct answer is B.", "by": "opus"}], "risk": "red", "risk_reasons": ["verdict key_wrong"], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "medium", "reasoning": "Because 'a ... oil painting' is indefinite, the title is a nonrestrictive appositive set off by a pair of commas, and the closing comma also introduces the nonrestrictive 'which' clause. C treats the title as restrictive, which is possible but less fitting after an indefinite article.", "matches_key": true, "matches_bank_key": false}, {"solver": "sonnet", "answer": "C", "confidence": "medium", "reasoning": "The title is essential since Celmins made other paintings (no commas), while the 'which was created in 1964' clause is nonessential and needs a comma before 'which'.", "matches_key": false, "matches_bank_key": true}], "explanation": {"text": "The phrase before the blank, \"a 24.5-by-34.5-inch oil painting,\" uses the article \"a,\" so it does not point to one specific painting. The title that follows, *Gun with Hand #1*, just names that painting. It adds information but is not needed to identify which painting is meant, so it is a nonessential appositive. A nonessential appositive is set off with a comma before it and a comma after it.\n\nThe comma after the title also comes right before \"which was created in 1964 by American artist Vija Celmins,\" a nonessential clause that should follow a comma.\n\n- A is wrong: it has no commas, so neither the title nor the \"which\" clause is set off.\n- C is wrong: it leaves out the comma before t <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';
  return String(s).split(/\n\s*\n/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}
function card(q){
  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
