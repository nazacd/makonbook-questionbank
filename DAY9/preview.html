ing that it swells or shrinks as its moisture level changes. Civil engineer Jay X. Wang has noted that the effects of expansive soil appear slowly in the form of gradually growing cracks in foundations, walls, and pavements. Because these effects are incremental and can generally be repaired (though at some cost), structures in South Dakota are typically not built to resist them.\n\n**Text 2**\n\nIn a 2021 study, Rubayet Bin Mostafiz and colleagues calculated that in the state of Louisiana alone, the annual cost of damage caused by expansive soils reaches nearly $90 million. But they note that this damage can be mitigated: building vapor barriers between structural foundations and the soil can significantly reduce the effects of soil swelling and shrinking.", "stem": "Based on the texts, how would Rubayet Bin Mostafiz and colleagues (Text 2) most likely respond to the information presented in Text 1?", "choices": {"A": "They would suggest that engineers in South Dakota consider the cost of reinforcing the vapor barriers between existing structural foundations and the soil.", "B": "They would argue that engineers in South Dakota have misjudged the effectiveness of the techniques they use to reduce the effects of expansive soil.", "C": "They would encourage engineers in South Dakota to insert vapor barriers between new structures’ foundations and the surrounding soil.", "D": "They would recommend that engineers in South Dakota measure the moisture level in the soil beneath proposed structures before beginning construction."}, "bank_key": "C", "key": "C", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "C", "confidence": "high", "reasoning": "Text 1 says South Dakota structures typically aren't built to resist expansive-soil effects, while Text 2 says vapor barriers between foundations and soil mitigate damage, so the authors would encourage using vapor barriers in new cons e strictly truthful works.", "B": "Painting is a superior form of art to mapmaking.", "C": "Historians are more interested in the lives of famous people than in those of the less famous.", "D": "The lives of historical figures are usually documented as a collection of facts, rather than as a representation of their personalities."}, "bank_key": "D", "key": "D", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "D", "confidence": "high", "reasoning": "The text says historical figures are mere names to us, and compares the historian's knowledge to a map: accurate but cold, without the lifelike charm of a painting. So the records hold facts, not a sense of the person.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "D", "confidence": "high", "reasoning": "The text says historians convey past people as names and facts, like a map, lacking the lifelike quality of a painting, so D.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice D is the best answer because the text compares the cold and factual representation of historical figures by historians to the more vivid and charming representation that could be achieved through artistic means, like landscape painting. This suggests that historical accounts are often lacking in personal detail and character.\n\nChoice A: While the text does suggest that historical accounts are factual, it does not focus on the creativity of historians or their restrictions. The main point is about the lack of personal detail.\nChoice B: The text does not compare painting to mapmaking. Instead, it uses the metaphor of painting to describe how historical figures are represented.\nChoice C: The text does not discuss the historians’ interest in famous versus less famous people. It focuses on the representation of historical figures in general.", "source": "bank", "answer_stated": "D", "bank oses literary realism with folklore. This statement directly addresses the combination of realistic plot elements with disruptions caused by folklore, aligning with the description of the novel's style in the question.\n\nChoice A is incorrect because it does not directly address the juxtaposition of literary realism with folklore as explicitly as the correct answer. It mentions the influence of folklore but not its interplay with realistic elements.\nChoice C is incorrect because, although it discusses the alternation between realistic and antirealistic modes, it does not highlight the productive disruption of realism by folklore, which is central to the claim being supported.\nChoice D is incorrect because, while it acknowledges the influence of both Chinese folklore and Latin American magical realism, it does not focus on the specific dynamic of disrupting realism with folkloric elements, which is essential to supporting the underlined claim.", "source": "bank", "answer_stated": "B", "bank_status": "minor_issue", "disputed_quote": null, "by": "sonnet"}, "tags": {"domain": "Information and Ideas", "skill": "Command of Evidence (Textual)", "difficulty": "medium", "difficulty_source": "estimate"}, "adjudication": {"by": "opus", "why": ["solver not sure: solver 1 medium", "solver not sure: solver 2 medium"], "reason": "Key B is correct: only B describes a realistic plot set against Chinese folkloric material, the juxtaposition the underlined claim makes, while A omits realism and C and D stress alternation or influence; both cosmetic typos in issues_so_far are real and kept.", "proof": null}, "proposed_fix": null, "label": "R&W M2 #13 (csv 363)", "subject": "english", "originals": {}, "csv": {"passage": "Scholars cite Mr. President, the 1946 novel by Guatemalan author Miguel Angel Asturias, as a foundational text of magical realism, the Latin American style of fiction in which antirealistic plot devices often borrowed from the folkloric traditions of Indigenous and c  want to ensure that a comprehensive range of information is secured, they must ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "recognize that Indigenous languages likely have more unique expressions that represent ecological knowledge than represent other types of information.", "B": "incorporate the preservation of songs into their broader efforts to protect Indigenous languages.", "C": "analyze musical similarities in the songs of the Warlpiri and Kaluli people.", "D": "acknowledge that Indigenous songs are largely but not entirely composed using phrases taken from spoken language."}, "bank_key": "B", "key": "B", "verdict": "key_correct", "proposed_key": null, "issues": [], "risk": "green", "risk_reasons": [], "blind_solves": [{"solver": "opus", "answer": "B", "confidence": "high", "reasoning": "Preservation efforts have focused on spoken language, but some expressions appear only in songs. A comprehensive effort must therefore also preserve the songs.", "matches_key": true, "matches_bank_key": true}, {"solver": "sonnet", "answer": "B", "confidence": "high", "reasoning": "Since some expressions exist only in songs and efforts focus on spoken language, they must include songs in preservation.", "matches_key": true, "matches_bank_key": true}], "explanation": {"text": "Choice B is the best answer because it directly addresses the need mentioned in the text for preserving the unique expressions found in Indigenous songs. The passage explains that some ecological information is conveyed specifically through songs, which have not been the primary focus of language preservation efforts. By incorporating the preservation of songs into these efforts, a comprehensive range of information, including ecological knowledge embedded in music, can be secured.\n\nChoice A is incorrect because, while it recognizes the uniqueness of expressions in Indigenous languages, it does not suggest a solution for preserving the information contained in t <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s,br){
  const math=[];s=s.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
    .replace(/!\[([^\]]*)\]\(r2:([^)\s]*)\)/g,(m,a,k)=>D.img[k]?`<img alt="${a}" title="${a}" src="${D.img[k]}">`:`[figure: ${a}]`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
  if(br)s=s.replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>esc(math[+i]));
}
function md(s){
  if(s==null)return '';
  return String(s).split(/\n\s*\n/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>l.trim().startsWith('|'))){
      const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      return '<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';
    }
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+inline(b,true)+'</p>';
  }).join('');
}
function card(q){
  const ch=q.choices?Object.entries(q.choices).map(([l,t])=>`<div class="choice ${l===q.key?'key':''}"><span class="l">${l}</span><div>${md(t)}</div></div>`).join(''):`<p><b>Answer:</b> ${esc(q.key)}</p>`;
  const solves=q.blind_solves.map(s=>`${esc(s.solver)}: <b>${esc(s.answer)}</b> (${s.confidence})${s.matches_key?'':' ✗'}`).join(' · ');
  const issues=q.issues.length?'<ul class="issues">'+q.issues.map(i=>`<li><b>${i.severity}</b> ${i.kind} (${i.source}, ${esc(i.by)}): ${esc(i.detail)}</li>`).join('')+'</ul>':'';
  const orig=Object.entries(q.originals).map(([s,k])=>D.img[k]?`<div class="muted">${s}</div><img src="${D.img[k]}">`:'').join('');
  const csv=`<pre>${esc([q.csv.passage,q.csv.question,q.csv.choices&&Object.entries(q.csv.choices).map(([l,t])=>l+') '+t).join('\n')].filter(Boolean).join('\n\n'))}</pre>`;
  return `<section class="q" data-risk="${q.risk}" data-subject="${q.subject}">
  <div class="head"><b>${esc(q.label)}</b><span class="chip ${q.risk}">${q.risk}</span><span>${q.verdict}</span>
  <span class="muted">key ${esc(q.bank_key)}${q.proposed_key?` → <b>${esc(q.proposed_key)}</b>`:''} · ${solves} · ${esc(q.tags.domain)} / ${esc(q.tags.skill)} · ${q.tags.difficulty} (estimate)</span></div>
  ${q.risk_reasons.length?`<div class="muted">${esc(q.risk_reasons.join('; '))}</div>`:''}
  ${q.adjudication?`<div><b>Adjudication:</b> ${esc(q.adjudication.reason)}${q.adjudication.proof?`<br><span class="muted">${esc(q.adjudication.proof)}</span>`:''}</div>`:''}
  ${issues}
  ${q.proposed_fix?`<details><summary>Proposed fix</summary><pre>${esc(JSON.stringify(q.proposed_fix,null,1))}</pre></details>`:''}
  <div class="cols"><div class="content">${md(q.passage)}${md(q.stem)}${ch}</div><div class="orig">${orig}<details><summary>CSV text</summary>${csv}</details></div></div>
  <details><summary>Explanation (${q.explanation.source}; bank ${q.explanation.bank_status})</summary><div class="content">${md(q.explanation.text)}</div>
  ${q.explanation.disputed_quote?`<p class="muted">Disputed in the bank's explanation: “${esc(q.explanation.disputed_quote)}”</p>`:''}</details>
  </section>`;
}
document.getElementById('list').innerHTML=D.q.map(card).join('');
const F={risk:'all',subject:'all'};
function apply(){let n=0;document.querySelectorAll('.q').forEach(e=>{const ok=(F.risk==='all'||e.dataset.risk===F.risk)&&(F.subject==='all'||e.dataset.subject===F.subject);e.style.display=ok?'':'none';n+=ok});document.getElementById('n').textContent=n+' shown';
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v))}
document.getElementById('f').innerHTML=[['risk','all'],['risk','red'],['risk','yellow'],['risk','green'],['subject','all'],['subject','english'],['subject','math']]
  .map(([k,v])=>`<button data-k="${k}" data-v="${v}">${k==='subject'&&v==='all'?'both subjects':v==='english'?'R&W':v}</button>`).join(' ');
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;apply()});apply();
addEventListener('DOMContentLoaded',()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}));
</script></body></html>
